# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: beacon

before:
  hooks:
    - go mod tidy
    - bash -c 'cd ../beacon-hooks && go mod tidy'
    - rm -rf ./release-collectors
    - mkdir -p ./release-collectors/darwin_amd64 ./release-collectors/darwin_arm64 ./release-collectors/linux_amd64 ./release-collectors/linux_arm64
    - cp ../../collector-builder/dist/beacon-otelcol/darwin_amd64/beacon-otelcol ./release-collectors/darwin_amd64/beacon-otelcol
    - cp ../../collector-builder/dist/beacon-otelcol/darwin_arm64/beacon-otelcol ./release-collectors/darwin_arm64/beacon-otelcol
    - cp ../../collector-builder/dist/beacon-otelcol/linux_amd64/beacon-otelcol ./release-collectors/linux_amd64/beacon-otelcol
    - cp ../../collector-builder/dist/beacon-otelcol/linux_arm64/beacon-otelcol ./release-collectors/linux_arm64/beacon-otelcol
    # Package the external threat-rule pack (repo rules/, not embedded in the binary)
    # as a release asset users install with `beacon rules pull <asset-url>`.
    - bash -c 'mkdir -p release-rules && COPYFILE_DISABLE=1 tar --exclude="._*" --exclude=".DS_Store" -czf release-rules/threat-rules.tar.gz -C ../.. rules'

builds:
  - id: beacon
    main: .
    binary: beacon
    env:
      - CGO_ENABLED=0
    flags:
      - -a
    ldflags:
      - -s -w
      - -X github.com/asymptote-labs/agent-beacon/cli/beacon/internal/version.Version={{.Version}}
      - -X github.com/asymptote-labs/agent-beacon/cli/beacon/internal/version.GitCommit={{.ShortCommit}}
      - -X github.com/asymptote-labs/agent-beacon/cli/beacon/internal/version.BuildDate={{.Date}}
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    hooks:
      pre:
        # Build the hooks binary for this target platform and embed it.
        # IMPORTANT: This writes to a shared hooks.bin file. Run GoReleaser with
        # --parallelism 1 so target builds cannot race here. The -a flag above
        # forces a full rebuild for each target so Go re-reads the freshly-built
        # hooks.bin instead of serving a stale copy from cache.
        - cmd: bash -c 'cd ../beacon-hooks && GOOS={{ .Os }} GOARCH={{ .Arch }} go build -ldflags "-s -w -X github.com/asymptote-labs/agent-beacon/cli/beacon-hooks/internal/version.Version={{ .Version }}" -o ../beacon/internal/embedded/hooks.bin .'
          output: true
  - id: beacon-hooks
    dir: ../beacon-hooks
    main: .
    binary: beacon-hooks
    env:
      - CGO_ENABLED=0
    flags:
      - -a
    ldflags:
      - -s -w
      - -X github.com/asymptote-labs/agent-beacon/cli/beacon-hooks/internal/version.Version={{.Version}}
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    ids:
      - beacon
      - beacon-hooks
    files:
      - README*
      - src: release-collectors/{{ .Os }}_{{ .Arch }}/beacon-otelcol
        dst: beacon-otelcol

nfpms:
  # Native packages are the Linux counterpart of the signed macOS .pkg: installing one should
  # produce a running system-mode endpoint, not a pile of binaries plus a manual step. The payload
  # deliberately mirrors /opt/beacon so that selfupdate's classifyInstall recognises a package
  # install and seamless updates work the same way on both platforms.
  - id: beacon
    package_name: beacon
    ids:
      - beacon
      - beacon-hooks
    vendor: Asymptote Labs
    homepage: https://docs.asymptotelabs.ai
    maintainer: Asymptote Labs <support@asymptotelabs.ai>
    description: |-
      Endpoint telemetry agent for AI coding agents.
      Captures prompts, commands, file activity, tokens and approvals from local agent
      runtimes and writes normalized events to local or customer-managed destinations.
    license: MIT
    formats:
      - deb
      - rpm
    # Not FHS, and deliberately: /opt is the correct home for a self-contained vendor bundle,
    # it matches the macOS package layout, and selfupdate keys off this path.
    bindir: /opt/beacon/bin
    contents:
      - src: ../../collector-builder/dist/beacon-otelcol/linux_{{ .Arch }}/beacon-otelcol
        dst: /opt/beacon/bin/beacon-otelcol
        file_info:
          mode: 0755
      - src: ../../packaging/linux/install-endpoint.sh
        dst: /opt/beacon/scripts/install-endpoint.sh
        file_info:
          mode: 0755
      - src: ../../packaging/linux/uninstall-endpoint.sh
        dst: /opt/beacon/scripts/uninstall-endpoint.sh
        file_info:
          mode: 0755
    scripts:
      postinstall: ../../packaging/linux/nfpm/postinstall.sh
      preremove: ../../packaging/linux/nfpm/preremove.sh
      postremove: ../../packaging/linux/nfpm/postremove.sh
    # systemd is required for the service backend the package registers. Without it the endpoint
    # falls back to a supervised collector that nothing restarts, which is not what a package
    # install should silently deliver.
    dependencies:
      - systemd
    rpm:
      group: Applications/System
      scripts:
        # rpm runs the outgoing package's %preun after the incoming package's %post during an
        # upgrade, so an older package can stop the service the new one just started -- and nothing
        # in the new package can change what the old script does. %posttrans runs last in the
        # transaction, which makes it the only place that can have the final say.
        posttrans: ../../packaging/linux/nfpm/posttrans.sh
    deb:
      fields:
        Bugs: https://github.com/asymptote-labs/agent-beacon/issues

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - Merge pull request
      - Merge branch
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Bug Fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Other
      order: 999

brews:
  - name: beacon
    repository:
      owner: asymptote-labs
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: https://asymptotelabs.ai
    description: "Open-source endpoint agent for local AI runtime telemetry"
    license: "MIT"
    commit_author:
      name: asymptote-bot
      email: bot@asymptotelabs.ai
    commit_msg_template: "Homebrew formula update for {{ .ProjectName }} version {{ .Tag }}"
    install: |
      bin.install "beacon"
      bin.install "beacon-hooks"
      bin.install "beacon-otelcol"
    caveats: |
      To configure local endpoint telemetry, run:
        beacon endpoint install
    test: |
      system "#{bin}/beacon", "version"

release:
  github:
    owner: asymptote-labs
    name: agent-beacon
  draft: false
  prerelease: auto
  # The macOS package job in .github/workflows/release.yml attaches signed .pkg
  # assets + update-manifest.json to the same release. append keeps reruns or
  # future job ordering changes from failing on an existing release.
  mode: append
  name_template: "v{{.Version}}"
  extra_files:
    # The threat-rule pack ships as a separate asset, not embedded in the binary,
    # so the rule corpus can grow without enlarging `beacon`.
    - glob: ./release-rules/threat-rules.tar.gz
  footer: |
    ## Installation

    ### Homebrew (macOS/Linux)
    ```bash
    brew tap asymptote-labs/tap
    brew install beacon
    ```

    ### Manual Download
    Download the appropriate archive for your platform from the assets below, extract it, and add the binary to your PATH.

    ## Quick Start
    ```bash
    beacon endpoint install
    beacon endpoint status
    beacon endpoint wazuh print-config
    ```

    ## Threat detection rules
    `beacon` ships with a small built-in baseline. Install the full threat-rule
    pack (attached as `threat-rules.tar.gz` below) and scan your local telemetry:
    ```bash
    beacon rules pull https://github.com/asymptote-labs/agent-beacon/releases/download/v{{.Version}}/threat-rules.tar.gz
    beacon rules list
    beacon scan
    ```
