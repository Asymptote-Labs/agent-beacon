id: git-history-rewrite
spec: threat-rules/v1.3  # needed for args and predicates
version: 6
title: Git history rewritten (filter-branch / filter-repo / interactive rebase)
description: >
  A history-rewriting git subcommand was invoked: filter-branch,
  filter-repo, an interactive rebase (rebase -i / --interactive), a
  commit amend after a previous commit (commit --amend) of HEAD
  rather than a fresh root, or a replace operation. Rewriting
  published history is a forensics-evasion primitive — once pushed,
  the new history no longer contains evidence of the original
  commits, and a re-clone by an unsuspecting collaborator pulls the
  rewritten history. The rule is anchored on the git binary at a
  command boundary and matches the well-known history-rewriting
  subcommands. A `git rebase` without --interactive (fast-forward
  merge) does not rewrite authored history and is excluded. The command
  is found by what the line runs: a git command, also under sudo, by
  path, inside `bash -c` or after git's own options (`git -C dir commit
  --amend`), whose subcommand and words say so. The same words in a
  commit message, an echo or a here-document do not fire. The text patterns
  are asked of the text that reaches a command the parser cannot see into
  (unread_text).
severity: medium
status: experimental
posture: detect
taxonomy:
  beacon_category: source-control
  owasp_llm: LLM03

# The subcommand is the first word after git's own options (git_subcommand). filter-repo
# is also installed as a program of its own, git-filter-repo. The text named a replace
# option git does not have (--convert-forkpoint) until version 5; both halves now name
# --convert-graft-file.
match: >
  e.event.action == "command.executed" && (
    e.command.parsed_commands.exists(c,
      c.name == "git" && git_subcommand(c, "(?:filter-(?:branch|repo)|rebase\\n(?:[^\\n]*\\n)*?(?:-[rqvnfmp]*i[rqvnfmp]*|--interactive)|commit\\n(?:[^\\n]*\\n)*?--amend|replace\\n(?:--?[A-Za-z][^\\n]*\\n)*?(?:--edit|--graft|--convert-graft-file))(?:\\n|\\z)") ||
      c.name.matches("^git-filter-(branch|repo)$")
    ) ||
    unread_text(e, t, (t.matches("(?i)(^|[;&|]\\s*|\\bsudo\\s+|\\bgit\\s+)\\s*([A-Za-z_][A-Za-z0-9_]*=(\"[^\"]*\"|'[^']*'|[^\\s;&|]*)\\s+)*git\\b[^;&|]*\\bfilter-(branch|repo)\\b") ||
      t.matches("(?i)(^|[;&|]\\s*|\\bsudo\\s+|\\bgit\\s+)\\s*([A-Za-z_][A-Za-z0-9_]*=(\"[^\"]*\"|'[^']*'|[^\\s;&|]*)\\s+)*git\\b[^;&|]*\\brebase\\b[^;&|]*(\\s-i\\b|\\s--interactive\\b)") ||
      t.matches("(?i)(^|[;&|]\\s*|\\bsudo\\s+|\\bgit\\s+)\\s*([A-Za-z_][A-Za-z0-9_]*=(\"[^\"]*\"|'[^']*'|[^\\s;&|]*)\\s+)*git\\b[^;&|]*\\bcommit\\b[^;&|]*\\s--amend\\b") ||
      t.matches("(?i)(^|[;&|]\\s*|\\bsudo\\s+|\\bgit\\s+)\\s*([A-Za-z_][A-Za-z0-9_]*=(\"[^\"]*\"|'[^']*'|[^\\s;&|]*)\\s+)*git\\b[^;&|]*\\breplace\\b\\s+(--edit|--graft|--convert-graft-file)")))
  )

emit:
  reason: "Git history rewritten (filter-branch / filter-repo / rebase -i / commit --amend / replace)"

tests:
  - name: filter_branch
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "git filter-branch --tree-filter 'rm -f credentials' HEAD" }
        session: { id: s1 }
  - name: filter_repo
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "git filter-repo --path secrets.txt --invert-paths" }
        session: { id: s1 }
  - name: interactive_rebase
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "git rebase -i HEAD~5" }
        session: { id: s1 }
  - name: interactive_rebase_long
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "git rebase --interactive origin/main" }
        session: { id: s1 }
  - name: commit_amend
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "git commit --amend -m 'fix typo'" }
        session: { id: s1 }
  - name: git_replace
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "git replace --edit oldsha newsha" }
        session: { id: s1 }
  - name: filter_branch_env_prefix
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "FILTER_BRANCH_SQUELCH_WARNING=1 git filter-branch --index-filter 'git rm --cached -q secrets.env' HEAD" }
        session: { id: s1 }
  - name: interactive_rebase_sequence_editor
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "GIT_SEQUENCE_EDITOR=\"sed -i -e 's/^pick/squash/'\" git rebase -i HEAD~3" }
        session: { id: s1 }
  - name: env_prefix_ordinary_commit
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "GIT_AUTHOR_DATE=now git commit -m 'add feature'" }
        session: { id: s1 }
  - name: ordinary_rebase
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "git rebase origin/main" }
        session: { id: s1 }
  - name: ordinary_commit
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "git commit -m 'add feature'" }
        session: { id: s1 }
  - name: echo_mention
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "echo 'git filter-branch rewrites history' > notes.md" }
        session: { id: s1 }
  - name: commit_amend_under_sudo
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "sudo git commit --amend --no-edit" }
        session: { id: s1 }
  - name: interactive_rebase_inside_a_shell_script
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "bash -c 'cd /srv/repo && git rebase -i HEAD~4'" }
        session: { id: s1 }
  - name: commit_amend_by_absolute_path_after_git_options
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "/usr/bin/git -C /srv/repo -c commit.gpgsign=false commit -q --amend --no-edit" }
        session: { id: s1 }
  - name: filter_repo_as_its_own_program
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "git-filter-repo --path notes.txt --invert-paths" }
        session: { id: s1 }
  - name: replace_from_a_graft_file
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "git replace --convert-graft-file" }
        session: { id: s1 }
  - name: commit_amend_through_a_wrapper_the_parser_does_not_look_through
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "ssh build@host.example 'cd /srv/repo && git commit --amend --no-edit'" }
        session: { id: s1 }
  - name: commit_amend_run_by_rebase_for_every_commit
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "git rebase -q --exec 'git commit -q --amend --no-edit -S' origin/main" }
        session: { id: s1 }
  - name: commit_amend_named_in_a_commit_message
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "git add -A && git commit -m 'docs: prefer a new commit to git commit --amend or git rebase -i'" }
        session: { id: s1 }
  - name: filter_branch_named_in_a_here_document
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "cat > NOTES.md <<'EOF'\ngit filter-branch --tree-filter 'rm -f big.bin' HEAD\ngit commit --amend\nEOF" }
        session: { id: s1 }
  - name: rebase_that_continues
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "git add docs/changelog.md && git rebase --continue" }
        session: { id: s1 }
  - name: log_of_commits_that_mention_amend
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "git log --oneline --grep='commit --amend' | head -5" }
        session: { id: s1 }
  - name: amend_given_to_a_script_the_parser_cannot_see_into
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "./release.sh 'cd repo; git commit --amend --no-edit'" }
        session: { id: s1 }
  - name: rebase_in_a_commit_message_beside_a_script
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "git commit -m 'docs: avoid sudo git rebase -i on main' && ./run-tests.sh" }
        session: { id: s1 }
  # The text half named --convert-forkpoint, which git does not have, until version 5.
  - name: replace_option_handed_to_a_script
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "./rewrite.sh 'cd repo && git replace --convert-graft-file'" }
        session: { id: s1 }
