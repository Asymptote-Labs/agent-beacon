id: git-force-push-to-protected
spec: threat-rules/v1.3  # needed for args and predicates
version: 3
title: Force-push directed at a protected branch
description: >
  A git push with --force, --force-with-lease, -f, or a leading +
  refspec targets a protected branch (main, master, develop,
  release/*, production), either by name or as the destination of
  a src:dst refspec such as HEAD:main or x:refs/heads/main. Force-pushing a protected branch can
  rewrite the canonical project history, drop commits, or land
  unreviewed code into the production line. From an agent session
  this is almost always unauthorized and indicates either an
  attacker forcibly overwriting the protected history or a
  misconfigured agent bypassing the branch-protection gate. The
  rule requires BOTH a force flag (--force, --force-with-lease, -f,
  or + refspec) AND a target in the protected-branch list. A force
  push to a feature branch (which git itself permits and many teams
  allow) does not fire; nor does an ordinary push to main. The push is found
  by what the line runs: a git command, also under sudo, by path, inside
  `bash -c` or after git's own options (`git -C dir push -f origin main`),
  whose subcommand is push and whose words after it hold the force option
  and the protected destination. The same words in a commit message, an
  echo or a here-document do not fire. A line the parser cannot vouch for
  (see command_unread) is matched on its text.
severity: high
status: experimental
posture: detect
taxonomy:
  beacon_category: source-control
  owasp_llm: LLM03

# The subcommand is the first word after git's own options, of which -C, -c, --git-dir,
# --work-tree and --namespace take the next word as their value; a word whose value is
# unknown (`git $OPTS push`) is passed over as an option. The destination is a whole word
# after push: the branch, or a refspec that ends in it (HEAD:main, x:refs/heads/main), so
# main:feature/x, feature/main and a directory given to -C are not one. A force option is
# read as written (argv_raw), since `--force-with-lease=main:$old` is an empty word in
# args; any word that begins --force counts, as it did in the text.
match: >
  e.event.action == "command.executed" && (
    e.command.parsed_commands.exists(c, c.name == "git" && (
      c.args.matches("\\A(?:(?:-C|-c|--git-dir|--work-tree|--namespace)\\n[^\\n]*\\n|--?[A-Za-z][^\\n]*\\n|\\n)*push\\n(?:[^\\n]*\\n)*?(?:(?:[^\\n:+-][^\\n:]*)?:)?(?:refs/heads/)?(?i:main|master|develop|production|release/[^\\n]+)(?:\\n|\\z)") && (
        c.args.matches("(?m)^-[vqnud46]*f[vqnud46]*$") ||
        c.argv_raw.exists(a, a.matches("^[\"']?--force\\b"))) ||
      c.args.matches("\\A(?:(?:-C|-c|--git-dir|--work-tree|--namespace)\\n[^\\n]*\\n|--?[A-Za-z][^\\n]*\\n|\\n)*push\\n(?:[^\\n]*\\n)*?\\+(?:[^\\n:]*:)?(?:refs/heads/)?(?i:main|master|develop|production|release/[^\\n]+)(?:\\n|\\z)")
    )) ||
    ((e.command.command.matches("(?i)(^|[;&|]\\s*|\\bsudo\\s+)\\s*git\\b[^;&|]*\\bpush\\b[^;&|]*(\\s--force(-with-lease)?\\b|\\s-f\\b)[^;&|]*(?:^|\\s|:)(?:refs/heads/)?(main|master|develop|production|release/[^\\s;&|]+)(?:\\s|$)") ||
      e.command.command.matches("(?i)(^|[;&|]\\s*|\\bsudo\\s+)\\s*git\\b[^;&|]*\\bpush\\b[^;&|]*(?:^|\\s|:)(?:refs/heads/)?(main|master|develop|production|release/[^\\s;&|]+)(\\s[^;&|]*)?(\\s--force(-with-lease)?\\b|\\s-f\\b)") ||
      e.command.command.matches("(?i)(^|[;&|]\\s*|\\bsudo\\s+)\\s*git\\b[^;&|]*\\bpush\\b[^;&|]*\\+\\s*([^\\s;&|:]*:)?(?:refs/heads/)?(main|master|develop|production|release/[^\\s;&|]+)(?:\\s|$)")) &&
      command_unread(e))
  )

emit:
  reason: "Force-push directed at a protected branch (main / master / develop / production / release/*)"

tests:
  - name: force_push_to_main
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "git push --force origin main" }
        session: { id: s1 }
  - name: force_push_to_master_f
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "git push -f origin master" }
        session: { id: s1 }
  - name: force_push_force_with_lease_to_main
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "git push --force-with-lease origin main" }
        session: { id: s1 }
  - name: force_push_to_release_branch
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "git push --force origin release/v1.2" }
        session: { id: s1 }
  - name: plus_refspec_to_main
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "git push origin +main" }
        session: { id: s1 }
  - name: force_push_branch_then_force
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "git push origin main --force" }
        session: { id: s1 }
  - name: force_push_head_refspec_to_main
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "git push --force origin HEAD:main" }
        session: { id: s1 }
  - name: force_push_full_ref_to_master
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "git push -f origin my-fix:refs/heads/master" }
        session: { id: s1 }
  - name: plus_refspec_head_to_main
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "git push origin +HEAD:main" }
        session: { id: s1 }
  - name: force_push_main_to_feature
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "git push --force origin main:feature/x" }
        session: { id: s1 }
  - name: force_push_main_to_feature_trailing_flag
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "git push origin main:feature/x --force" }
        session: { id: s1 }
  - name: force_push_to_main_prefixed_branch_trailing_flag
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "git push origin HEAD:main-backup --force" }
        session: { id: s1 }
  - name: force_push_to_feature_branch
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "git push --force origin feature/x" }
        session: { id: s1 }
  - name: ordinary_push_to_main
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "git push origin main" }
        session: { id: s1 }
  - name: force_push_mention
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "echo 'never git push -f main' > notes.md" }
        session: { id: s1 }
  - name: force_push_to_feature_main
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "git push --force origin feature/main" }
        session: { id: s1 }
  - name: force_push_to_fix_main_bug
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "git push --force origin fix/main-bug" }
        session: { id: s1 }
  - name: force_push_to_main_under_sudo
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "sudo git push --force origin main" }
        session: { id: s1 }
  - name: force_push_to_main_inside_a_shell_script
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "bash -c 'cd /srv/repo && git push -f origin HEAD:main'" }
        session: { id: s1 }
  - name: force_push_to_master_by_absolute_path_after_git_options
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "/usr/bin/git -C /srv/repo push origin master --force" }
        session: { id: s1 }
  - name: force_push_to_main_after_an_environment_prefix
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "GIT_TERMINAL_PROMPT=0 git push --force-with-lease origin main" }
        session: { id: s1 }
  - name: force_push_to_main_in_a_cluster_of_short_options
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "git push -fu origin main" }
        session: { id: s1 }
  - name: force_with_lease_on_a_variable_to_main
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "old=$(git rev-parse origin/main); git push --force-with-lease=main:$old origin HEAD:main" }
        session: { id: s1 }
  - name: force_push_to_main_through_a_wrapper_the_parser_does_not_look_through
    # Matched by the text, which wants white space or the end of the line after the branch;
    # a branch that is the last word of a quoted remote script (`... origin main'`) is a
    # miss the text always had.
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "ssh build@host.example 'cd /srv/repo && git push --force origin main && git log -1'" }
        session: { id: s1 }
  - name: force_push_to_main_named_in_a_commit_message
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "git add -A; git commit -m 'ci: refuse git push --force origin main'" }
        session: { id: s1 }
  - name: force_push_to_main_named_in_a_here_document
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "cat > NOTES.md <<'EOF'\ngit push --force origin main\ngit push origin +main\nEOF" }
        session: { id: s1 }
  - name: force_push_from_a_directory_named_main
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "git -C main push --force origin topic" }
        session: { id: s1 }
  - name: force_push_to_maintenance_branch
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "git push --force origin maintenance" }
        session: { id: s1 }
  - name: ordinary_push_to_main_after_a_forced_branch_switch
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "git checkout -f topic && git push origin main" }
        session: { id: s1 }
