id: persistence-install-command
spec: threat-rules/v1.3  # needed for args and predicates
version: 5
title: Command installs scheduled-job or service persistence
description: >
  A command installs persistence that runs outside any agent sandbox at login,
  boot, or on a schedule: editing the user/root crontab (crontab -, crontab a
  file), enabling a systemd service or timer (systemctl enable, with or without
  options such as --user, --now or -q before the verb),
  or loading a launchd agent/daemon (launchctl load / bootstrap / enable). These
  survive the session and re-execute later with no further prompt. The command is
  found by what the line runs: crontab that edits or installs (a file operand, `-`, or
  no operand at all, which reads standard input), systemctl with the word enable, or
  launchctl with one of those subcommands, also under sudo, by absolute path or inside
  `bash -c`, so the same words in a commit message or a here-document do not fire. The
  text patterns are asked of the text that reaches a command the parser cannot see into
  (unread_text).
severity: high
status: stable
posture: detect
taxonomy:
  beacon_category: risky-command
  owasp_llm: LLM05
  mitre_atlas: AML.T0011

# crontab installs when its words are an optional `-u user` and at most one operand
# (crontab_installs, rules/concepts/scheduling.predicates.yaml).
match: >
  e.event.action == "command.executed" && (
    e.command.parsed_commands.exists(c,
      crontab_installs(c) ||
      c.name == "systemctl" && c.args.matches("(?m)^enable$") ||
      c.name == "launchctl" && c.args.matches("\\A(load|bootstrap|enable)(\\n|\\z)")
    ) ||
    unread_text(e, t, (t.matches("(?i)\\bcrontab\\b\\s+(-($|[\\s|])|-e\\b|[^-\\s])") ||
      t.matches("(?i)\\bsystemctl\\b(\\s+--?[a-z][a-z-]*(=\\S+)?)*\\s+enable\\b") ||
      t.matches("(?i)\\blaunchctl\\b\\s+(load|bootstrap|enable)\\b")))
  )

emit:
  reason: "Command installs scheduled-job or service persistence (crontab / systemctl enable / launchctl) — runs outside the sandbox at login/boot/schedule"

tests:
  - name: crontab_install_file
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "crontab /tmp/payload.cron" }
        session: { id: s1 }
  - name: crontab_stdin
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "echo '* * * * * /tmp/x.sh' | crontab -" }
        session: { id: s1 }
  - name: systemctl_user_enable
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "systemctl --user enable beacon-evil.service" }
        session: { id: s1 }
  - name: launchctl_load
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "launchctl load ~/Library/LaunchAgents/com.evil.plist" }
        session: { id: s1 }
  - name: systemctl_now_before_enable
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "systemctl --user --now enable beacon-evil.timer" }
        session: { id: s1 }
  - name: systemctl_root_option_before_enable
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "systemctl --root=/mnt enable evil.service" }
        session: { id: s1 }
  - name: systemctl_quiet_enable
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "sudo systemctl -q enable evil.service" }
        session: { id: s1 }
  - name: systemctl_options_then_status
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "systemctl --user --no-pager status beacon.service" }
        session: { id: s1 }
  - name: crontab_list_only
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "crontab -l" }
        session: { id: s1 }
  - name: systemctl_status
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "systemctl status nginx" }
        session: { id: s1 }
  - name: systemctl_enable_inside_a_shell_script
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "sudo bash -c 'cp job.service /etc/systemd/system/ && systemctl enable job.service'" }
        session: { id: s1 }
  - name: systemctl_enable_by_absolute_path
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "/usr/bin/systemctl enable --now job.timer" }
        session: { id: s1 }
  - name: systemctl_enable_after_an_option_with_a_value
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "systemctl -H build@host.example enable job.service" }
        session: { id: s1 }
  - name: launchctl_bootstrap_under_sudo
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "sudo launchctl bootstrap system /Library/LaunchDaemons/com.example.job.plist" }
        session: { id: s1 }
  - name: crontab_from_a_here_document
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "crontab <<'EOF'\n*/5 * * * * /srv/job.sh\nEOF" }
        session: { id: s1 }
  - name: crontab_edit_for_another_user_under_sudo
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "sudo crontab -u deploy -e" }
        session: { id: s1 }
  - name: systemctl_enable_through_a_wrapper_the_parser_does_not_look_through
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "ssh build@host.example 'systemctl enable --now job.timer'" }
        session: { id: s1 }
  - name: systemctl_enable_named_in_a_commit_message
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "git add rules && git commit -q -m 'rules: accept --opt=value before systemctl enable'" }
        session: { id: s1 }
  - name: persistence_commands_named_in_a_here_document
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "cat > NOTES.md <<'EOF'\nTo start it at boot: sudo systemctl enable job.service\nOn macOS: launchctl load ~/Library/LaunchAgents/job.plist\nOld hosts: crontab jobs.cron\nEOF" }
        session: { id: s1 }
  - name: systemctl_is_enabled_query
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "systemctl is-enabled job.service" }
        session: { id: s1 }
  - name: launchctl_list
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "launchctl list | grep com.example" }
        session: { id: s1 }
  - name: crontab_remove_is_not_an_install
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "crontab -r" }
        session: { id: s1 }
  - name: enable_given_to_a_script_the_parser_cannot_see_into
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "./provision.sh 'systemctl enable backdoor.service'" }
        session: { id: s1 }
  - name: enable_in_a_commit_message_beside_a_script
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "git commit -m 'docs: systemctl enable is not needed here' && ./run-tests.sh" }
        session: { id: s1 }

