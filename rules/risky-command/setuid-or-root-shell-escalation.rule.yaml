id: setuid-or-root-shell-escalation
spec: threat-rules/v2.0  # needed for args and predicates
version: 8
title: Setuid bit installed or interactive root shell requested
description: >
  A command either installs the setuid bit on a file (chmod u+s or +s, chmod with a
  four-digit octal mode carrying the setuid or setgid bit such as 4755, 6755 or 04755,
  or chmod g+s setgid) — creating a standing privileged
  binary that runs as its owner — or escalates to an interactive root shell via
  `su`, `su -`, `su root`, `sudo su`, `sudo -i`, `sudo -s`, `sudo bash` or `pkexec`
  (polkit). Setuid root binaries and pkexec are classic local-privilege-escalation
  primitives, and an agent that asks for a shell as another account is asking for more
  than one command. The command is found by what the line runs: chmod whose first
  operand is such a mode, su with the operand root, with nothing, or with nothing but a
  login option (`-`, `-l`, `--login`), sudo -i or -s with no command after it, a shell
  run through sudo or doas with no script, or pkexec, also by absolute path or inside
  `bash -c`, so the same words in a commit message or a here-document do not fire, and
  `su someuser`, `sudo -i cmd` and `sudo bash -c '...'` do not match. A sudo -i or -s
  counts as a shell only from a terminal, as a shell under sudo does: first in its
  pipeline, with nothing on its standard input, and with every word known, since a word
  that holds a variable (`sudo "$NGINX" -s reload`) is a program whose own options
  follow it. Where the parser
  cannot see into a command, the text that reaches that command is matched instead
  (unread_text), where each command is anchored to the command position.
severity: high
status: stable
posture: detect
taxonomy:
  beacon_category: risky-command
  owasp_llm: LLM06
  mitre_atlas: AML.T0050

# The mode is the first word of chmod that is not an option (an unknown word, such as a
# variable, is skipped), so a file named 2024 is not a mode. A shell to type into is
# root_shell (rules/concepts/dangerous-commands.predicates.yaml), which the approval rules ask
# too: su with no command, `sudo -i` or `sudo -s` with no command (an entry with no name whose
# command the parser did not read, because there is none), a shell run through sudo or doas
# with no words, no script and nothing on its standard input, and pkexec. Its text twin,
# root_shell_mention, also takes a command right after a quote, as in a script handed it.
match: >
  e.event.action == "command.executed" && (
    e.command.parsed_commands.exists(c,
      c.name == "chmod" &&
        c.args.matches("\\A(-[^\\n]*\\n|\\n)*(0?[2-7][0-7]{3}|[ugoa,+=rwxXst-]*[+=][rwxXt]*s[ugoa,+=rwxXst-]*)(\\n|\\z)") ||
      root_shell(c)
    ) ||
    unread_text(e, t, t.matches("(?i)(^|[;&|]\\s*)chmod\\s+([^;&|]*\\s)?([ugoa]*\\+[rwxXt]*s\\b|0?[2-7][0-7]{3}(\\s|$))") ||
      root_shell_mention(t))
  )

emit:
  reason: "Setuid bit installed or interactive root shell requested (local privilege escalation)"

tests:
  - name: bare_su
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "su" }
        session: { id: s1 }
  - name: a_program_named_by_a_variable_under_sudo
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "sudo \"$NGINX\" -s reload" }
        session: { id: s1 }
  - name: a_container_shell_named_by_a_variable_under_sudo
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "sudo \"$DOCKER\" exec -it db psql" }
        session: { id: s1 }
  - name: a_script_redirected_into_sudo_i
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "sudo -i < setup.sh" }
        session: { id: s1 }
  - name: sudo_su
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "cd /srv && sudo su" }
        session: { id: s1 }
  - name: sudo_login_shell
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "sudo -i" }
        session: { id: s1 }
  - name: sudo_shell_option
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "sudo -E -s" }
        session: { id: s1 }
  - name: sudo_bare_shell
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "sudo bash" }
        session: { id: s1 }
  - name: sudo_login_running_a_command
    # A command run after a login is that command, not a shell to type into.
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "sudo -i systemctl restart web" }
        session: { id: s1 }
  - name: sudo_shell_running_a_script
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "sudo bash -c 'apt-get update' && sudo bash < setup.sh && sudo -l" }
        session: { id: s1 }
  - name: sudo_validating_credentials
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "sudo -v && sudo -n true" }
        session: { id: s1 }
  - name: chmod_u_plus_s
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "chmod u+s /tmp/rootbash" }
        session: { id: s1 }
  - name: chmod_4755_octal
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "chmod 4755 /usr/local/bin/x" }
        session: { id: s1 }
  - name: chmod_plus_s_no_who
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "chmod +s /tmp/rootbash" }
        session: { id: s1 }
  - name: chmod_6755_setuid_and_setgid
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "chmod 6755 /usr/local/bin/x" }
        session: { id: s1 }
  - name: chmod_04755_leading_zero
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "chmod 04755 /usr/local/bin/x" }
        session: { id: s1 }
  - name: chmod_sticky_only
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "chmod 1777 /srv/shared" }
        session: { id: s1 }
  - name: su_dash_root
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "su - root" }
        session: { id: s1 }
  - name: pkexec_escalation
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "pkexec /bin/sh" }
        session: { id: s1 }
  - name: chmod_normal_mode
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "chmod 755 deploy.sh" }
        session: { id: s1 }
  - name: chmod_normal_mode_on_numbered_file
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "chmod 644 2024.csv" }
        session: { id: s1 }
  - name: su_to_regular_user
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "su postgres -c 'psql'" }
        session: { id: s1 }
  - name: pkexec_in_log_message
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "grep pkexec /var/log/auth.log" }
        session: { id: s1 }
  - name: setuid_under_sudo
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "sudo chmod u+s /usr/local/bin/helper" }
        session: { id: s1 }
  - name: setuid_inside_a_shell_script
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "sudo bash -c 'chown root /usr/local/bin/helper && chmod 4755 /usr/local/bin/helper'" }
        session: { id: s1 }
  - name: setuid_by_absolute_path
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "/bin/chmod 4755 /usr/local/bin/helper" }
        session: { id: s1 }
  - name: setuid_in_a_symbolic_mode_list
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "chmod -v u=rwxs,go=rx /usr/local/bin/helper" }
        session: { id: s1 }
  - name: su_login_under_sudo
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "sudo su -" }
        session: { id: s1 }
  - name: su_root_named_after_the_command
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "su -c 'id' root" }
        session: { id: s1 }
  - name: pkexec_by_absolute_path
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "/usr/bin/pkexec /bin/sh" }
        session: { id: s1 }
  - name: setuid_through_a_wrapper_the_parser_does_not_look_through
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "ssh build@host.example 'cd /usr/local/bin && chmod u+s helper'" }
        session: { id: s1 }
  - name: setuid_named_in_a_commit_message
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "git commit -m 'revert: cd /usr/local/bin && chmod u+s helper'" }
        session: { id: s1 }
  - name: setuid_and_su_named_in_a_here_document
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "cat > NOTES.md <<'EOF'\nThe old installer ran: cd /usr/local/bin && chmod 4755 helper; pkexec ./setup; su - root\nEOF" }
        session: { id: s1 }
  - name: su_login_to_regular_user
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "sudo su - postgres" }
        session: { id: s1 }
  - name: chmod_normal_mode_on_a_file_named_like_a_mode
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "chmod 644 2024" }
        session: { id: s1 }
  - name: chmod_normal_mode_with_leading_zero
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "sudo chmod 0755 /usr/local/bin/helper" }
        session: { id: s1 }
  - name: setuid_chmod_given_to_a_project_script
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "./deploy.sh 'cd /opt; chmod u+s /opt/helper'" }
        session: { id: s1 }
  - name: setuid_chmod_in_a_commit_message_beside_a_project_script
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "git commit -m 'fix; chmod u+s /opt/helper removed' && ./run-tests.sh" }
        session: { id: s1 }

