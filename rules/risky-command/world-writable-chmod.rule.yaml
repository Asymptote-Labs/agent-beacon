id: world-writable-chmod
spec: threat-rules/v2.0  # needed for args and predicates
version: 7
title: chmod grants world-writable or full permissions
description: >
  A command makes a file or tree world-writable — an octal mode whose "other" digit
  grants write (777, 0777, 666, 0776, 1777), or a symbolic mode
  (via + or =) that grants write to other or all (e.g. o+w, a+rwx, a=rwx, o=rwx,
  ugo+rwx). Owner- or group-only grants (u+w, g=rw) are intentionally excluded because
  they are not world-writable. The command is found by what the line runs: chmod, also
  under sudo, by absolute path or inside `bash -c`, whose first operand is such a mode,
  so chmod in a commit message or a here-document does not fire. Where the parser
  cannot see into a command, the text that reaches that command is matched instead
  (unread_text), where chmod is anchored to the acting command position (also right
  after a quote, or after sudo and its options).
severity: medium
status: stable
posture: detect
taxonomy:
  beacon_category: risky-command
  owasp_llm: LLM06

# world_writable_chmod and its text twin world_writable_chmod_mention
# (rules/concepts/dangerous-commands.predicates.yaml), which the approval rules ask too, for a
# tree: the mode is the first word of chmod that is not an option (an unknown word, such as a
# variable, is skipped), so a file named 777 is not a mode.
match: >
  e.event.action == "command.executed" && (
    e.command.parsed_commands.exists(c, world_writable_chmod(c)) ||
    unread_text(e, t, world_writable_chmod_mention(t))
  )

emit:
  reason: "chmod grants world-writable or fully permissive access"

tests:
  - name: chmod_777_recursive
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "chmod -R 777 /var/www" }
        session: { id: s1 }
  - name: chmod_0777_octal
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "chmod 0777 evil.sh" }
        session: { id: s1 }
  - name: chmod_666_world_writable_file
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "chmod 666 /etc/app/config" }
        session: { id: s1 }
  - name: chmod_0776_octal
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "chmod -R 0776 /srv/app" }
        session: { id: s1 }
  - name: chmod_ugo_rwx_symbolic
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "chmod ugo+rwx /usr/local/bin/x" }
        session: { id: s1 }
  - name: chmod_o_plus_w
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "chmod o+w /etc/app/config" }
        session: { id: s1 }
  - name: chmod_a_equals_rwx
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "chmod a=rwx /srv/app" }
        session: { id: s1 }
  - name: chmod_o_equals_rwx
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "chmod o=rwx /srv/app/file" }
        session: { id: s1 }
  - name: chmod_after_cd_separator
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "cd /opt && chmod 777 ./run" }
        session: { id: s1 }
  - name: chmod_sticky_world_writable_dir
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "chmod 1777 /srv/shared" }
        session: { id: s1 }
  - name: chmod_normal_mode
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "chmod 644 README.md" }
        session: { id: s1 }
  - name: chmod_exec_on_numbered_script
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "chmod +x 007.sh" }
        session: { id: s1 }
  - name: chmod_normal_mode_on_numbered_file
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "chmod 644 002-setup.sh" }
        session: { id: s1 }
  - name: chmod_read_only_other
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "chmod o+r /etc/hosts" }
        session: { id: s1 }
  - name: chmod_owner_write_only
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "chmod u+w src/main.go" }
        session: { id: s1 }
  - name: chmod_group_write_only
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "chmod g=rw shared.log" }
        session: { id: s1 }
  - name: chmod_restrictive_mode
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "chmod 1750 /var/run" }
        session: { id: s1 }
  - name: chmod_as_argument_to_man
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "man chmod | grep 777" }
        session: { id: s1 }
  - name: chmod_under_sudo
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "sudo chmod -R 777 /srv/app" }
        session: { id: s1 }
  - name: chmod_inside_a_shell_script
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "bash -c 'chmod 666 /srv/app/config'" }
        session: { id: s1 }
  - name: chmod_by_absolute_path
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "/bin/chmod o+w /srv/app/config" }
        session: { id: s1 }
  - name: chmod_symbolic_mode_list
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "chmod -R u=rwx,go+w \"$APP_DIR\"" }
        session: { id: s1 }
  - name: chmod_through_a_wrapper_the_parser_does_not_look_through
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "ssh build@host.example 'cd /srv && chmod 777 app'" }
        session: { id: s1 }
  - name: chmod_on_a_line_that_does_not_parse
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "chmod 777 /srv )" }
        session: { id: s1 }
  - name: chmod_named_in_a_commit_message
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "git commit -m 'revert: cd /srv && chmod 777 app'" }
        session: { id: s1 }
  - name: chmod_named_in_a_here_document
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "cat > NOTES.md <<'EOF'\nThe installer used to run: cd /srv && chmod 777 app\nEOF" }
        session: { id: s1 }
  - name: chmod_group_writable_tree
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "sudo chmod -R 775 /srv/app" }
        session: { id: s1 }
  - name: chmod_normal_mode_on_a_file_named_like_a_mode
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "chmod 644 777" }
        session: { id: s1 }
  - name: chmod_777_given_to_a_project_script
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "./deploy.sh 'cd /srv; chmod -R 777 app'" }
        session: { id: s1 }
  - name: chmod_777_in_a_commit_message_beside_a_project_script
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "git commit -m 'fix; chmod -R 777 app removed' && ./run-tests.sh" }
        session: { id: s1 }
