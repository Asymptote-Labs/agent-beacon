        session: { id: s1 }
  - name: az_in_a_remote_command_line
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "ssh ops@host.example 'cd /srv/deploy && az role assignment create --assignee agent --role Owner'" }
        session: { id: s1 }
  - name: aws_in_a_here_document_sent_to_a_remote_shell
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "ssh ops@host.example <<'EOF'\naws iam create-access-key --user-name agent\nEOF" }
