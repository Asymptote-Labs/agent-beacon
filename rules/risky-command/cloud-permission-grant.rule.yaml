  - name: no_match_5_gcloud_projects_get_iam_policy_prod
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "gcloud projects get-iam-policy prod" }
        session: { id: s1 }
  - name: no_match_6_az_role_assignment_list
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "az role assignment list" }
        session: { id: s1 }
  - name: no_match_7_az_ad_sp_credential_list_id_app
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "az ad sp credential list --id app" }
        session: { id: s1 }
  - name: no_match_8_kubectl_get_rolebindings
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "kubectl get rolebindings" }
        session: { id: s1 }
  - name: no_match_9_kubectl_describe_clusterrolebinding_admin
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "kubectl describe clusterrolebinding admin" }
