  - name: no_match_13_aws_iam_get_user_create_access_key
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "aws iam get-user # create-access-key" }
        session: { id: s1 }
  - name: no_match_14_kubectl_create_role_admin
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "kubectl create role admin" }
        session: { id: s1 }
  - name: no_match_15_az_ad_sp_show_id_app
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "az ad sp show --id app" }
        session: { id: s1 }
  - name: newline
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "true\naws iam create-access-key --user-name agent" }
        session: { id: s1 }
  - name: then
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "if true; then aws iam create-access-key --user-name agent" }
        session: { id: s1 }
  - name: do
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "for x in a; do aws iam create-access-key --user-name agent" }
        session: { id: s1 }
  - name: else
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "if false; then true; else aws iam create-access-key --user-name agent" }
        session: { id: s1 }
  - name: redirect_or_comment_1
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "aws iam create-access-key --user-name agent 2>/dev/null" }
        session: { id: s1 }
  - name: redirect_or_comment_2
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "aws iam create-access-key --user-name agent >/dev/null 2>&1" }
