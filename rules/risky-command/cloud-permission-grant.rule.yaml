id: cloud-permission-grant
version: 1
title: Cloud credentials created or permissions granted
description: >
  An agent creates cloud access keys, attaches or adds IAM policies or bindings,
  assigns an Azure role, resets service-principal credentials, or creates a
  Kubernetes role binding. This records a privileged action for review, not
  proof that the resulting permissions were broader or malicious.
severity: high
status: experimental
posture: detect
taxonomy:
  beacon_category: risky-command
  owasp_llm: LLM06

match: >
  e.event.action == "command.executed" && (
    e.command.command.matches("(^|[;&|\\n])[ \\t]*(?:(?:then|do|else)[ \\t]+)?(?:sudo[ \\t]+)?(?:/[^\\s;&|]*/)?aws(?:[ \\t]+--(?:profile|region|endpoint-url)[ \\t]+[^\\s;&|]+)*[ \\t]+iam[ \\t]+(?:create-access-key|attach-(?:user|group|role)-policy|put-(?:user|group|role)-policy|create-policy|create-policy-version|add-user-to-group)(?:[ \\t]|$|[;&|\\n<>#])") ||
    e.command.command.matches("(^|[;&|\\n])[ \\t]*(?:(?:then|do|else)[ \\t]+)?(?:sudo[ \\t]+)?(?:/[^\\s;&|]*/)?gcloud(?:[ \\t]+--(?:project|account|configuration)(?:=|[ \\t]+)[^\\s;&|]+)*[ \\t]+iam[ \\t]+service-accounts[ \\t]+keys[ \\t]+create(?:[ \\t]|$|[;&|\\n<>#])") ||
    e.command.command.matches("(^|[;&|\\n])[ \\t]*(?:(?:then|do|else)[ \\t]+)?(?:sudo[ \\t]+)?(?:/[^\\s;&|]*/)?gcloud(?:[ \\t]+--(?:project|account|configuration)(?:=|[ \\t]+)[^\\s;&|]+)*[ \\t]+(?:projects|organizations|folders|iam[ \\t]+service-accounts)[ \\t]+(?:add-iam-policy-binding|set-iam-policy)(?:[ \\t]|$|[;&|\\n<>#])") ||
    e.command.command.matches("(^|[;&|\\n])[ \\t]*(?:(?:then|do|else)[ \\t]+)?(?:sudo[ \\t]+)?(?:/[^\\s;&|]*/)?gcloud(?:[ \\t]+--(?:project|account|configuration)(?:=|[ \\t]+)[^\\s;&|]+)*[ \\t]+(?:storage[ \\t]+buckets|run[ \\t]+services|secrets)[ \\t]+add-iam-policy-binding(?:[ \\t]|$|[;&|\\n<>#])") ||
    e.command.command.matches("(^|[;&|\\n])[ \\t]*(?:(?:then|do|else)[ \\t]+)?(?:sudo[ \\t]+)?(?:/[^\\s;&|]*/)?az[ \\t]+(?:role[ \\t]+assignment[ \\t]+create|ad[ \\t]+sp[ \\t]+credential[ \\t]+reset)(?:[ \\t]|$|[;&|\\n<>#])") ||
    e.command.command.matches("(^|[;&|\\n])[ \\t]*(?:(?:then|do|else)[ \\t]+)?(?:sudo[ \\t]+)?(?:/[^\\s;&|]*/)?kubectl(?:[ \\t]+(?:-n|--namespace|--context|--kubeconfig)(?:=|[ \\t]+)[^\\s;&|]+)*[ \\t]+create[ \\t]+(?:rolebinding|clusterrolebinding)(?:[ \\t]|$|[;&|\\n<>#])")
  )

emit:
  reason: "Cloud credentials created or permissions granted"

tests:
  - name: match_1_aws_iam_create_access_key_user_name_agent
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "aws iam create-access-key --user-name agent" }
        session: { id: s1 }
  - name: match_2_aws_profile_prod_iam_attach_user_policy_user_name_agent_policy_arn_arn_aws_
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "aws --profile prod iam attach-user-policy --user-name agent --policy-arn arn:aws:iam::aws:policy/AdministratorAccess" }
        session: { id: s1 }
  - name: match_3_aws_iam_attach_role_policy_role_name_agent
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "aws iam attach-role-policy --role-name agent" }
        session: { id: s1 }
  - name: match_4_aws_iam_put_group_policy_group_name_dev
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "aws iam put-group-policy --group-name dev" }
        session: { id: s1 }
  - name: match_5_aws_iam_create_policy_policy_name_admin
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "aws iam create-policy --policy-name admin" }
        session: { id: s1 }
  - name: match_6_aws_iam_create_policy_version_policy_arn_arn_example
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "aws iam create-policy-version --policy-arn arn:example" }
        session: { id: s1 }
  - name: match_7_aws_iam_add_user_to_group_group_name_admins_user_name_agent
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "aws iam add-user-to-group --group-name admins --user-name agent" }
        session: { id: s1 }
  - name: match_8_gcloud_iam_service_accounts_keys_create_key_json_iam_account_agent_example_
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "gcloud iam service-accounts keys create key.json --iam-account agent@example.test" }
