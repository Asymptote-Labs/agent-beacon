  - name: no_match_11_gcloud_projects_list_echo_add_iam_policy_binding
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "gcloud projects list\necho add-iam-policy-binding" }
        session: { id: s1 }
  - name: no_match_12_kubectl_get_pods_echo_create_rolebinding
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "kubectl get pods; echo create rolebinding" }
        session: { id: s1 }
  - name: no_match_13_aws_iam_get_user_create_access_key
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "aws iam get-user # create-access-key" }
        session: { id: s1 }
  - name: no_match_14_kubectl_create_role_admin
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "kubectl create role admin" }
        session: { id: s1 }
  - name: no_match_15_az_ad_sp_show_id_app
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "az ad sp show --id app" }
        session: { id: s1 }
  - name: newline
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "true\naws iam create-access-key --user-name agent" }
        session: { id: s1 }
  - name: then
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "if true; then aws iam create-access-key --user-name agent" }
        session: { id: s1 }
  - name: do
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "for x in a; do aws iam create-access-key --user-name agent" }
        session: { id: s1 }
  - name: else
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "if false; then true; else aws iam create-access-key --user-name agent" }
        session: { id: s1 }
  - name: redirect_or_comment_1
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "aws iam create-access-key --user-name agent 2>/dev/null" }
        session: { id: s1 }
  - name: redirect_or_comment_2
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "aws iam create-access-key --user-name agent >/dev/null 2>&1" }
        session: { id: s1 }
  - name: redirect_or_comment_3
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "aws iam create-access-key --user-name agent&>/dev/null" }
        session: { id: s1 }
  - name: redirect_or_comment_4
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "aws iam create-access-key --user-name agent # maintenance" }
        session: { id: s1 }
  - name: mention_1
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "echo \"aws iam create-access-key --user-name agent\"" }
        session: { id: s1 }
  - name: mention_2
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "grep -F \"aws iam create-access-key --user-name agent\"" }
        session: { id: s1 }
  - name: mention_3
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "git commit -m \"aws iam create-access-key --user-name agent\"" }
        session: { id: s1 }
  - name: wrong_event_action
    verdict: no_match
    events:
      - event: { action: tool.invoked }
        command: { command: "aws iam create-access-key --user-name agent" }
        session: { id: s1 }
  - name: aws_profile_env
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "AWS_PROFILE=prod aws iam create-access-key --user-name agent" }
        session: { id: s1 }
  - name: sudo_aws
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "sudo -u deploy aws iam attach-user-policy --user-name agent --policy-arn arn:aws:iam::aws:policy/AdministratorAccess" }
        session: { id: s1 }
  - name: relative_aws
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "AWS_PROFILE=prod bin/aws iam create-access-key --user-name agent" }
        session: { id: s1 }
  - name: aws_profile_read
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "AWS_PROFILE=prod aws iam list-users" }
        session: { id: s1 }
  - name: sudo_cloud_echo
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "sudo -u deploy echo \"aws iam create-access-key\"" }
        session: { id: s1 }
  - name: env_cloud_mention
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "NOTE=\"aws iam create-access-key\" echo ok" }
        session: { id: s1 }
  - name: gcloud_under_sudo_and_env
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "sudo env CLOUDSDK_CORE_PROJECT=prod gcloud projects add-iam-policy-binding prod --member user:dev@example.test --role roles/editor" }
        session: { id: s1 }
  - name: kubectl_inside_a_shell_script
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "bash -c 'kubectl create clusterrolebinding ops --clusterrole=cluster-admin --user=agent'" }
        session: { id: s1 }
  - name: aws_by_absolute_path
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "/usr/local/bin/aws iam attach-role-policy --role-name agent --policy-arn arn:aws:iam::aws:policy/PowerUserAccess" }
        session: { id: s1 }
  - name: aws_with_other_global_options_first
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "aws --output json --no-cli-pager iam add-user-to-group --group-name admins --user-name agent" }
        session: { id: s1 }
  - name: gcloud_beta_release_track
    verdict: match
    events:
      - event: { action: command.executed }
