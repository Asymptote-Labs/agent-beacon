id: cloud-permission-grant
spec: threat-rules/v2.0  # needed for args and predicates
version: 4
title: Cloud credentials created or permissions granted
description: >
  An agent creates cloud access keys, attaches or adds IAM policies or bindings,
  assigns an Azure role, resets service-principal credentials, or creates a
  Kubernetes role binding. This records a privileged action for review, not
  proof that the resulting permissions were broader or malicious. The command is
  found by what the line runs, so the same words in a commit message, an echo or
  a here-document do not fire and the client under `sudo env`, by any path or
  inside `bash -c` does; the text patterns are asked of the text that reaches a
  command the parser cannot see into (unread_text).
severity: high
status: experimental
posture: detect
taxonomy:
  beacon_category: risky-command
  owasp_llm: LLM06

# Each client is a parsed command, named after sudo, env and the like and by any path, and
# its subcommand is words of that command that follow each other. az takes its command
# group first (`az deployment group ...` is not `az group ...`); the others may have global
# options or a release track before it. bq takes its command after its global flags. A
# command behind sudo -l or sudo -v is not run and has no name, so its line is left to the
# text.
#
# The text half is the text patterns of version 1 as one pattern, asked of the text that
# reaches a command the parser cannot see into (unread_text): a command prefix, then what
# the command is, one alternative for each of the six patterns it was. Each of them began
# with the same prefix, and a pattern is charged for its length each time it is asked, so
# the prefix is written once. A text matches the one pattern exactly when it matched one of
# the six. The prefix accepts environment assignments, relative executable paths, and sudo
# execution options. Value-taking sudo options consume their argument; inspection modes
# such as sudo -l/-v are not execution prefixes.
match: >
  e.event.action == "command.executed" && (
    e.command.parsed_commands.exists(c,
      c.name == "aws" && c.args.matches("(?m)^iam\\n(?:create-access-key|attach-(?:user|group|role)-policy|put-(?:user|group|role)-policy|create-policy|create-policy-version|add-user-to-group)$") ||
      c.name == "gcloud" && c.args.matches("(?m)^iam\\nservice-accounts\\nkeys\\ncreate$|^(?:projects|organizations|folders|iam\\nservice-accounts)\\n(?:add-iam-policy-binding|set-iam-policy)$|^(?:storage\\nbuckets|run\\nservices|secrets)\\nadd-iam-policy-binding$") ||
      c.name == "bq" && c.args.matches("(?m)\\A(?:--?[A-Za-z][^\\n]*\\n(?:[^-\\n][^\\n]*\\n)?)*(?:add-iam-policy-binding|set-iam-policy)$") ||
      c.name == "az" && c.args.matches("(?m)\\A(?:role\\nassignment\\ncreate|ad\\nsp\\ncredential\\nreset)$") ||
      c.name == "kubectl" && c.args.matches("(?m)^create\\n(?:rolebinding|clusterrolebinding)$")
    ) ||
    unread_text(e, t,
      t.matches("(^|[;&|\\n])[ \\t]*(?:(?:then|do|else)[ \\t]+)?(?:[A-Za-z_][A-Za-z0-9_]*=(?:(?:[^\\s;&|<>#\\x27\"`]+|\\x27[^\\x27\\n]*\\x27|\"[^\"\\n]*\")+)?[ \\t]+)*(?:sudo[ \\t]+(?:(?:-[ugCDRTp][ \\t]*(?:[^\\s;&|<>#\\x27\"`]+|\\x27[^\\x27\\n]*\\x27|\"[^\"\\n]*\")+|--(?:user|group|close-from|chdir|chroot|command-timeout|prompt)(?:=|[ \\t]+)(?:[^\\s;&|<>#\\x27\"`]+|\\x27[^\\x27\\n]*\\x27|\"[^\"\\n]*\")+|-[nEHkPSb]+|--(?:non-interactive|preserve-env(?:=[A-Za-z0-9_,]+)?|set-home|reset-timestamp|stdin|background))[ \\t]+)*(?:--[ \\t]+)?(?:[A-Za-z_][A-Za-z0-9_]*=(?:(?:[^\\s;&|<>#\\x27\"`]+|\\x27[^\\x27\\n]*\\x27|\"[^\"\\n]*\")+)?[ \\t]+)*)?(?:[^\\s;&|<>#\\x27\"`=]*/)?(?:aws(?:[ \\t]+--(?:profile|region|endpoint-url)[ \\t]+[^\\s;&|]+)*[ \\t]+iam[ \\t]+(?:create-access-key|attach-(?:user|group|role)-policy|put-(?:user|group|role)-policy|create-policy|create-policy-version|add-user-to-group)(?:[ \\t]|$|[;&|\\n<>#])|gcloud(?:[ \\t]+--(?:project|account|configuration)(?:=|[ \\t]+)[^\\s;&|]+)*[ \\t]+iam[ \\t]+service-accounts[ \\t]+keys[ \\t]+create(?:[ \\t]|$|[;&|\\n<>#])|gcloud(?:[ \\t]+--(?:project|account|configuration)(?:=|[ \\t]+)[^\\s;&|]+)*[ \\t]+(?:projects|organizations|folders|iam[ \\t]+service-accounts)[ \\t]+(?:add-iam-policy-binding|set-iam-policy)(?:[ \\t]|$|[;&|\\n<>#])|gcloud(?:[ \\t]+--(?:project|account|configuration)(?:=|[ \\t]+)[^\\s;&|]+)*[ \\t]+(?:storage[ \\t]+buckets|run[ \\t]+services|secrets)[ \\t]+add-iam-policy-binding(?:[ \\t]|$|[;&|\\n<>#])|az[ \\t]+(?:role[ \\t]+assignment[ \\t]+create|ad[ \\t]+sp[ \\t]+credential[ \\t]+reset)(?:[ \\t]|$|[;&|\\n<>#])|kubectl(?:[ \\t]+(?:-n|--namespace|--context|--kubeconfig)(?:=|[ \\t]+)[^\\s;&|]+)*[ \\t]+create[ \\t]+(?:rolebinding|clusterrolebinding)(?:[ \\t]|$|[;&|\\n<>#]))"))
  )

emit:
  reason: "Cloud credentials created or permissions granted"

tests:
  - name: match_1_aws_iam_create_access_key_user_name_agent
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "aws iam create-access-key --user-name agent" }
        session: { id: s1 }
  - name: match_2_aws_profile_prod_iam_attach_user_policy_user_name_agent_policy_arn_arn_aws_
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "aws --profile prod iam attach-user-policy --user-name agent --policy-arn arn:aws:iam::aws:policy/AdministratorAccess" }
        session: { id: s1 }
  - name: match_3_aws_iam_attach_role_policy_role_name_agent
