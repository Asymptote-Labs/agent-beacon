  - name: match_9_gcloud_projects_add_iam_policy_binding_prod_member_serviceaccount_agent_exa
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "gcloud projects add-iam-policy-binding prod --member serviceAccount:agent@example.test --role roles/owner" }
        session: { id: s1 }
  - name: match_10_gcloud_iam_service_accounts_add_iam_policy_binding_agent_example_test_role_
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "gcloud iam service-accounts add-iam-policy-binding agent@example.test --role roles/iam.serviceAccountUser" }
        session: { id: s1 }
  - name: match_11_gcloud_organizations_set_iam_policy_123_policy_json
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "gcloud organizations set-iam-policy 123 policy.json" }
        session: { id: s1 }
  - name: match_12_gcloud_storage_buckets_add_iam_policy_binding_gs_data_role_roles_storage_ad
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "gcloud storage buckets add-iam-policy-binding gs://data --role roles/storage.admin" }
        session: { id: s1 }
  - name: match_13_az_role_assignment_create_assignee_agent_role_owner
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "az role assignment create --assignee agent --role Owner" }
        session: { id: s1 }
  - name: match_14_az_ad_sp_credential_reset_id_app
    verdict: match
    events:
      - event: { action: command.executed }
