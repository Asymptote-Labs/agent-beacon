  - name: match_15_kubectl_create_rolebinding_admin_clusterrole_admin_user_agent
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "kubectl create rolebinding admin --clusterrole=admin --user=agent" }
        session: { id: s1 }
  - name: match_16_kubectl_n_prod_create_clusterrolebinding_admin_clusterrole_cluster_admin_us
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "kubectl -n prod create clusterrolebinding admin --clusterrole=cluster-admin --user=agent" }
        session: { id: s1 }
  - name: no_match_1_aws_iam_list_access_keys
    verdict: no_match
