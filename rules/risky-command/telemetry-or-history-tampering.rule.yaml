emit:
  reason: "Beacon telemetry or shell history disabled or removed"

tests:
  - name: match_1_rm_rf_beacon
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "rm -rf ~/.beacon/" }
        session: { id: s1 }
  - name: match_2_rm_var_log_beacon_agent_runtime_jsonl
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "rm /var/log/beacon-agent/runtime.jsonl" }
        session: { id: s1 }
  - name: match_3_truncate_s_0_runtime_jsonl
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "truncate -s 0 runtime.jsonl" }
        session: { id: s1 }
  - name: match_4_beacon_endpoint_logs_runtime_jsonl
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: ": > ~/.beacon/endpoint/logs/runtime.jsonl" }
        session: { id: s1 }
  - name: match_5_cat_dev_null_runtime_jsonl
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "cat /dev/null > runtime.jsonl" }
        session: { id: s1 }
  - name: match_6_runtime_jsonl
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: ">runtime.jsonl" }
        session: { id: s1 }
  - name: match_7_echo_runtime_jsonl
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "echo \"\" > runtime.jsonl" }
        session: { id: s1 }
  - name: match_8_systemctl_stop_beacon_collector_service
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "systemctl stop beacon-collector.service" }
        session: { id: s1 }
  - name: match_9_service_beacon_collector_stop
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "service beacon-collector stop" }
        session: { id: s1 }
  - name: match_10_systemctl_user_disable_beacon_collector_service
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "systemctl --user disable beacon-collector.service" }
        session: { id: s1 }
  - name: match_11_launchctl_unload_library_launchagents_com_beacon_endpoint_collector_plist
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "launchctl unload ~/Library/LaunchAgents/com.beacon.endpoint.collector.plist" }
        session: { id: s1 }
  - name: match_12_launchctl_bootout_gui_501_com_beacon_endpoint_collector
    verdict: match
    events:
