  - name: match_11_launchctl_unload_library_launchagents_com_beacon_endpoint_collector_plist
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "launchctl unload ~/Library/LaunchAgents/com.beacon.endpoint.collector.plist" }
        session: { id: s1 }
  - name: match_12_launchctl_bootout_gui_501_com_beacon_endpoint_collector
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "launchctl bootout gui/501/com.beacon.endpoint.collector" }
        session: { id: s1 }
  - name: match_13_pkill_f_beacon_otelcol
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "pkill -f beacon-otelcol" }
        session: { id: s1 }
  - name: match_14_killall_beacon_otelcol
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "killall beacon-otelcol" }
        session: { id: s1 }
  - name: match_15_beacon_endpoint_uninstall
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "beacon endpoint uninstall" }
        session: { id: s1 }
  - name: match_16_beacon_endpoint_disconnect
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "beacon endpoint disconnect" }
        session: { id: s1 }
  - name: match_17_beacon_endpoint_hooks_uninstall
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "beacon endpoint hooks uninstall" }
        session: { id: s1 }
  - name: match_18_rm_config_opencode_plugins_beacon_ts
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "rm ~/.config/opencode/plugins/beacon.ts" }
