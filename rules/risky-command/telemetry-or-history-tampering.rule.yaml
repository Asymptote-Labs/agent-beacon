id: telemetry-or-history-tampering
spec: threat-rules/v1.3  # needed for args, file_writes and predicates
version: 7
title: Beacon telemetry or shell history disabled or removed
description: >
  An agent deletes or truncates Beacon data, removes its managed plugin files,
  stops its services, uninstalls or disconnects it, or clears/disables shell
  history. Legitimate cleanup and maintenance can also match. Reading logs or
  history and querying service status do not match. Detection requires the
  command to have reached the runtime log before collection was interrupted. The
  command is found by what the line runs, and the file by what that command deletes,
  truncates or empties, so the command under sudo, by path or inside `bash -c` fires
  and the same words in a commit message or a here-document written to a notes file
  do not; the text pattern is asked only of the text that reaches a command the parser
  cannot see into (unread_text). A line that disables history, written into a shell
  startup file, fires too.
severity: high
status: experimental
posture: detect
taxonomy:
  beacon_category: risky-command
  owasp_llm: LLM06

# What the line runs, in the order of the parsed alternatives:
#   1. A file of Beacon's (its data directory, a runtime log and its rotations, a managed
#      plugin or extension) or a shell history file (shell_history_file, the list
#      shell-history-secret-scan asks too: .bash_history, .zsh_history, .sh_history,
#      fish_history, .history, or $HISTFILE) is deleted,
#      truncated, shredded, or overwritten by a command that writes nothing: a bare
#      redirection, `:`, `true`, `cat /dev/null`, `echo` or `printf` of nothing or of an
#      empty string. Another command's output redirected over the file is not an emptying
#      and does not fire, as before. The path is the one the command writes
#      (c.file_writes), as written, so `~/.beacon`, "$HOME/.zsh_history" and $d/runtime.jsonl
#      are seen. An echo whose only word is a variable is not an echo of nothing: its word
#      is unknown, which c.argv shows as "" and c.argv_raw as written. A redirected loop or
#      group has no words either, so the bare redirection is confirmed on the text: some
#      command of the line starts with `>`.
#   2. systemctl, launchctl, pkill or killall names one of Beacon's units or processes. The
#      unit is read as written (c.argv_raw) because `com.beacon.endpoint.*` is a glob.
#   3. service, beacon endpoint, history, unset, set +o history, by their words.
#   4. HISTFILE, HISTSIZE or HISTFILESIZE given an emptying value: by export and its like
#      (a word of the builtin), through sudo or env (a word before the command's name: one
#      of c.argv that is not one of c.args), or by an assignment alone or before a command
#      (c.env). An assignment whose value the parse leaves unknown (HISTFILE="$x") has an
#      empty value in c.env too, so the empty HISTFILE is confirmed on the text.
#   5. Content, not a command: a line that disables history, in the text of a command that
#      writes a shell startup file (shell_startup_file, the pack's one list of them,
#      rules/concepts/sensitive-files.predicates.yaml). It is not asked through
#      unread_text, since a here-document body is nothing the line runs.
# The text half is the text patterns of version 1 as one pattern: a command prefix, then
# what the command is, one alternative for each of the fourteen things above that a command
# can be. They were fourteen patterns that each began with the same prefix; a pattern is
# charged for its length each time it is asked, and it is asked of the line and of every
# command the parser cannot see into, so repeating the prefix fourteen times cost three
# times what the one pattern costs and kept this rule metered on one line in six. A line
# matches the one pattern exactly when it matched one of the fourteen. The prefix accepts
# environment assignments, relative executable paths, and sudo execution options.
# Value-taking sudo options consume their argument; inspection modes such as sudo -l/-v are
# not execution prefixes.
match: >
  e.event.action == "command.executed" && (
    e.command.parsed_commands.exists(c,
      c.file_writes.exists(f,
        (f.op == "delete" && c.name.matches("^(rm|unlink|shred)$") ||
         f.op == "truncate" ||
         f.op == "write" && (
           c.name == "shred" || c.name.matches("^(:|true)$") ||
           size(c.argv) == 0 && e.command.command.matches("(^|[;&|\\n({\"\\x27]|\\b(then|do|else))[ \\t]*>") ||
           c.name == "cat" && c.args == "/dev/null" ||
           c.name.matches("^(echo|printf)$") && c.args.matches("^(-n\\n?)?$") &&
             (!c.argv.exists(a, a == "") || c.argv_raw.exists(a, a.matches("^(\"\"|\\x27\\x27)$"))))) &&
        (f.path.matches("(^|/)(\\.beacon(/.*)?|runtime\\.jsonl(\\..*)?\\*?|var/log/beacon-agent(/.*)?)$|/(plugins?|extensions)/beacon(-endpoint)?(\\.[jt]s|/.*)?$") || shell_history_file(f.path))) ||
      (c.name == "systemctl" && c.args.matches("(?m)^(stop|disable|mask|kill)$") ||
       c.name == "launchctl" && c.args.matches("(?m)^(unload|bootout|remove|stop|kill)$") ||
       c.name.matches("^(pkill|killall)$")) &&
        c.argv_raw.exists(a, a.matches("^[\"\\x27]?([^\\s\"\\x27]*/)?(com\\.beacon\\.endpoint\\.[\\w.*-]+|beacon-(collector|otelcol|asymptote-forwarder|inventory|session-sync|updater)(\\.(service|timer))?)([ \\t].*)?[\"\\x27]?$")) ||
      c.name == "service" && c.args.matches("(?m)^beacon-collector\\nstop$") ||
      c.name == "beacon" && c.args.matches("(?m)^endpoint\\n(uninstall|disconnect|hooks\\nuninstall)$") ||
      c.name == "history" && c.args.matches("(?m)^-[a-z]*c[a-z]*$|^-w\\n/dev/null$") ||
      c.name == "unset" && c.args.matches("(?m)^HISTFILE$") ||
      c.name == "set" && c.args.matches("(?m)^\\+o\\nhistory$") ||
      c.argv.exists(a, a.matches("^(HISTFILE=(/dev/null)?|(HISTSIZE|HISTFILESIZE)=0)$")) &&
        (c.name.matches("^(export|declare|typeset|readonly|local)$") ||
         !c.args.matches("(?m)^(HISTFILE=(/dev/null)?|(HISTSIZE|HISTFILESIZE)=0)$")) ||
      c.env.exists(k, k.matches("^(HISTSIZE|HISTFILESIZE)$") && c.env[k] == "0") ||
      "HISTFILE" in c.env && (c.env["HISTFILE"] == "/dev/null" ||
        c.env["HISTFILE"] == "" && e.command.command.matches("(^|[\\s;&|({])HISTFILE=([\"\\x27][\"\\x27])?([\\s;&|<>#)}]|$)")) ||
      c.file_writes.exists(f, f.op in ["write", "append"] && shell_startup_file(f.path)) &&
        e.command.command.matches("(^|[;&|\\n\"\\x27])[ \\t]*(unset[ \\t]+HISTFILE|(export[ \\t]+)?(HISTFILE=(/dev/null|\"\"|\\x27\\x27)?|(HISTSIZE|HISTFILESIZE)=0)|set[ \\t]+\\+o[ \\t]+history)([ \\t]|$|[;&|\\n<>#\\\\]|[\"\\x27]([ \\t]|$|[;&|\\n<>#)]))")
    ) ||
    unread_text(e, t,
      t.matches("(^|[;&|\\n])[ \\t]*(?:(?:then|do|else)[ \\t]+)?(?:[A-Za-z_][A-Za-z0-9_]*=(?:(?:[^\\s;&|<>#\\x27\"`]+|\\x27[^\\x27\\n]*\\x27|\"[^\"\\n]*\")+)?[ \\t]+)*(?:sudo[ \\t]+(?:(?:-[ugCDRTp][ \\t]*(?:[^\\s;&|<>#\\x27\"`]+|\\x27[^\\x27\\n]*\\x27|\"[^\"\\n]*\")+|--(?:user|group|close-from|chdir|chroot|command-timeout|prompt)(?:=|[ \\t]+)(?:[^\\s;&|<>#\\x27\"`]+|\\x27[^\\x27\\n]*\\x27|\"[^\"\\n]*\")+|-[nEHkPSb]+|--(?:non-interactive|preserve-env(?:=[A-Za-z0-9_,]+)?|set-home|reset-timestamp|stdin|background))[ \\t]+)*(?:--[ \\t]+)?(?:[A-Za-z_][A-Za-z0-9_]*=(?:(?:[^\\s;&|<>#\\x27\"`]+|\\x27[^\\x27\\n]*\\x27|\"[^\"\\n]*\")+)?[ \\t]+)*)?(?:[^\\s;&|<>#\\x27\"`=]*/)?(?:(?:rm|unlink|shred)\\b[^;&|\\n#]*[ \\t][\\\"\\x27]?(?:(?:[^\\s;&|\\\"\\x27<>]*/)?(?:\\.beacon(?:/[^\\s;&|\\\"\\x27<>]*)?|runtime\\.jsonl(?:\\.[^\\s;&|\\\"\\x27<>]*)?|var/log/beacon-agent(?:/[^\\s;&|\\\"\\x27<>]*)?)|[^\\s;&|\\\"\\x27<>]*/(?:plugins?|extensions)/beacon(?:-endpoint)?(?:\\.[jt]s|/[^\\s;&|\\\"\\x27<>]*)?|(?:[^\\s;&|\\\"\\x27<>]*/)?(?:\\.(?:bash_history|zsh_history|sh_history|history)|fish_history))[\\\"\\x27]?(?:[ \\t]|$|[;&|\\n<>#])|truncate\\b[^;&|\\n#]*[ \\t][\\\"\\x27]?(?:(?:[^\\s;&|\\\"\\x27<>]*/)?(?:\\.beacon(?:/[^\\s;&|\\\"\\x27<>]*)?|runtime\\.jsonl(?:\\.[^\\s;&|\\\"\\x27<>]*)?|var/log/beacon-agent(?:/[^\\s;&|\\\"\\x27<>]*)?)|[^\\s;&|\\\"\\x27<>]*/(?:plugins?|extensions)/beacon(?:-endpoint)?(?:\\.[jt]s|/[^\\s;&|\\\"\\x27<>]*)?|(?:[^\\s;&|\\\"\\x27<>]*/)?(?:\\.(?:bash_history|zsh_history|sh_history|history)|fish_history))[\\\"\\x27]?(?:[ \\t]|$|[;&|\\n<>#])|(?:cat[ \\t]+/dev/null|:|true|(?:echo|printf)(?:[ \\t]+[\\\"\\x27][\\\"\\x27])?)[ \\t]*>[ \\t]*[\\\"\\x27]?(?:(?:[^\\s;&|\\\"\\x27<>]*/)?(?:\\.beacon(?:/[^\\s;&|\\\"\\x27<>]*)?|runtime\\.jsonl(?:\\.[^\\s;&|\\\"\\x27<>]*)?|var/log/beacon-agent(?:/[^\\s;&|\\\"\\x27<>]*)?)|[^\\s;&|\\\"\\x27<>]*/(?:plugins?|extensions)/beacon(?:-endpoint)?(?:\\.[jt]s|/[^\\s;&|\\\"\\x27<>]*)?|(?:[^\\s;&|\\\"\\x27<>]*/)?(?:\\.(?:bash_history|zsh_history|sh_history|history)|fish_history))[\\\"\\x27]?(?:[ \\t]|$|[;&|\\n<>#])|>[ \\t]*[\\\"\\x27]?(?:(?:[^\\s;&|\\\"\\x27<>]*/)?(?:\\.beacon(?:/[^\\s;&|\\\"\\x27<>]*)?|runtime\\.jsonl(?:\\.[^\\s;&|\\\"\\x27<>]*)?|var/log/beacon-agent(?:/[^\\s;&|\\\"\\x27<>]*)?)|[^\\s;&|\\\"\\x27<>]*/(?:plugins?|extensions)/beacon(?:-endpoint)?(?:\\.[jt]s|/[^\\s;&|\\\"\\x27<>]*)?|(?:[^\\s;&|\\\"\\x27<>]*/)?(?:\\.(?:bash_history|zsh_history|sh_history|history)|fish_history))[\\\"\\x27]?(?:[ \\t]|$|[;&|\\n<>#])|systemctl[ \\t]+(?:--user[ \\t]+)?(?:stop|disable|mask|kill)\\b[^;&|\\n#]*[ \\t][\\\"\\x27]?(?:[^\\s;&|\\\"\\x27]*/)?(?:com\\.beacon\\.endpoint\\.[\\w.*-]+|beacon-(?:collector|otelcol|asymptote-forwarder|inventory|session-sync|updater)(?:\\.(?:service|timer))?)[\\\"\\x27]?(?:[ \\t]|$|[;&|\\n<>#])|service[ \\t]+beacon-collector[ \\t]+stop(?:[ \\t]|$|[;&|\\n<>#])|launchctl[ \\t]+(?:unload|bootout|remove|stop|kill)\\b[^;&|\\n#]*[ \\t][\\\"\\x27]?(?:[^\\s;&|\\\"\\x27]*/)?(?:com\\.beacon\\.endpoint\\.[\\w.*-]+|beacon-(?:collector|otelcol|asymptote-forwarder|inventory|session-sync|updater)(?:\\.(?:service|timer))?)[\\\"\\x27]?(?:[ \\t]|$|[;&|\\n<>#])|(?:pkill|killall)\\b[^;&|\\n#]*[ \\t][\\\"\\x27]?(?:[^\\s;&|\\\"\\x27]*/)?(?:com\\.beacon\\.endpoint\\.[\\w.*-]+|beacon-(?:collector|otelcol|asymptote-forwarder|inventory|session-sync|updater)(?:\\.(?:service|timer))?)[\\\"\\x27]?(?:[ \\t]|$|[;&|\\n<>#])|beacon[ \\t]+endpoint[ \\t]+(?:uninstall|disconnect|hooks[ \\t]+uninstall)(?:[ \\t]|$|[;&|\\n<>#])|history[ \\t]+(?:-c|-w[ \\t]+/dev/null)(?:[ \\t]|$|[;&|\\n<>#])|(?:unset[ \\t]+HISTFILE|(?:export[ \\t]+)?(?:HISTFILE[ \\t]*=[ \\t]*(?:/dev/null|[\\\"\\x27][\\\"\\x27])|(?:HISTSIZE|HISTFILESIZE)[ \\t]*=[ \\t]*0))(?:[ \\t]|$|[;&|\\n<>#])|(?:export[ \\t]+)?HISTFILE=[ \\t]*(?:$|[;&|\\n#]|[0-9]*[<>]|&>)|set[ \\t]+\\+o[ \\t]+history(?:[ \\t]|$|[;&|\\n<>#])|(?:rm|unlink|shred|truncate)\\b[^;&|\\n#]*[ \\t][\\\"\\x27]?[^\\s;&|\\\"\\x27]*/\\.(?:bash_history|zsh_history|sh_history)[\\\"\\x27]?(?:[ \\t]|$|[;&|\\n<>#]))"))
  )

emit:
  reason: "Beacon telemetry or shell history disabled or removed"

tests:
  - name: match_1_rm_rf_beacon
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "rm -rf ~/.beacon/" }
        session: { id: s1 }
  - name: match_2_rm_var_log_beacon_agent_runtime_jsonl
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "rm /var/log/beacon-agent/runtime.jsonl" }
        session: { id: s1 }
  - name: match_3_truncate_s_0_runtime_jsonl
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "truncate -s 0 runtime.jsonl" }
        session: { id: s1 }
  - name: match_4_beacon_endpoint_logs_runtime_jsonl
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: ": > ~/.beacon/endpoint/logs/runtime.jsonl" }
        session: { id: s1 }
  - name: match_5_cat_dev_null_runtime_jsonl
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "cat /dev/null > runtime.jsonl" }
        session: { id: s1 }
  - name: match_6_runtime_jsonl
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: ">runtime.jsonl" }
        session: { id: s1 }
  - name: match_7_echo_runtime_jsonl
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "echo \"\" > runtime.jsonl" }
        session: { id: s1 }
  - name: match_8_systemctl_stop_beacon_collector_service
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "systemctl stop beacon-collector.service" }
        session: { id: s1 }
  - name: match_9_service_beacon_collector_stop
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "service beacon-collector stop" }
        session: { id: s1 }
  - name: match_10_systemctl_user_disable_beacon_collector_service
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "systemctl --user disable beacon-collector.service" }
