      - event: { action: command.executed }
        command: { command: "cat runtime.jsonl > backup.jsonl" }
        session: { id: s1 }
  - name: no_match_14_echo_hello_runtime_jsonl
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "echo hello >> runtime.jsonl" }
        session: { id: s1 }
  - name: no_match_15_histsize_1000
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "HISTSIZE=1000" }
        session: { id: s1 }
  - name: no_match_16_set_o_history
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "set -o history" }
