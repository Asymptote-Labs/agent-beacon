        command: { command: "history" }
        session: { id: s1 }
  - name: no_match_7_history_10
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "history 10" }
        session: { id: s1 }
  - name: no_match_8_rm_notes_txt_cat_runtime_jsonl
    verdict: no_match
    events:
