id: crontab-modification
spec: threat-rules/v1.3  # needed for args and predicates
version: 4
title: Crontab modified (user, system, or spool)
description: >
  A persistent-scheduling primitive was modified: the user crontab
  (crontab -e, crontab <file>, echo '...' | crontab -, crontab -r to
  remove), the system crontab (/etc/crontab), a drop-in under
  /etc/cron.d/ or /etc/cron.{hourly,daily,weekly,monthly}/, or a
  user's spool file under /var/spool/cron/. Adding a cron entry is a
  near-universal persistence primitive — once installed, the job runs
  on schedule even after the originating agent session ends. The
  command is found by what the line runs: crontab, also under sudo, by
  absolute path or inside `bash -c`, that edits (-e), removes (-r) or
  installs (a file operand, `-`, or no operand at all, which reads
  standard input), so a `crontab -l` list, or crontab in a commit
  message or a here-document, does not fire. The text pattern is asked
  only of the text that reaches a command the parser cannot see into
  (unread_text). A file event
  is matched on its path, so a `cat /etc/crontab` read does not fire.
severity: high
status: experimental
posture: detect
taxonomy:
  beacon_category: risky-command
  owasp_llm: LLM06
  mitre_atlas: AML.T0011

# crontab installs when its words are an optional `-u user` and at most one operand. A
# file under ~ or held in a variable is an empty word of args, and no word at all is an
# install from standard input (`crontab <<EOF`, `... | crontab`), so both forms match.
match: >
  (e.event.action == "command.executed" && (
    e.command.parsed_commands.exists(c,
      c.name == "crontab" && (
        c.args.matches("(?m)^-[is]*[er]") ||
        c.args.matches("\\A(-u(\\n.*|.+)(\\n|\\z))?(-|[^-\\n].*)?\\z"))
    ) ||
    unread_text(e, t, (t.matches("(?i)(^|[;&|]\\s*|\\bsudo\\s+)\\s*crontab\\b[^;&|]*(\\s-e\\b|\\s-[a-z]*r\\b|\\s-\\s+[a-zA-Z0-9_./-]+|\\s-\\s*$|\\b[^;&|]*\\|\\s*crontab\\b)") ||
      t.matches("(?i)(^|[;&|(]\\s*|\\bsudo\\s+)\\s*crontab(\\s+-u\\s*[^\\s;&|]+)?\\s+[a-zA-Z0-9_./~][a-zA-Z0-9_./~-]*\\s*($|[;&|)])")))
  )) || (
    e.event.action in ["file.modified", "file.created", "file.edited"] && (
      e.file.path.matches("(?i)(^|/)etc/crontab$") ||
      e.file.path.matches("(?i)(^|/)etc/cron\\.d/[^/]+$") ||
      e.file.path.matches("(?i)(^|/)etc/cron\\.(hourly|daily|weekly|monthly)/[^/]+$") ||
      e.file.path.matches("(?i)(^|/)var/spool/cron/[^/]+$")
    )
  )

emit:
  reason: "Crontab modified (user crontab -e/-r, system /etc/cron.*, or spool) — persistence primitive"

tests:
  - name: crontab_edit
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "crontab -e" }
        session: { id: s1 }
  - name: crontab_load_from_file
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "crontab /tmp/payload.cron" }
        session: { id: s1 }
  - name: crontab_load_then_cleanup
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "crontab /tmp/payload.cron && rm /tmp/payload.cron" }
        session: { id: s1 }
  - name: crontab_load_from_home
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "crontab ~/jobs.cron" }
        session: { id: s1 }
  - name: crontab_list_then_command
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "crontab -l && echo done" }
        session: { id: s1 }
  - name: crontab_backup_then_command
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "crontab -l > ~/crontab.bak && echo saved" }
        session: { id: s1 }
  - name: pipe_into_crontab
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "echo '* * * * * /tmp/x.sh' | crontab -" }
        session: { id: s1 }
  - name: crontab_remove
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "crontab -r" }
        session: { id: s1 }
  - name: write_etc_cron_d
    verdict: match
    events:
      - event: { action: file.modified }
        file: { path: "/etc/cron.d/agent-persist" }
        session: { id: s1 }
  - name: write_etc_cron_hourly
    verdict: match
    events:
      - event: { action: file.modified }
        file: { path: "/etc/cron.hourly/rotate" }
        session: { id: s1 }
  - name: write_var_spool_cron
    verdict: match
    events:
      - event: { action: file.modified }
        file: { path: "/var/spool/cron/root" }
        session: { id: s1 }
  - name: crontab_list_only
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "crontab -l" }
        session: { id: s1 }
  - name: read_etc_crontab
    verdict: no_match
    events:
      - event: { action: file.read }
        file: { path: "/etc/crontab" }
        session: { id: s1 }
  - name: ordinary_shell_command
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "echo hello world" }
        session: { id: s1 }
  - name: write_etc_cron_d_created
    verdict: match
    events:
      - event: { action: file.created }
        file: { path: "/etc/cron.d/agent-persist" }
        session: { id: s1 }
  - name: crontab_edit_for_another_user_under_sudo
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "sudo crontab -u deploy -e" }
        session: { id: s1 }
  - name: crontab_install_inside_a_shell_script
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "sudo bash -c 'crontab -u deploy /srv/deploy/jobs.cron'" }
        session: { id: s1 }
  - name: crontab_remove_by_absolute_path
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "/usr/bin/crontab -r" }
        session: { id: s1 }
  - name: crontab_from_standard_input_then_command
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "echo '*/5 * * * * /srv/job.sh' | crontab - && echo installed" }
        session: { id: s1 }
  - name: crontab_from_a_here_document
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "crontab <<'EOF'\n*/5 * * * * /srv/job.sh\nEOF" }
        session: { id: s1 }
  - name: crontab_rewritten_through_a_filter
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "crontab -l | grep -v backup | crontab -" }
        session: { id: s1 }
  - name: crontab_file_held_in_a_variable
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "crontab -u \"$SVC_USER\" \"$JOBS\"" }
        session: { id: s1 }
  - name: crontab_through_a_wrapper_the_parser_does_not_look_through
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "ssh build@host.example 'hostname; crontab -r'" }
        session: { id: s1 }
  - name: crontab_named_in_a_commit_message
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "git commit -m 'ops: stop wiping the schedule; crontab -r was a mistake'" }
        session: { id: s1 }
  - name: crontab_named_in_a_here_document
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "cat > NOTES.md <<'EOF'\nTo reset the schedule on the old host: sudo crontab -r\nEOF" }
        session: { id: s1 }
  - name: crontab_list_for_another_user
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "sudo crontab -u deploy -l | grep backup" }
        session: { id: s1 }
  - name: crontab_remove_handed_to_a_project_script
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "./deploy.sh 'sudo crontab -r'" }
        session: { id: s1 }
  - name: crontab_named_in_a_commit_message_beside_a_project_script
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "git commit -m 'ops: we ran sudo crontab -r by mistake' && ./run-tests.sh" }
        session: { id: s1 }
