      - event: { action: command.executed }
        command: { command: "git commit -m 'docs: resetting a dev database\n\ndropdb app && createdb app'" }
        session: { id: s1 }
  - name: psql_named_in_a_here_document_written_to_a_file
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "cat > NOTES.md <<'EOF'\nTo start over in development:\npsql app -c \"DROP TABLE users;\"\nredis-cli FLUSHALL\nEOF" }
        session: { id: s1 }
  - name: rails_named_in_an_echo_after_a_separator
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "echo 'the schema is stale; rails db:reset would fix it'" }
        session: { id: s1 }
  - name: sql_in_a_here_document_to_the_client_is_not_inspected
    # A script on the client's standard input is content, like a migration file. No version of
    # the rule has read it.
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "psql app <<'EOF'\nDROP TABLE users;\nEOF" }
        session: { id: s1 }
  - name: sql_that_names_a_drop_later_in_a_string
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "psql app -c \"SELECT count(*) FROM audit WHERE statement LIKE 'DROP TABLE%'\"" }
        session: { id: s1 }
  - name: redis_cli_reads_a_key_after_an_option
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "redis-cli --raw GET flushall" }
        session: { id: s1 }
  - name: django_admin_other_command
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "python3 manage.py sqlflush" }
        session: { id: s1 }
  - name: dropdb_given_to_a_project_script
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "./deploy.sh 'cd /srv; dropdb production'" }
        session: { id: s1 }
  - name: dropdb_in_a_commit_message_beside_a_project_script
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "git commit -m 'runbook; dropdb production is forbidden' && ./run-tests.sh" }
        session: { id: s1 }
