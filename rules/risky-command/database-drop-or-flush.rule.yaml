id: database-drop-or-flush
spec: threat-rules/v2.0  # needed for args and predicates
version: 4
title: Database dropped, truncated or flushed
description: >
  An agent invokes a destructive database operation through a SQL client, Redis,
  or a framework reset command. Inline SQL must begin with DROP or TRUNCATE;
  migration-file contents and arbitrary SQL scripts are not inspected. The
  command is found by what the line runs, and inline SQL or a Redis command is a
  word of that client, so the same words in a commit message, an echo or a
  here-document do not fire and the client under `sudo`, by any path or inside
  `bash -c` does; where the parser cannot see into a command, the text that
  reaches that command is matched instead (unread_text).
severity: high
status: experimental
posture: detect
taxonomy:
  beacon_category: risky-command
  owasp_llm: LLM06

# Each client is a parsed command, named after sudo, env and the like and by any path.
# Inline SQL is one word of the client as written (argv_raw), so SQL that holds a variable
# is still read: the word begins with DROP or TRUNCATE after its quote, or after the option
# it is attached to (--command=, -e"...", a cluster as -tAc is a word of its own before
# it). redis-cli takes the Redis command as its first word after its own options, so
# `redis-cli GET FLUSHALL` reads a key. A runner (bundle exec, npx, bunx, pnpm) is the
# command and the tool is words of it. A command behind sudo -l or sudo -v is not run and
# has no name, so its line is left to the text.
#
# The text half is the text patterns of version 1 as one pattern, asked of the text that
# reaches a command the parser cannot see into (unread_text): a command prefix, then what
# the command is, one alternative for each of the eight patterns it was. Each of them began
# with the same prefix, and a pattern is charged for its length each time it is asked, so
# the prefix is written once. A text matches the one pattern exactly when it matched one of
# the eight. The prefix accepts environment assignments, relative executable paths, and sudo
# execution options. Value-taking sudo options consume their argument; inspection modes
# such as sudo -l/-v are not execution prefixes.
match: >
  e.event.action == "command.executed" && (
    e.command.parsed_commands.exists(c,
      c.name.matches("^(psql|mysql|mariadb)$") &&
        c.argv_raw.exists(a, a.matches("^(?:--(?:command|execute)=|-[A-Za-z]*[ce])?[\"\\x27]?\\s*(?:(?i:DROP)\\s+(?i:TABLE|DATABASE|SCHEMA|INDEX|VIEW|MATERIALIZED|SEQUENCE|TYPE|FUNCTION|PROCEDURE|TRIGGER|EXTENSION|ROLE|USER)\\b|(?i:TRUNCATE)\\s+[a-zA-Z_\"\\x27`])")) ||
      c.name == "sqlite3" &&
        c.argv_raw.exists(a, a.matches("^[\"\\x27]\\s*(?i:DROP|TRUNCATE)\\s+(?i:TABLE|INDEX|VIEW|TRIGGER)\\b")) ||
      c.name == "dropdb" ||
      c.name == "mysqladmin" && c.args.matches("(?m)^drop$") ||
      c.name == "redis-cli" && c.args.matches("(?m)\\A(?:-[hpsaurindDXt]\\n[^\\n]*\\n|--(?:host|port|pass|user|uri|sni|cacert|cacertdir|cert|key)(?:=[^\\n]*\\n|\\n[^\\n]*\\n)|-[cex23]\\n|--(?:tls|insecure|raw|no-raw|csv|json|quoted-json|no-auth-warning|askpass|verbose)\\n)*(?i:FLUSHALL|FLUSHDB)$") ||
      c.name.matches("^(rails|rake)$") && c.args.matches("(?m)^db:(?:drop|reset|migrate:reset)$") ||
      c.name == "bundle" && c.args.matches("(?m)^exec\\n(?:[^\\n]*/)?(?:rails|rake)\\n(?:[^\\n]*\\n)*?db:(?:drop|reset|migrate:reset)$") ||
      c.name == "prisma" && c.args.matches("(?m)^migrate\\nreset$") ||
      c.name.matches("^(npx|bunx|pnpm)$") && c.args.matches("(?m)^prisma\\nmigrate\\nreset$") ||
      c.name.matches("^python[0-9.]*$") && c.args.matches("(?m)\\A(?:[^\\n]*/)?manage\\.py\\nflush$") ||
      c.name == "django-admin" && c.args.matches("(?m)\\Aflush$")
    ) ||
    unread_text(e, t,
      t.matches("(^|[;&|\\n])[ \\t]*(?:(?:then|do|else)[ \\t]+)?(?:[A-Za-z_][A-Za-z0-9_]*=(?:(?:[^\\s;&|<>#\\x27\"`]+|\\x27[^\\x27\\n]*\\x27|\"[^\"\\n]*\")+)?[ \\t]+)*(?:sudo[ \\t]+(?:(?:-[ugCDRTp][ \\t]*(?:[^\\s;&|<>#\\x27\"`]+|\\x27[^\\x27\\n]*\\x27|\"[^\"\\n]*\")+|--(?:user|group|close-from|chdir|chroot|command-timeout|prompt)(?:=|[ \\t]+)(?:[^\\s;&|<>#\\x27\"`]+|\\x27[^\\x27\\n]*\\x27|\"[^\"\\n]*\")+|-[nEHkPSb]+|--(?:non-interactive|preserve-env(?:=[A-Za-z0-9_,]+)?|set-home|reset-timestamp|stdin|background))[ \\t]+)*(?:--[ \\t]+)?(?:[A-Za-z_][A-Za-z0-9_]*=(?:(?:[^\\s;&|<>#\\x27\"`]+|\\x27[^\\x27\\n]*\\x27|\"[^\"\\n]*\")+)?[ \\t]+)*)?(?:[^\\s;&|<>#\\x27\"`=]*/)?(?:(?:psql|mysql|mariadb)\\b[^;&|\\n#]*[ \\t](?:-c|-e|--command|--execute)(?:[ \\t]+|=)[\\\"\\x27]?[ \\t]*(?:(?i:DROP)[ \\t]+(?i:TABLE|DATABASE|SCHEMA|INDEX|VIEW|MATERIALIZED|SEQUENCE|TYPE|FUNCTION|PROCEDURE|TRIGGER|EXTENSION|ROLE|USER)\\b|(?i:TRUNCATE)[ \\t]+[a-zA-Z_\\\"\\x27])|sqlite3(?:[ \\t]+-[\\w-]+)*[ \\t]+[^\\s;&|]+[ \\t][\\\"\\x27][ \\t]*(?i:DROP|TRUNCATE)[ \\t]+(?i:TABLE|INDEX|VIEW|TRIGGER)\\b|dropdb(?:[ \\t]|$|[;&|\\n<>#])|mysqladmin(?:[ \\t]+(?:-[upPhS]|--(?:user|password|port|host|socket))(?:=|[ \\t]+)?[^\\s;&|]+|[ \\t]+(?:--force|-f))*[ \\t]+drop(?:[ \\t]|$|[;&|\\n<>#])|redis-cli(?:[ \\t]+(?:-[hpansu]|--(?:host|port|pass|user|uri))(?:=|[ \\t]+)[^\\s;&|]+|[ \\t]+--(?:tls|raw|no-auth-warning))*[ \\t]+(?i:FLUSHALL|FLUSHDB)(?:[ \\t]|$|[;&|\\n<>#])|(?:bundle[ \\t]+exec[ \\t]+)?(?:rails|rake)[ \\t]+db:(?:drop|reset|migrate:reset)(?:[ \\t]|$|[;&|\\n<>#])|(?:(?:npx|pnpm[ \\t]+exec|bunx)[ \\t]+)?prisma[ \\t]+migrate[ \\t]+reset(?:[ \\t]|$|[;&|\\n<>#])|(?:python[0-9.]*[ \\t]+(?:[^\\s;&|]*/)?manage\\.py|django-admin)[ \\t]+flush(?:[ \\t]|$|[;&|\\n<>#]))"))
  )

emit:
  reason: "Database dropped, truncated or flushed"

tests:
  - name: match_1_psql_app_c_drop_table_users
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "psql app -c \"DROP TABLE users;\"" }
        session: { id: s1 }
  - name: match_2_psql_app_c_truncate_users
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "psql app -c \"TRUNCATE users;\"" }
        session: { id: s1 }
  - name: match_3_sudo_usr_bin_psql_app_command_drop_schema_public_cascade
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "sudo /usr/bin/psql app --command=\"DROP SCHEMA public CASCADE\"" }
        session: { id: s1 }
  - name: match_4_mysql_e_truncate_table_sessions
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "mysql -e \"TRUNCATE TABLE sessions\"" }
        session: { id: s1 }
  - name: match_5_mariadb_execute_drop_database_app
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "mariadb --execute=\"DROP DATABASE app\"" }
        session: { id: s1 }
  - name: match_6_sqlite3_app_db_drop_table_users
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "sqlite3 app.db \"DROP TABLE users;\"" }
        session: { id: s1 }
  - name: match_7_dropdb_production
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "dropdb production" }
        session: { id: s1 }
  - name: match_8_mysqladmin_u_root_drop_app
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "mysqladmin -u root drop app" }
        session: { id: s1 }
  - name: match_9_redis_cli_h_cache_flushall
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "redis-cli -h cache FLUSHALL" }
        session: { id: s1 }
  - name: match_10_redis_cli_flushdb_async
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "redis-cli FLUSHDB ASYNC" }
        session: { id: s1 }
  - name: match_11_redis_cli_flushdb
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "redis-cli  FLUSHDB" }
        session: { id: s1 }
  - name: match_12_mysqladmin_drop_app
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "mysqladmin  drop app" }
        session: { id: s1 }
  - name: match_13_bundle_exec_rails_db_drop
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "bundle exec rails db:drop" }
        session: { id: s1 }
  - name: match_14_rake_db_reset
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "rake db:reset" }
        session: { id: s1 }
  - name: match_15_npx_prisma_migrate_reset_force
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "npx prisma migrate reset --force" }
        session: { id: s1 }
  - name: match_16_python3_manage_py_flush_no_input
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "python3 manage.py flush --no-input" }
        session: { id: s1 }
  - name: match_17_django_admin_flush
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "django-admin flush" }
        session: { id: s1 }
  - name: no_match_1_psql_app_c_select_from_users
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "psql app -c \"SELECT * FROM users\"" }
        session: { id: s1 }
  - name: no_match_2_mysql_e_show_tables
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "mysql -e \"SHOW TABLES\"" }
        session: { id: s1 }
  - name: no_match_3_grep_drop_migrations_001_sql
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "grep DROP migrations/001.sql" }
        session: { id: s1 }
  - name: no_match_4_cat_migrations_drop_sql
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "cat migrations/drop.sql" }
        session: { id: s1 }
  - name: no_match_5_echo_drop_table_users
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "echo DROP TABLE users" }
        session: { id: s1 }
  - name: no_match_6_redis_cli_get_key
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "redis-cli GET key" }
        session: { id: s1 }
  - name: no_match_7_redis_cli_get_flushall
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "redis-cli GET FLUSHALL" }
        session: { id: s1 }
  - name: no_match_8_redis_cli_set_note_flushdb
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "redis-cli SET note FLUSHDB" }
        session: { id: s1 }
  - name: no_match_9_sqlite3_app_db_select_drop_table_users
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "sqlite3 app.db \"SELECT 'DROP TABLE users'\"" }
        session: { id: s1 }
  - name: no_match_10_rails_db_migrate
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "rails db:migrate" }
        session: { id: s1 }
  - name: no_match_11_prisma_migrate_status
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "prisma migrate status" }
        session: { id: s1 }
  - name: no_match_12_psql_app_c_select_1_echo_drop_table_users
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "psql app -c \"SELECT 1\"; echo DROP TABLE users" }
        session: { id: s1 }
  - name: no_match_13_mysqladmin_status_echo_drop_app
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "mysqladmin status\necho drop app" }
        session: { id: s1 }
  - name: no_match_14_psql_app_c_drop_table_users
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "psql app # -c DROP TABLE users" }
        session: { id: s1 }
  - name: newline
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "true\npsql app -c \"DROP TABLE users;\"" }
        session: { id: s1 }
  - name: then
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "if true; then psql app -c \"DROP TABLE users;\"" }
        session: { id: s1 }
  - name: do
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "for x in a; do psql app -c \"DROP TABLE users;\"" }
        session: { id: s1 }
  - name: else
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "if false; then true; else psql app -c \"DROP TABLE users;\"" }
        session: { id: s1 }
  - name: redirect_or_comment_1
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "psql app -c \"DROP TABLE users;\" 2>/dev/null" }
        session: { id: s1 }
  - name: redirect_or_comment_2
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "psql app -c \"DROP TABLE users;\" >/dev/null 2>&1" }
        session: { id: s1 }
  - name: redirect_or_comment_3
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "psql app -c \"DROP TABLE users;\"&>/dev/null" }
        session: { id: s1 }
  - name: redirect_or_comment_4
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "psql app -c \"DROP TABLE users;\" # maintenance" }
        session: { id: s1 }
  - name: mention_1
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "echo \"psql app -c \\\"DROP TABLE users;\\\"\"" }
        session: { id: s1 }
  - name: mention_2
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "grep -F \"psql app -c \\\"DROP TABLE users;\\\"\"" }
        session: { id: s1 }
  - name: mention_3
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "git commit -m \"psql app -c \\\"DROP TABLE users;\\\"\"" }
        session: { id: s1 }
  - name: wrong_event_action
    verdict: no_match
    events:
      - event: { action: tool.invoked }
        command: { command: "psql app -c \"DROP TABLE users;\"" }
        session: { id: s1 }
  - name: sudo_postgres_dropdb
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "sudo -u postgres dropdb app" }
        session: { id: s1 }
  - name: sudo_postgres_psql
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "sudo -u postgres psql -c \"DROP DATABASE app\"" }
        session: { id: s1 }
  - name: postgres_env
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "PGPASSWORD=secret psql -h db -c \"DROP TABLE users\"" }
        session: { id: s1 }
  - name: mysql_env
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "MYSQL_PWD=x mysql -e \"DROP DATABASE app\"" }
        session: { id: s1 }
  - name: relative_rails
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "RAILS_ENV=production bin/rails db:drop" }
        session: { id: s1 }
  - name: sudo_attached_user
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "sudo -n -upostgres dropdb app" }
        session: { id: s1 }
  - name: sudo_long_user
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "sudo --user=postgres --group postgres -- dropdb app" }
        session: { id: s1 }
  - name: env_before_and_after_sudo
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "PGHOST=db sudo -u postgres PGPASSWORD=secret psql -c \"DROP TABLE users\"" }
        session: { id: s1 }
  - name: quoted_assignment
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "PGPASSWORD=\"has spaces\" PGHOST=db psql -c \"DROP TABLE users\"" }
        session: { id: s1 }
  - name: empty_assignment
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "PGHOST= psql -c \"DROP TABLE users\"" }
        session: { id: s1 }
  - name: sudo_user_not_command
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "sudo -u dropdb echo app" }
        session: { id: s1 }
  - name: sudo_list_only
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "sudo -l -u postgres dropdb app" }
        session: { id: s1 }
  - name: sudo_validate_only
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "sudo -v dropdb app" }
        session: { id: s1 }
  - name: env_mentions_tool
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "NOTE=\"dropdb app\" echo ok" }
        session: { id: s1 }
  - name: env_read_only
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "PGPASSWORD=secret psql -c \"SELECT 1\"" }
        session: { id: s1 }
  - name: relative_rails_read_only
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "RAILS_ENV=production bin/rails db:version" }
        session: { id: s1 }
  - name: sudo_echo
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "sudo -u postgres echo \"dropdb app\"" }
        session: { id: s1 }
  - name: dropdb_under_sudo_and_env
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "sudo env PGHOST=db dropdb --if-exists app" }
        session: { id: s1 }
  - name: psql_inside_a_shell_script
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "bash -c 'psql app -c \"DROP TABLE users\"'" }
        session: { id: s1 }
  - name: redis_cli_by_absolute_path_under_nice
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "nice /usr/local/bin/redis-cli -n 2 flushdb" }
        session: { id: s1 }
  - name: sqlite3_under_timeout
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "timeout 60 sqlite3 -batch app.db 'DROP TABLE users;'" }
        session: { id: s1 }
  - name: mysqladmin_under_env
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "env MYSQL_HOST=db mysqladmin --force drop app" }
        session: { id: s1 }
  - name: rake_under_nice
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "nice rake db:migrate:reset" }
        session: { id: s1 }
  - name: prisma_through_npx_under_env
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "env CI=1 npx prisma migrate reset --force" }
        session: { id: s1 }
  - name: manage_py_flush_under_nohup
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "nohup python3 src/manage.py flush --no-input" }
        session: { id: s1 }
  - name: django_admin_flush_under_timeout
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "timeout 30 django-admin flush --settings=app.settings" }
        session: { id: s1 }
  - name: psql_option_cluster_and_sql_with_a_variable
    verdict: match
    events:
      - event: { action: command.executed }
