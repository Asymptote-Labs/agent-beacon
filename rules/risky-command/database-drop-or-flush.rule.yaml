    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "bash -c \"mysql -e'TRUNCATE TABLE sessions'\"" }
        session: { id: s1 }
  - name: rails_through_bundle_inside_a_shell_script
    verdict: match
    events:
