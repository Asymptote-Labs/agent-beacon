        command: { command: "sh -c 'pnpm exec prisma migrate reset --force'" }
        session: { id: s1 }
  - name: psql_in_a_remote_command_line
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "ssh ops@host.example 'cd /srv/app && psql app -c \"TRUNCATE sessions\"'" }
        session: { id: s1 }
