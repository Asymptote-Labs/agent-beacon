id: shell-escape-via-interactive-tool
spec: threat-rules/v1.3  # needed for args and predicates
version: 5
title: Shell escape via an interactive tool (GTFObins-style)
description: >
  A command uses a known shell-escape idiom — spawning a shell through awk
  BEGIN{system()}, perl exec/system of a shell, python pty.spawn, an editor
  (vim -c :!/:shell), find -exec sh, a tar checkpoint action, or ssh ProxyCommand. In
  a sandboxed or restricted-shell context these break out to arbitrary command
  execution. The tool is found by what the line runs, and the escape among its own
  words, so the tool under sudo, by path or inside `bash -c` fires and the idiom
  quoted in a commit message or a here-document does not. Every one of these tools
  runs something the parser does not read, so the idiom is also asked of the text that
  reaches one, or any other command the parser cannot see into (unread_text).
severity: medium
status: stable
posture: detect
taxonomy:
  beacon_category: risky-command
  owasp_llm: LLM06
  mitre_atlas: AML.T0050

# The escape is a word of the tool: awk's program, the script after perl -e, python's -c
# script, the command after vim -c / --cmd / +, the program after find -exec, tar's
# checkpoint action, the option after ssh -o (attached or not).
match: >
  e.event.action == "command.executed" && (
    e.command.parsed_commands.exists(c,
      c.name.matches("^(awk|gawk|mawk|nawk)$") && c.args.matches("(?i)BEGIN\\s*\\{\\s*system\\s*\\(") ||
      c.name.matches("^perl[0-9.]*$") && c.args.matches("(?ms)^-[A-Za-z0-9]*e\\n.*\\b(system|exec)\\b.*\\b(ba|z|da|k)?sh\\b") ||
      c.name.matches("^python[0-9.]*$") && c.args.matches("\\bpty\\.spawn\\s*\\(") ||
      c.name.matches("^(vim|vi|view|nvim|vimdiff|rvim|gvim)$") &&
        c.args.matches("(?m)^(-c|--cmd)\\n:?\\s*(!|shell\\b|py(thon)?3?\\b)|^\\+:?\\s*(!|shell\\b|py(thon)?3?\\b)") ||
      c.name == "find" && c.args.matches("(?m)^-(exec|execdir|ok|okdir)\\n(/bin/|/usr/bin/)?(ba|z|da|k)?sh$") ||
      c.name.matches("^(tar|gtar|bsdtar)$") && c.args.matches("(?mi)^--checkpoint-action=exec") ||
      c.name.matches("^(ssh|scp|sftp)$") && c.args.matches("(?mi)^-o\\n?ProxyCommand(\\s*=|\\s+)")
    ) ||
    unread_text(e, t, (
      t.matches("(?i)\\b(awk|gawk|mawk|nawk)\\b.*BEGIN\\s*\\{\\s*system\\s*\\(") ||
      t.matches("(?i)\\bperl[0-9.]*\\s+([^;&|\\n]*\\s)?-[a-z0-9]*e\\b.*\\b(system|exec)\\b.*\\b(ba|z|da|k)?sh\\b") ||
      t.matches("(?i)\\bpython[0-9.]*\\b.*\\bpty\\.spawn\\s*\\(") ||
      t.matches("(?i)\\b(vim|vi|view|nvim|vimdiff|rvim|gvim)\\b\\s+([^;&|\\n]*\\s)?((-c|--cmd)\\s+[\"']?|[\"']?\\+):?\\s*(!|shell\\b|py(thon)?3?\\b)") ||
      t.matches("(?i)\\bfind\\b.*\\s-(exec|execdir|ok|okdir)\\s+[\"']?(/bin/|/usr/bin/)?(ba|z|da|k)?sh\\b") ||
      t.matches("(?i)\\b(tar|gtar|bsdtar)\\b.*--checkpoint-action=exec") ||
      t.matches("(?i)\\b(ssh|scp|sftp)\\b.*-o\\s*[\"']?ProxyCommand(\\s*=|\\s+)")
    ))
  )

emit:
  reason: "Shell escape via an interactive tool (GTFObins-style)"

tests:
  - name: awk_system
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "awk 'BEGIN{system(\"/bin/sh\")}'" }
        session: { id: s1 }
  - name: python_pty_spawn
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "python3 -c 'import pty; pty.spawn(\"/bin/bash\")'" }
        session: { id: s1 }
  - name: find_exec_sh
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "find . -name x -exec /bin/sh \\; " }
        session: { id: s1 }
  - name: ssh_proxycommand
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "ssh -o ProxyCommand=';sh 0<&2 1>&2' host" }
        session: { id: s1 }
  - name: ssh_attached_o_proxycommand
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "ssh -oProxyCommand=';sh 0<&2 1>&2' x" }
        session: { id: s1 }
  - name: ssh_quoted_o_proxycommand
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "ssh -o 'ProxyCommand=sh -c \"id >&2\"' host" }
        session: { id: s1 }
  - name: ssh_proxycommand_space_separated
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "ssh -o 'ProxyCommand ;sh 0<&2 1>&2' x" }
        session: { id: s1 }
  - name: scp_proxycommand
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "scp -o ProxyCommand=';sh 0<&2 1>&2' x:/etc/hosts ." }
        session: { id: s1 }
  - name: ssh_other_option
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "ssh -oStrictHostKeyChecking=no host uptime" }
        session: { id: s1 }
  - name: ordinary_python
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "python3 -c 'import json; print(json.dumps({}))'" }
        session: { id: s1 }
  - name: ordinary_find
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "find . -name '*.go' -exec gofmt -w {} ;" }
        session: { id: s1 }
  - name: ordinary_awk
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "awk '{print $1}' access.log" }
        session: { id: s1 }
  - name: awk_under_sudo
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "sudo awk 'BEGIN { system(\"/bin/sh\") }'" }
        session: { id: s1 }
  - name: vim_inside_a_shell_script_with_the_file_first
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "bash -c \"vim notes.txt -c ':!/bin/sh'\"" }
        session: { id: s1 }
  - name: find_by_absolute_path
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "/usr/bin/find /etc/hostname -exec /bin/sh \\; -quit" }
        session: { id: s1 }
  - name: perl_with_another_option_before_the_script
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "sudo perl -w -e 'exec \"/bin/sh\";'" }
        session: { id: s1 }
  - name: vim_plus_command
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "vim +':!sh' notes.txt" }
        session: { id: s1 }
  - name: tar_checkpoint_action
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "tar -cf /dev/null /dev/null --checkpoint=1 --checkpoint-action=exec=/bin/sh" }
        session: { id: s1 }
  - name: escape_through_a_wrapper_the_parser_does_not_look_through
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "xargs -I{} find {} -exec /bin/sh \\; < dirs.txt" }
        session: { id: s1 }
  - name: escape_on_a_remote_host
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "ssh build@host.example 'python3 -c \"import pty; pty.spawn(\\\"/bin/sh\\\")\"'" }
        session: { id: s1 }
  - name: idioms_named_in_a_commit_message
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "git commit -m 'docs: list the escapes we block (vim -c :!sh, find . -exec sh, tar --checkpoint-action=exec)'" }
        session: { id: s1 }
  - name: idioms_named_in_a_here_document
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "cat > NOTES.md <<'EOF'\nBlocked: awk 'BEGIN{system(\"/bin/sh\")}' and ssh -o ProxyCommand=sh host\nEOF" }
        session: { id: s1 }
  - name: idiom_searched_for_with_grep
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "grep -rn 'pty.spawn(' src | head -5" }
        session: { id: s1 }
  - name: vim_command_that_is_not_a_shell
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "vim -c ':set number' +42 notes.txt" }
        session: { id: s1 }
  - name: find_exec_of_a_checksum_tool
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "find . -name '*.tgz' -exec shasum -a 256 {} +" }
        session: { id: s1 }
  - name: ssh_proxy_jump
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "ssh -o ProxyJump=bastion.example host uptime" }
        session: { id: s1 }
  - name: escape_given_to_a_script_the_parser_cannot_see_into
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "./jail-run.sh 'tar cf /dev/null x --checkpoint=1 --checkpoint-action=exec=/bin/sh'" }
        session: { id: s1 }
  - name: escape_in_a_commit_message_beside_a_script
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "git commit -m 'docs: tar --checkpoint-action=exec is a shell escape' && ./run-tests.sh" }
        session: { id: s1 }
  # The text half named awk, perl, -exec, tar and four vim names only until version 5.
  - name: gawk_handed_to_a_script
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "./x.sh \"gawk 'BEGIN { system(\\\"/bin/sh\\\") }'\"" }
        session: { id: s1 }
  - name: find_execdir_zsh_handed_to_a_script
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "./x.sh 'find . -maxdepth 0 -execdir /bin/zsh \\;'" }
        session: { id: s1 }
