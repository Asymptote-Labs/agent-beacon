id: path-injection-into-login-file
spec: threat-rules/v1.3  # needed for file_writes and predicates
version: 7
title: PATH shadowing entry written to a shell startup file
description: >
  A command writes a PATH line into a shell startup or login file, by redirecting or
  tee-ing into it or editing it in place, and that line adds a directory anyone can
  plant binaries in: /tmp,
  /var/tmp or /dev/shm, the current directory (`.` or an empty entry such as
  `PATH=:$PATH`), or a relative path. Such an entry shadows system binaries on every
  new shell or login, outside any agent sandbox and with no further prompt. Ordinary
  tool directories (`$HOME/.local/bin`, `.cargo/bin`, `/usr/local/go/bin`) do not fire:
  a command alone cannot tell them from an attacker's absolute directory. The write is
  found by what the line runs: a command, also under sudo or inside `bash -c`, whose
  written files (file_writes) include a startup file, so the same words in a commit
  message or in a here-document written to another file do not fire. Where the parser
  cannot see into a command, the text that reaches that command is matched instead
  (unread_text). The PATH line is text
  the command writes, not a command of the line, and is matched as text.
severity: high
status: stable
posture: detect
taxonomy:
  beacon_category: risky-command
  owasp_llm: LLM05
  mitre_atlas: AML.T0011

# Which file is a startup file is one definition (shell_startup_file,
# rules/concepts/sensitive-files.predicates.yaml), and so is a redirection into one written
# in text (shell_startup_file_redirect). The writes are the ones that put the line's text into
# the file (a write, an append, an edit), not every changing_write: a move or a link puts
# another file there, whose text the line does not hold.
match: >
  e.event.action == "command.executed" && (
    e.command.command.matches("(?i)\\bPATH\\s*\\+?=\\s*[\"']?([^\\s;&|\"']*:)?(/tmp|/var/tmp|/dev/shm)(/[^\\s:;&|\"']*)?(:|[\"'\\s]|$)") ||
    e.command.command.matches("(?i)\\bPATH\\s*\\+?=\\s*[\"']?(\\.?:|[^\\s;&|\"']*:\\.?(:|[\"'\\s]|$))") ||
    e.command.command.matches("(?i)\\bPATH\\s*\\+?=\\s*[\"']?([^\\s;&|\"']*:)?([A-Za-z0-9_]|\\.\\.?/|\\.[A-Za-z0-9_])[^\\s:;&|\"']*(:|[\"'\\s]|$)") ||
    e.command.command.matches("(?i)\\bset\\s+-[gxU]+\\s+PATH\\b[^;&|]*\\s((/tmp|/var/tmp|/dev/shm)(/[^\\s;&|\"']*)?|\\.)([\"'\\s]|$)")
  ) && (
    e.command.parsed_commands.exists(c, c.file_writes.exists(f,
      f.op in ["write", "append", "edit"] && shell_startup_file(f.path))) ||
    unread_text(e, t, shell_startup_file_redirect(t))
  )

emit:
  reason: "PATH entry that shadows system binaries (world-writable, relative or current directory) written to a shell startup/login file"

tests:
  - name: export_path_into_bashrc
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "echo 'export PATH=/tmp/bin:$PATH' >> ~/.bashrc" }
        session: { id: s1 }
  - name: export_path_into_the_system_bashrc
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "echo 'export PATH=/tmp/x:$PATH' | sudo tee -a /etc/bash.bashrc" }
        session: { id: s1 }
  - name: path_line_into_the_system_zshrc_through_a_script_the_parser_cannot_read
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "./provision.sh \"echo 'PATH=/tmp/bin:$PATH' >> /etc/zshrc\"" }
        session: { id: s1 }
  - name: path_assign_into_zshrc
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "printf 'PATH=.:$PATH\\n' >> /home/dev/.zshrc" }
        session: { id: s1 }
  - name: fish_set_path_into_config
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "echo 'set -gx PATH /tmp/bin $PATH' >> ~/.config/fish/config.fish" }
        session: { id: s1 }
  - name: profile_d_dropin
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "echo 'export PATH=/dev/shm/.x:$PATH' >> /etc/profile.d/custom.sh" }
        session: { id: s1 }
  - name: export_path_tee_into_bashrc
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "echo 'export PATH=/tmp/bin:$PATH' | tee -a ~/.bashrc" }
        session: { id: s1 }
  - name: path_tee_into_profile_d
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "echo 'export PATH=bin:$PATH' | sudo tee /etc/profile.d/custom.sh" }
        session: { id: s1 }
  - name: empty_entry_appended_to_path
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "echo 'export PATH=$PATH:' >> ~/.bash_profile" }
        session: { id: s1 }
  - name: current_directory_appended_to_path
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "echo 'export PATH=\"$PATH:.\"' >> ~/.zshrc" }
        session: { id: s1 }
  - name: local_bin_tool_install
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "echo 'export PATH=\"$HOME/.local/bin:$PATH\"' | tee -a ~/.zshrc" }
        session: { id: s1 }
  - name: cargo_bin_tool_install
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "echo 'export PATH=\"$HOME/.cargo/bin:$PATH\"' >> ~/.bashrc" }
        session: { id: s1 }
  - name: go_bin_appended_system_wide
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "echo 'export PATH=$PATH:/usr/local/go/bin' | sudo tee -a /etc/profile" }
        session: { id: s1 }
  - name: build_log_named_like_profile
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "PATH=bin:$PATH ./build.sh | tee ~/.profile-build.log" }
        session: { id: s1 }
  - name: tmp_mentioned_outside_path_value
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "echo 'export PATH=$HOME/.local/bin:$PATH' >> ~/.bashrc && cd /tmp" }
        session: { id: s1 }
  - name: bashrc_read_then_tee_elsewhere
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "grep PATH ~/.bashrc | tee path-notes.txt" }
        session: { id: s1 }
  - name: ephemeral_path_export_no_redirect
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "export PATH=/usr/local/bin:$PATH" }
        session: { id: s1 }
  - name: path_written_to_ordinary_file
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "echo 'export PATH=/opt/bin:$PATH' >> setup-notes.txt" }
        session: { id: s1 }
  - name: bashrc_read_only
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "grep PATH ~/.bashrc" }
        session: { id: s1 }
  - name: path_line_under_sudo_tee
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "echo 'export PATH=/var/tmp/tools:$PATH' | sudo tee -a /etc/profile > /dev/null" }
        session: { id: s1 }
  - name: path_line_inside_a_shell_script
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "sudo sh -c 'echo PATH=/dev/shm/bin:$PATH >> /etc/profile.d/tools.sh'" }
        session: { id: s1 }
  - name: path_line_into_a_quoted_home_variable_path
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "/bin/echo 'export PATH=.:$PATH' >> \"$HOME/.zshenv\"" }
        session: { id: s1 }
  - name: path_line_then_source
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "echo 'export PATH=/tmp/bin:$PATH' >> ~/.bashrc; source ~/.bashrc" }
        session: { id: s1 }
  - name: path_line_in_a_here_document_written_to_a_login_file
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "cat >> ~/.zshrc <<'EOF'\nexport PATH=/tmp/bin:$PATH\nEOF" }
        session: { id: s1 }
  - name: path_line_edited_in_place
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "sed -i 's|^export PATH=.*|export PATH=/tmp/bin:$PATH|' ~/.bashrc" }
        session: { id: s1 }
  - name: path_line_through_a_wrapper_the_parser_does_not_look_through
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "ssh build@host.example \"echo 'export PATH=/tmp/bin:\\$PATH' >> ~/.bashrc\"" }
        session: { id: s1 }
  - name: path_line_named_in_a_commit_message
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "git commit -m \"docs: the installer no longer runs echo 'export PATH=/tmp/bin:\\$PATH' >> ~/.bashrc\"" }
        session: { id: s1 }
  - name: path_line_named_in_a_here_document
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "cat > NOTES.md <<'EOF'\nThe installer used to run: echo 'export PATH=/tmp/bin:$PATH' >> ~/.bashrc\nEOF" }
        session: { id: s1 }
  - name: path_line_written_to_a_copy_of_a_login_file
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "echo 'export PATH=/tmp/bin:$PATH' >> ~/.bashrc.bak" }
        session: { id: s1 }
  - name: path_line_written_inside_an_interpreter
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "python3 -c \"import os; os.system('echo PATH=/tmp/bin >> ~/.bashrc')\"" }
        session: { id: s1 }
  - name: path_line_in_a_commit_message_beside_a_project_script
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "git commit -m 'drop echo PATH=/tmp/bin >> ~/.bashrc from installer' && ./run-tests.sh" }
        session: { id: s1 }

