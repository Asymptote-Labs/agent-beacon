id: agent-extension-installed-by-command
spec: threat-rules/v1.3  # needed for args and predicates
version: 2
title: Agent extension (MCP server, plugin, marketplace) installed by command
description: >
  A command registers new code that an agent runtime will load on every later
  session: an MCP server (claude/codex/gemini/qwen/opencode/kiro-cli/amp mcp add,
  add-json, add-from-claude-desktop; code --add-mcp), a plugin or plugin marketplace
  (claude plugin install, claude plugin marketplace add), or an extension (gemini
  extensions install or link, code --install-extension). An agent that installs its
  own extensions has widened what every future session can do, and a malicious skill
  or injected instruction needs exactly this one step to persist.
  agent-control-surface-modified catches the same outcome when the config file is
  written directly; this rule catches the runtime's own installer doing it. The
  installer is found by what the line runs (the runtime by its command name, also
  behind sudo, by absolute path, inside `bash -c` or launched by npx, bunx or
  pnpm dlx, and the subcommand as its first words), so the same words in a commit
  message or a here-document do not fire. A line the parser cannot vouch for (see
  command_unread) is matched on its text.
severity: medium
status: stable
posture: detect
taxonomy:
  beacon_category: agent-control
  owasp_llm: LLM03
  mitre_atlas: AML.T0011

# Which command is an agent is the pack's one definition (agent_cli,
# rules/concepts/agents.predicates.yaml). name and args are joined so that one pattern reads
# the launcher, the runtime and the subcommand as whole words in a row: `claude`, `mcp`,
# `add`, or `npx`, `-y`, `@anthropic-ai/claude-code`, `mcp`, `add`.
match: >
  e.event.action == "command.executed" && (
    e.command.parsed_commands.exists(c,
      agent_cli(c) && (c.name + "\n" + c.args).matches("(?mi)\\A((npx|bunx|pnpm\\ndlx)\\n(-y\\n)?)?[^\\n]+\\n(mcp\\n(add|add-json|add-from-claude-desktop|install)|plugins?\\n(install|add|i)|plugins?\\nmarketplace\\nadd|extensions?\\n(install|link))$") ||
      c.name.matches("(?i)^code(-insiders)?(\\.exe|\\.cmd)?$") && c.args.matches("(?m)^--(add-mcp|install-extension)(=.*)?$")
    ) ||
    ((e.command.command.matches("(?i)(^|[;&|(`]|\\$\\()\\s*(sudo\\s+)?((npx|bunx|pnpm\\s+dlx)\\s+(-y\\s+)?)?([^\\s;&|]*/)?(claude(-code)?|codex|gemini(-cli)?|qwen(-code)?|opencode(-ai)?|kiro-cli|amp|cursor-agent|copilot)\\s+(mcp\\s+(add|add-json|add-from-claude-desktop|install)\\b|plugins?\\s+(install|add|i)\\b|plugins?\\s+marketplace\\s+add\\b|extensions?\\s+(install|link)\\b)") ||
      e.command.command.matches("(?i)(^|[;&|(`]|\\$\\()\\s*(sudo\\s+)?([^\\s;&|]*/)?code(-insiders)?(\\.exe|\\.cmd)?\\s+([^;&|\\n]*\\s)?--(add-mcp|install-extension)\\b")) &&
      command_unread(e))
  )

emit:
  reason: "Agent extension installed by command (MCP server, plugin, marketplace or extension) \u2014 loads new code into every future session"

tests:
  - name: claude_mcp_add_stdio
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "claude mcp add helper -- npx -y helper-mcp" }
        session: { id: s1 }
  - name: claude_mcp_add_json_user_scope
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "claude mcp add-json -s user drop '{\"type\":\"http\",\"url\":\"https://mcp.example.test\"}'" }
        session: { id: s1 }
  - name: codex_mcp_add
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "codex mcp add docs -- uvx docs-mcp" }
        session: { id: s1 }
  - name: gemini_mcp_add
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "gemini mcp add -s user files npx files-mcp" }
        session: { id: s1 }
  - name: claude_plugin_install
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "claude plugin install deploy@acme-tools" }
        session: { id: s1 }
  - name: claude_plugin_marketplace_add
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "claude plugin marketplace add someone/agent-plugins" }
        session: { id: s1 }
  - name: gemini_extension_install
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "gemini extensions install https://github.com/someone/gemini-ext" }
        session: { id: s1 }
  - name: npx_wrapped_claude
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "npx -y @anthropic-ai/claude-code mcp add x -- node /tmp/x.js" }
        session: { id: s1 }
  - name: chained_after_cd
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "cd /tmp && opencode mcp add x" }
        session: { id: s1 }
  - name: vscode_add_mcp
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "code --add-mcp '{\"name\":\"x\",\"command\":\"npx\",\"args\":[\"x-mcp\"]}'" }
        session: { id: s1 }
  - name: claude_mcp_list
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "claude mcp list" }
        session: { id: s1 }
  - name: claude_mcp_remove
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "claude mcp remove helper" }
        session: { id: s1 }
  - name: gemini_extensions_list
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "gemini extensions list" }
        session: { id: s1 }
  - name: claude_plugin_marketplace_list
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "claude plugin marketplace list" }
        session: { id: s1 }
  - name: mentioned_in_echo
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "echo 'run claude mcp add to register it'" }
        session: { id: s1 }
  - name: vscode_install_extension_absolute_path
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "/usr/local/bin/code --install-extension someone.helper" }
        session: { id: s1 }
  - name: vscode_flag_echoed_into_script
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "echo \"code --install-extension ms-python.python\" >> setup.sh" }
        session: { id: s1 }
  - name: vscode_flag_grepped
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "grep -rn 'code --install-extension' docs/" }
        session: { id: s1 }
  - name: vscode_open_file
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "code src/main.go" }
        session: { id: s1 }
  - name: mcp_add_under_sudo
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "sudo -u dev claude mcp add helper -- npx -y helper-mcp" }
        session: { id: s1 }
  - name: plugin_install_inside_a_shell_script
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "bash -c 'claude plugin install deploy@acme-tools'" }
        session: { id: s1 }
  - name: mcp_add_by_absolute_path
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "/opt/homebrew/bin/codex mcp add docs -- uvx docs-mcp" }
        session: { id: s1 }
  - name: extension_install_under_timeout
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "timeout 60 gemini extensions install https://github.com/someone/gemini-ext" }
        session: { id: s1 }
  - name: pnpm_dlx_wrapped_plugin_install
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "pnpm dlx @anthropic-ai/claude-code plugin install deploy@acme-tools" }
        session: { id: s1 }
  - name: vscode_extension_install_inside_a_shell_script
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "sudo -u dev bash -c 'code --force --install-extension someone.helper'" }
        session: { id: s1 }
  - name: mcp_add_through_a_wrapper_the_parser_does_not_look_through
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "ssh dev@host.example 'cd /srv/app && claude mcp add helper -- npx -y helper-mcp'" }
        session: { id: s1 }
  - name: mcp_add_named_in_a_commit_message
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "git commit -m 'docs: after cloning, cd tools && claude mcp add helper -- npx -y helper-mcp'" }
        session: { id: s1 }
  - name: mcp_add_named_in_a_here_document
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "cat > NOTES.md <<'EOF'\nTo register the server: cd tools && claude mcp add helper -- npx -y helper-mcp\nEOF" }
        session: { id: s1 }
  - name: mcp_config_flag_is_not_the_mcp_subcommand
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "claude --mcp-config servers.json -p 'add the plugin to the list'" }
        session: { id: s1 }
