id: agent-permission-bypass-spawn
spec: threat-rules/v1.3  # needed for args and predicates
version: 3
title: Agent runtime spawned with permission/approval gating disabled
description: >
  A command.executed event launches a known AI agent runtime CLI (Claude Code, Codex,
  Cursor Agent, Aider, Goose, OpenCode, Gemini) with a flag that disables the runtime's
  own permission/approval gate — for example --dangerously-skip-permissions,
  --dangerously-bypass-approvals-and-sandbox, --permission-mode bypassPermissions,
  --sandbox (or -s) danger-full-access, --ask-for-approval never, --full-auto, or --yolo.
  Spawning a nested agent with its approval gate turned off is a control-bypass signal:
  whatever guardrails the parent runtime enforces (interactive approvals, sandboxing) do
  not apply inside the spawned agent, so the child can run arbitrary tools and commands
  unattended. This is the detect twin of the enforce-side bypass-spawn control; it flags
  the pattern in the runtime log without blocking anything. The runtime is found by
  what the line runs (its command name, also behind sudo or env, by absolute path,
  inside `bash -c` or launched by npx) and the flag as a whole word of that same
  command, so the flag in a commit message or on another command of the line does
  not fire. A line the parser cannot vouch for (see command_unread) is matched on
  its text.
severity: high
status: stable
posture: detect
taxonomy:
  beacon_category: agent-control
  owasp_llm: LLM06

# The agent runtime must be a command the line runs AND that command must carry a
# permission-bypass flag. Requiring both keeps the rule off ordinary uses of a bare
# --force on non-agent commands (e.g. git push --force, npm install --force). name and
# args are joined so that `npx codex` reads as two whole words in a row. An option's
# value is the next word or follows `=`.
match: >
  e.event.action == "command.executed" && (
    e.command.parsed_commands.exists(c,
      (c.name + "\n" + c.args).matches("(?i)\\A(npx\\n)?(claude|codex|cursor-agent|aider|goose|opencode|gemini)(\\n|\\z)") &&
      c.args.matches("(?mi)^(--dangerously-skip-permissions|--dangerously-bypass-approvals-and-sandbox|--full-auto|--yolo|--force)$|^--permission-mode[=\\n]bypasspermissions$|^(--sandbox|-s)[=\\n]danger-full-access$|^(--ask-for-approval|-a)[=\\n]never$")
    ) ||
    (e.command.command.matches("(?i)(^|[;&|]|&&|\\|\\||\\bsudo\\s+|\\benv\\s+|\\bnpx\\s+)\\s*(claude|codex|cursor-agent|aider|goose|opencode|gemini)\\b") &&
      e.command.command.matches("(?i)(--dangerously-skip-permissions|--dangerously-bypass-approvals-and-sandbox|--permission-mode[ =]+bypasspermissions|(--sandbox|(^|\\s)-s)[ =]+danger-full-access|--ask-for-approval[ =]+never|--full-auto|--yolo|(^|\\s)-a[ =]+never\\b|--force\\b)") &&
      command_unread(e))
  )

emit:
  reason: "AI agent runtime spawned with its permission/approval gate disabled"

tests:
  - name: claude_dangerously_skip_permissions
    verdict: match
    events:
      - timestamp: "2026-06-13T10:00:00Z"
        event: { action: command.executed }
        command: { command: "claude --dangerously-skip-permissions -p \"refactor the repo\"" }
        session: { id: s1 }
  - name: codex_full_auto_via_npx
    verdict: match
    events:
      - timestamp: "2026-06-13T10:01:00Z"
        event: { action: command.executed }
        command: { command: "npx codex exec --full-auto \"apply the patch\"" }
        session: { id: s1 }
  - name: cursor_agent_force
    verdict: match
    events:
      - timestamp: "2026-06-13T10:02:00Z"
        event: { action: command.executed }
        command: { command: "cursor-agent --force -m \"do the thing\"" }
        session: { id: s1 }
  - name: codex_bypass_approvals_and_sandbox
    verdict: match
    events:
      - timestamp: "2026-06-13T10:03:00Z"
        event: { action: command.executed }
        command: { command: "codex --dangerously-bypass-approvals-and-sandbox" }
        session: { id: s1 }
  - name: claude_permission_mode_bypass
    verdict: match
    events:
      - timestamp: "2026-06-13T10:04:00Z"
        event: { action: command.executed }
        command: { command: "claude -p --permission-mode bypassPermissions \"go\"" }
        session: { id: s1 }
  - name: codex_short_sandbox_flag
    verdict: match
    events:
      - timestamp: "2026-06-13T10:04:30Z"
        event: { action: command.executed }
        command: { command: "codex exec -s danger-full-access \"apply the patch\"" }
        session: { id: s1 }
  - name: codex_read_only_sandbox
    verdict: no_match
    events:
      - timestamp: "2026-06-13T10:04:40Z"
        event: { action: command.executed }
        command: { command: "codex exec -s read-only \"review the diff\"" }
        session: { id: s1 }
  - name: claude_normal_invocation_no_bypass
    verdict: no_match
    events:
      - timestamp: "2026-06-13T10:05:00Z"
        event: { action: command.executed }
        command: { command: "claude -p \"summarize the diff\"" }
        session: { id: s1 }
  - name: non_agent_command_with_force
    verdict: no_match
    events:
      - timestamp: "2026-06-13T10:06:00Z"
        event: { action: command.executed }
        command: { command: "git push --force origin main" }
        session: { id: s1 }
  - name: bypass_flag_text_but_not_a_command_execution
    verdict: no_match
    events:
      - timestamp: "2026-06-13T10:07:00Z"
        event: { action: file.read }
        command: { command: "claude --dangerously-skip-permissions" }
        file: { path: "/notes/agent-cheatsheet.md" }
        session: { id: s1 }
  - name: bypass_flag_under_sudo
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "sudo -u dev claude --dangerously-skip-permissions -p 'refactor the repo'" }
        session: { id: s1 }
  - name: bypass_flag_inside_a_shell_script
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "bash -c 'claude -p --permission-mode bypassPermissions go'" }
        session: { id: s1 }
  - name: bypass_flag_by_absolute_path
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "/opt/homebrew/bin/codex exec --sandbox=danger-full-access 'apply the patch'" }
        session: { id: s1 }
  - name: codex_never_ask_under_timeout
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "timeout 600 codex -a never exec 'apply the patch'" }
        session: { id: s1 }
  - name: bypass_flag_through_a_wrapper_the_parser_does_not_look_through
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "ssh dev@host.example 'cd /srv/app && claude --dangerously-skip-permissions -p go'" }
        session: { id: s1 }
  - name: bypass_flag_named_in_a_commit_message
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "git commit -m 'docs: never start it as sudo claude --dangerously-skip-permissions'" }
        session: { id: s1 }
  - name: bypass_flag_named_in_a_here_document
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "cat > NOTES.md <<'EOF'\nDo not use: env claude --dangerously-skip-permissions or codex --yolo\nEOF" }
        session: { id: s1 }
  - name: codex_asks_on_request
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "codex exec -a on-request --sandbox workspace-write 'review the diff'" }
        session: { id: s1 }
