id: handoff-to-second-agent-with-credentials
spec: threat-rules/v1.3  # needed for args and predicates
version: 7
title: Agent handed off to a second agent with credential-shaped payload
description: >
  A command.executed event spawns or invokes a second AI agent runtime
  (claude, codex, cursor-agent, aider, goose, opencode, gemini, or an MCP
  server) and the same command line includes a credential-shaped token
  reference — the name of a credential file (`.env`, `.aws/credentials`,
  `.ssh/id_*`, `.netrc`, `.pgpass`, `secrets.yaml` and the rest of what
  credential-file-read means by one) or of a Kubernetes, GnuPG or password
  manager store (`.kube/config`, `.gnupg/private-keys-v1.d/`, `secring.gpg`,
  `*.kdbx`), as the pack's credential catalog defines them
  (rules/concepts/credential-stores.catalog.yaml), or a literal token that
  matches a high-entropy bearer
  (Bearer eyJ..., sk-..., ghp_..., AKIA..., xox[bpars]-...) embedded in
  the command line. The second agent thus inherits the secret in its
  initial context, a classic LLM06/AML.T0024 exfiltration shape. The
  rule requires both the second-agent invocation AND the credential
  reference to fire. Beacon redacts literal tokens before it writes the
  log and keeps their type prefix (`ghp_[REDACTED]`, `AKIA[REDACTED]`,
  `Bearer eyJ[REDACTED]`), so the literal arm matches that form as well
  as the raw one. A bare `Bearer [REDACTED]` is not enough: the redactor
  also writes it for prose ("bearer token auth") and `$VARIABLE`
  references. The second agent is found by what the line runs (its command
  name, also behind sudo or env, by absolute path, inside `bash -c` or
  launched by npx), so an agent's name in a commit message or a
  here-document does not fire; the text pattern is asked of the text that
  reaches a command the parser cannot see into (unread_text). The credential reference is
  content, usually inside the prompt handed over, and is looked for in the
  whole command line.
severity: critical
status: experimental
posture: detect
taxonomy:
  beacon_category: agent-control
  owasp_llm: LLM06
  mitre_atlas: AML.T0024

# Which command is an agent is the pack's one definition (agent_cli,
# rules/concepts/agents.predicates.yaml); an MCP server counts here as well: `mcp server`,
# `mcp-server`, `mcp-server-git` and the like, directly or through npx. What is handed over
# is text (a prompt, a path given to any option), so the credential reference stays a test
# of the text.
match: >
  e.event.action == "command.executed" &&
  (
    credential_file_mention(e.command.command) ||
    credential_mention(e.command.command, "likely", "kubernetes", "gpg", "password-manager") ||
    e.command.command.matches("(?i)(Bearer\\s+eyJ([A-Za-z0-9_-]{10,}|\\[REDACTED\\])|sk-([A-Za-z0-9]{20,}|\\[REDACTED\\])|ghp_([A-Za-z0-9]{20,}|\\[REDACTED\\])|AKIA([0-9A-Z]{16}|\\[REDACTED\\])|xox[bpars]-([A-Za-z0-9-]{10,}|\\[REDACTED\\]))")
  ) &&
  (
    e.command.parsed_commands.exists(c,
      agent_cli(c) ||
      c.name.matches("(?i)^mcp-?server(-[a-z0-9-]+)?$") ||
      c.name.matches("(?i)^mcp$") && c.args.matches("(?i)\\Aserver(\\n|\\z)") ||
      c.name.matches("(?i)^npx$") && c.args.matches("(?i)\\Amcp[\\n-]?server(-[a-z0-9-]+)?(\\n|\\z)")) ||
    unread_text(e, t, agent_cli_mention(t) ||
      t.matches("(?i)(^|[;&|]|&&|\\|\\||\\bsudo\\s+|\\benv\\s+|\\bnpx\\s+)\\s*mcp[ -]?server\\b"))
  )

emit:
  reason: "Agent handed off to a second agent with a credential-shaped payload in the command line"

tests:
  - name: claude_with_dotenv_in_args
    verdict: match
    events:
      - timestamp: "2026-06-23T10:00:00Z"
        event: { action: command.executed }
        command: { command: "claude -p \"use the env in /home/u/.env.production to fill the form\"" }
        session: { id: s1 }
  - name: codex_with_ssh_key_path
    verdict: match
    events:
      - timestamp: "2026-06-23T10:01:00Z"
        event: { action: command.executed }
        command: { command: "codex exec --context /home/u/.ssh/id_rsa 'sign the deploy'" }
        session: { id: s1 }
  - name: cursor_with_aws_credentials
    verdict: match
    events:
      - timestamp: "2026-06-23T10:02:00Z"
        event: { action: command.executed }
        command: { command: "cursor-agent --file ~/.aws/credentials 'sync the buckets'" }
        session: { id: s1 }
  - name: claude_with_bearer_token_literal
    verdict: match
    events:
      - timestamp: "2026-06-23T10:03:00Z"
        event: { action: command.executed }
        command: { command: "claude -p 'Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.payload.sig - hit /api'" }
        session: { id: s1 }
  - name: claude_with_github_token_literal
    verdict: match
    events:
      - timestamp: "2026-06-23T10:03:10Z"
        event: { action: command.executed }
        command: { command: "claude -p \"deploy with ghp_AbCdEfGhIjKlMnOpQrStUvWxYz0123456789\"" }
        session: { id: s1 }
  - name: codex_with_aws_key_literal
    verdict: match
    events:
      - timestamp: "2026-06-23T10:03:20Z"
        event: { action: command.executed }
        command: { command: "codex exec 'upload with AKIAIOSFODNN7EXAMPLE'" }
        session: { id: s1 }
  - name: gemini_with_slack_and_openai_literals
    verdict: match
    events:
      - timestamp: "2026-06-23T10:03:30Z"
        event: { action: command.executed }
        command: { command: "gemini -p 'post with xoxb-1234567890-abcdefghijkl and sk-abcdefghijklmnopqrstuvwxyz0123'" }
        session: { id: s1 }
  - name: claude_with_redacted_github_token_in_log
    verdict: match
    events:
      - timestamp: "2026-06-23T10:03:40Z"
        event: { action: command.executed }
        command: { command: "claude -p \"deploy with ghp_[REDACTED]\"" }
        session: { id: s1 }
  - name: claude_prose_about_bearer_auth
    verdict: no_match
    events:
      - timestamp: "2026-06-23T10:03:50Z"
        event: { action: command.executed }
        command: { command: "claude -p \"add bearer token auth to the API\"" }
        session: { id: s1 }
  - name: codex_with_bearer_env_reference
    verdict: no_match
    events:
      - timestamp: "2026-06-23T10:03:55Z"
        event: { action: command.executed }
        command: { command: "codex exec \"curl -H 'Authorization: Bearer $GITHUB_TOKEN' https://api.github.com/user\"" }
        session: { id: s1 }
  - name: codex_with_kubeconfig
    verdict: match
    events:
      - timestamp: "2026-06-23T10:04:00Z"
        event: { action: command.executed }
        command: { command: "npx codex exec --kubeconfig /home/u/.kube/config 'restart the cluster'" }
        session: { id: s1 }
  - name: claude_normal_invocation_no_creds
    verdict: no_match
    events:
      - timestamp: "2026-06-23T10:05:00Z"
        event: { action: command.executed }
        command: { command: "claude -p 'summarize the diff'" }
        session: { id: s1 }
  - name: second_agent_mention_without_creds
    verdict: no_match
    events:
      - timestamp: "2026-06-23T10:06:00Z"
        event: { action: command.executed }
        command: { command: "echo 'claude can do this' > notes.txt" }
        session: { id: s1 }
  - name: cred_path_read_only_no_agent_spawn
    verdict: no_match
    events:
      - timestamp: "2026-06-23T10:07:00Z"
        event: { action: command.executed }
        command: { command: "cat /home/u/.aws/credentials" }
        session: { id: s1 }
  - name: kdbx_path_in_documentation
    verdict: no_match
    events:
      - timestamp: "2026-06-23T10:08:00Z"
        event: { action: command.executed }
        command: { command: "echo 'see .kdbx for vault format' > README.md" }
        session: { id: s1 }
  - name: claude_with_dotenv_template_in_args
    verdict: no_match
    events:
      - timestamp: "2026-06-23T10:00:00Z"
        event: { action: command.executed }
        command: { command: "claude -p \"fill in the defaults from .env.example\"" }
        session: { id: s1 }
  - name: codex_with_multipart_dotenv_template_in_args
    verdict: no_match
    events:
      - timestamp: "2026-06-23T10:00:00Z"
        event: { action: command.executed }
        command: { command: "codex exec 'copy .env.local.example and add the new key'" }
        session: { id: s1 }
  - name: claude_with_template_and_real_dotenv
    verdict: match
    events:
      - timestamp: "2026-06-23T10:00:00Z"
        event: { action: command.executed }
        command: { command: "claude -p \"copy .env.example to .env and read .env\"" }
        session: { id: s1 }
  - name: handoff_under_sudo
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "sudo -u dev claude -p 'read /home/u/.aws/credentials and sync the buckets'" }
        session: { id: s1 }
  - name: handoff_inside_a_shell_script
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "bash -c 'codex exec \"copy /home/u/.ssh/id_rsa into the image\"'" }
        session: { id: s1 }
  - name: handoff_by_absolute_path
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "/opt/homebrew/bin/gemini -p 'use /home/u/.netrc to log in'" }
        session: { id: s1 }
  - name: mcp_server_started_with_a_key_file
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "mcp-server-git --repository . --identity /home/u/.ssh/id_ed25519" }
        session: { id: s1 }
  - name: handoff_through_a_wrapper_the_parser_does_not_look_through
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "ssh dev@host.example 'cd /srv/app && claude -p \"read /home/u/.aws/credentials\"'" }
        session: { id: s1 }
  - name: handoff_named_in_a_commit_message
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "git commit -m 'docs: never run sudo claude -p with /home/u/.aws/credentials in the prompt'" }
        session: { id: s1 }
  - name: handoff_named_in_a_here_document
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "cat > NOTES.md <<'EOF'\nDo not hand over secrets: env claude -p 'read /home/u/.aws/credentials'\nEOF" }
        session: { id: s1 }
  - name: agent_grepped_for_beside_a_credential_file
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "grep -rn 'codex exec' docs/ && ls -la /home/u/.ssh/id_rsa" }
        session: { id: s1 }
  - name: handoff_given_to_a_script_the_parser_cannot_see_into
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "./run-on-box.sh 'cd /srv/app; claude -p \"read /home/u/.aws/credentials\"'" }
        session: { id: s1 }
  - name: handoff_named_in_a_commit_message_beside_a_script
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "git commit -m 'docs: never run sudo claude -p with /home/u/.aws/credentials in the prompt' && ./run-tests.sh" }
        session: { id: s1 }
  # The text half named seven agents until version 7; it is agent_cli_mention.
  - name: amp_handoff_handed_to_a_script
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "./h.sh 'cd repo; amp -x \"deploy with /home/u/.aws/credentials\"'" }
        session: { id: s1 }
