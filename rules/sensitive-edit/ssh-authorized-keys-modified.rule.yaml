id: ssh-authorized-keys-modified
spec: threat-rules/v1.3  # needed for file_writes and predicates
version: 3
title: SSH authorized_keys or sshd_config modified
description: >
  The agent modified an SSH trust file: a user authorized_keys
  (~/.ssh/authorized_keys or the legacy authorized_keys2), the
  system-wide sshd_config (/etc/ssh/sshd_config and any
  sshd_config.d/* drop-in), or a known_hosts file. Modifying
  authorized_keys adds a new persistent SSH login key for the
  account — a strong persistence signal — and modifying sshd_config
  can change the server's permitted auth methods (e.g. enabling
  PermitRootLogin, PasswordAuthentication, or AuthorizedKeysFile to
  a writable path). The rule matches the well-known paths only, so
  benign edits to other ~/.ssh/* files (config, environment) do not
  fire.
severity: high
status: experimental
posture: detect
taxonomy:
  beacon_category: sensitive-edit
  owasp_llm: LLM06
  mitre_atlas: AML.T0011

# Which file is one definition (ssh_trust_file, rules/concepts/sensitive-files.predicates.yaml),
# asked of a file event's path and of every path a shell command writes (c.file_writes: a
# redirection, tee, sed -i, cp, mv), under `~` or a variable too.
match: >
  (
    e.event.action in ["file.modified", "file.created", "file.edited"] &&
    ssh_trust_file(e.file.path)
  ) || (
    e.event.action == "command.executed" &&
    e.command.parsed_commands.exists(c, c.file_writes.exists(f,
      f.op in ["write", "append", "truncate", "edit", "move_to", "link"] &&
      ssh_trust_file(f.path)))
  )

emit:
  reason: "SSH authorized_keys, known_hosts, or sshd_config modified (persistence or auth bypass)"

tests:
  - name: key_appended_by_a_command
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "mkdir -p ~/.ssh && cat /tmp/id_ed25519.pub >> ~/.ssh/authorized_keys" }
        session: { id: s1 }
  - name: key_appended_inside_a_shell_script
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "bash -c 'echo \"ssh-ed25519 AAAAC3Nza attacker\" >> \"$HOME/.ssh/authorized_keys\"'" }
        session: { id: s1 }
  - name: daemon_configuration_edited_in_place
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "sudo sed -i 's/^#PermitRootLogin.*/PermitRootLogin yes/' /etc/ssh/sshd_config" }
        session: { id: s1 }
  - name: keys_only_listed
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "wc -l ~/.ssh/authorized_keys && ssh-keygen -lf ~/.ssh/known_hosts" }
        session: { id: s1 }
  - name: modify_authorized_keys
    verdict: match
    events:
      - event: { action: file.modified }
        file: { path: "/home/u/.ssh/authorized_keys" }
        session: { id: s1 }
  - name: modify_authorized_keys2
    verdict: match
    events:
      - event: { action: file.modified }
        file: { path: "/home/u/.ssh/authorized_keys2" }
        session: { id: s1 }
  - name: modify_sshd_config
    verdict: match
    events:
      - event: { action: file.modified }
        file: { path: "/etc/ssh/sshd_config" }
        session: { id: s1 }
  - name: modify_sshd_config_d_dropin
    verdict: match
    events:
      - event: { action: file.modified }
        file: { path: "/etc/ssh/sshd_config.d/99-override.conf" }
        session: { id: s1 }
  - name: modify_known_hosts
    verdict: match
    events:
      - event: { action: file.modified }
        file: { path: "/home/u/.ssh/known_hosts" }
        session: { id: s1 }
  - name: modify_ssh_config
    verdict: no_match
    events:
      - event: { action: file.modified }
        file: { path: "/home/u/.ssh/config" }
        session: { id: s1 }
  - name: read_authorized_keys
    verdict: no_match
    events:
      - event: { action: file.read }
        file: { path: "/home/u/.ssh/authorized_keys" }
        session: { id: s1 }
  - name: modify_authorized_keys_dotbak
    verdict: no_match
    events:
      - event: { action: file.modified }
        file: { path: "/home/u/.ssh/authorized_keys.bak" }
        session: { id: s1 }
  - name: modify_authorized_keys_created
    verdict: match
    events:
      - event: { action: file.created }
        file: { path: "/home/u/.ssh/authorized_keys" }
        session: { id: s1 }
