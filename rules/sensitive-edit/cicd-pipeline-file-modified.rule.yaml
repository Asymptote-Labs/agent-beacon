id: cicd-pipeline-file-modified
spec: threat-rules/v2.0  # needed for file_writes and predicates
version: 6
title: CI/CD or deployment manifest modified
description: >
  The agent modified a CI/CD or deployment manifest (GitHub Actions workflow,
  GitLab CI, CircleCI, k8s/kustomize manifest, fly.toml, vercel.json, render.yaml).
  These run with deploy/push privileges, so an edit here can reach production or
  inject a build-time step. The k8s/kubernetes/.circleci directory branch matches at
  repo root or nested.
severity: medium
status: stable
posture: detect
taxonomy:
  beacon_category: sensitive-edit
  owasp_llm: LLM03

# Which file is one definition (cicd_pipeline_file,
# rules/concepts/sensitive-files.predicates.yaml), asked of a file event's path and of every
# path a shell command writes (c.file_writes: a redirection, tee, sed -i, cp, mv).
match: >
  file_changed(e, p, cicd_pipeline_file(p)) ||
  e.event.action == "command.executed" && cicd_pipeline_file_redirect(e.command.command) &&
    unread_text(e, t, cicd_pipeline_file_redirect(t))

emit:
  reason: "CI/CD or deployment manifest modified"

tests:
  - name: workflow_edited_in_place_by_a_command
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "sed -i 's/pull_request:/pull_request_target:/' .github/workflows/ci.yml" }
        session: { id: s1 }
  - name: workflow_written_by_a_redirection
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "printf 'on: push\\njobs: {}\\n' > .github/workflows/release.yaml" }
        session: { id: s1 }
  - name: workflow_only_linted
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "actionlint .github/workflows/ci.yml && git add .github/workflows/ci.yml" }
        session: { id: s1 }
  - name: github_workflow_edit
    verdict: match
    events:
      - event: { action: file.modified }
        file: { path: ".github/workflows/deploy.yml" }
        session: { id: s1 }
  - name: k8s_manifest_edit
    verdict: match
    events:
      - event: { action: file.modified }
        file: { path: "infra/k8s/api-deployment.yaml" }
        session: { id: s1 }
  - name: circleci_root_config
    verdict: match
    events:
      - event: { action: file.modified }
        file: { path: ".circleci/config.yml" }
        session: { id: s1 }
  - name: vercel_case_insensitive
    verdict: match
    events:
      - event: { action: file.modified }
        file: { path: "VERCEL.JSON" }
        session: { id: s1 }
  - name: ordinary_source_edit
    verdict: no_match
    events:
      - event: { action: file.modified }
        file: { path: "src/handler.go" }
        session: { id: s1 }
  - name: workflow_read_not_modified
    verdict: no_match
    events:
      - event: { action: file.read }
        file: { path: ".github/workflows/deploy.yml" }
        session: { id: s1 }
  - name: deployment_doc_near_miss
    verdict: no_match
    events:
      - event: { action: file.modified }
        file: { path: "docs/deployment.md" }
        session: { id: s1 }
  - name: github_workflow_edit_created
    verdict: match
    events:
      - event: { action: file.created }
        file: { path: ".github/workflows/deploy.yml" }
        session: { id: s1 }
  - name: a_write_handed_to_a_script
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "./setup.sh 'cat /tmp/ci.yml > .github/workflows/release.yml'" }
        session: { id: s1 }
  - name: a_write_named_in_a_commit_message_beside_a_script
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "git commit -m \"never cat /tmp/ci.yml > .github/workflows/release.yml\" && ./run-tests.sh" }
        session: { id: s1 }
