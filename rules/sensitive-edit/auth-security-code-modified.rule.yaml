id: auth-security-code-modified
spec: threat-rules/v1.3  # needed for file_writes and predicates
version: 10
title: Authentication, payment, or security source modified
description: >
  The agent modified a source file in the auth / payment / security surface (basename
  containing auth, login, session, password, payment, billing, charge, stripe, checkout,
  security, crypto, token, oauth, jwt, rbac, permission, credential). Changes here carry
  outsized risk and warrant review. Documentation (.md/.txt), lockfiles, CI workflow
  manifests, and credential stores (credentials.json/.toml — covered by
  credential-file-read) are excluded so they are not double-counted. Keyword matching
  is substring-based, so a basename that embeds a keyword (e.g. tokenizer) may match.
severity: medium
status: stable
posture: detect
taxonomy:
  beacon_category: sensitive-edit
  owasp_llm: LLM06

# Which file is one definition (auth_security_code_file,
# rules/concepts/sensitive-files.predicates.yaml), asked of a file event's path and of every
# path a shell command writes (c.file_writes: a redirection, tee, sed -i, cp, mv). A write
# that lands in a temporary directory is left out (write_outside_scratch): agents stage
# copies there all the time, and moving one back into the project is a write of its own.
# Where the parser cannot see into a command, the text that reaches it counts when it
# redirects or tees into such a file (auth_security_code_file_redirect), unless every such
# command runs in a temporary directory (opaque_commands_in_scratch) or the text writes into
# one: a text does not say which directory a relative path is in.
match: >
  file_edited(e) && auth_security_code_file(e.file.path) ||
  e.event.action == "command.executed" && (
    write_outside_scratch(e, f, changing_write(f) && auth_security_code_file(f.path)) ||
    auth_security_code_file_redirect(e.command.command) && !opaque_commands_in_scratch(e) &&
      unread_text(e, t, auth_security_code_file_redirect(t) &&
      !t.matches("(>>?\\s*|\\btee\\b([ \\t]+[^\\s;&|<>]+)*[ \\t]+)[\"']?(/private)?/(tmp|var/tmp|var/folders)/")))

emit:
  reason: "Authentication, payment, or security source file modified"

tests:
  - name: handler_edited_in_place_by_a_command
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "sed -i 's/verify=True/verify=False/' src/auth/session.py" }
        session: { id: s1 }
  - name: handler_overwritten_by_a_copy
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "cp /tmp/patched/login.go internal/login.go" }
        session: { id: s1 }
  - name: handler_copied_to_a_scratch_directory
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "mkdir -p /tmp/bak && cp internal/session.go /tmp/bak/session.go" }
        session: { id: s1 }
  - name: handler_only_tested
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "go test ./internal/auth/ -run TestSessionToken && git commit -m 'fix session.go token check'" }
        session: { id: s1 }
  - name: edit_login_handler
    verdict: match
    events:
      - event: { action: file.modified }
        file: { path: "src/auth/login.ts" }
        session: { id: s1 }
  - name: edit_charge_handler
    verdict: match
    events:
      - event: { action: file.modified }
        file: { path: "services/payments/charge.py" }
        session: { id: s1 }
  - name: edit_credentials_source
    verdict: match
    events:
      - event: { action: file.modified }
        file: { path: "src/auth/credentials.go" }
        session: { id: s1 }
  - name: edit_token_source
    verdict: match
    events:
      - event: { action: file.modified }
        file: { path: "src/auth/token.ts" }
        session: { id: s1 }
  - name: auth_doc_excluded
    verdict: no_match
    events:
      - event: { action: file.modified }
        file: { path: "docs/authentication.md" }
        session: { id: s1 }
  - name: workflow_security_excluded
    verdict: no_match
    events:
      - event: { action: file.modified }
        file: { path: ".github/workflows/security.yml" }
        session: { id: s1 }
  - name: secret_store_credentials_excluded
    verdict: no_match
    events:
      - event: { action: file.modified }
        file: { path: "config/credentials.json" }
        session: { id: s1 }
  - name: dir_named_auth_basename_clean
    verdict: no_match
    events:
      - event: { action: file.modified }
        file: { path: "src/auth/index.ts" }
        session: { id: s1 }
  - name: oracle_not_acl_false_match
    verdict: no_match
    events:
      - event: { action: file.modified }
        file: { path: "src/db/oracle.go" }
        session: { id: s1 }
  - name: ordinary_source_edit
    verdict: no_match
    events:
      - event: { action: file.modified }
        file: { path: "src/utils/format.ts" }
        session: { id: s1 }
  - name: edit_login_handler_created
    verdict: match
    events:
      - event: { action: file.created }
        file: { path: "src/auth/login.ts" }
        session: { id: s1 }
  - name: a_write_handed_to_a_script
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "./setup.sh \"echo 'return true' >> src/auth/session.go\"" }
        session: { id: s1 }
  - name: a_write_named_in_a_commit_message_beside_a_script
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "git commit -m \"never echo 'return true' >> src/auth/session.go\" && ./run-tests.sh" }
        session: { id: s1 }
