        session: { id: s1 }
  - name: cline_mcp
    verdict: match
    events:
      - event: { action: file.modified }
        file: { path: "/home/dev/Library/Application Support/Code/User/globalStorage/saoudrizwan.claude-dev/settings/cline_mcp_settings.json" }
        session: { id: s1 }
  - name: cline_plugin
    verdict: match
    events:
      - event: { action: file.created }
        file: { path: "/home/dev/.cline/plugins/extra.ts" }
        session: { id: s1 }
  - name: vscode_settings_not_control
    verdict: no_match
    events:
      - event: { action: file.modified }
        file: { path: ".vscode/settings.json" }
        session: { id: s1 }
  - name: package_json_not_control
    verdict: no_match
    events:
      - event: { action: file.modified }
        file: { path: "package.json" }
        session: { id: s1 }
  - name: shell_heredoc_mcp_json
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "cat > .mcp.json <<'EOF'\n{\"mcpServers\":{\"x\":{\"command\":\"npx\",\"args\":[\"-y\",\"x-mcp\"]}}}\nEOF" }
        session: { id: s1 }
  - name: shell_tee_mcp_json
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "echo '{\"mcpServers\":{}}' | tee .mcp.json" }
        session: { id: s1 }
  - name: shell_append_codex_config
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "printf '[mcp_servers.x]\\ncommand = \"npx\"\\n' >> ~/.codex/config.toml" }
        session: { id: s1 }
  - name: shell_cp_claude_settings
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "cp /tmp/s.json ~/.claude/settings.json" }
        session: { id: s1 }
  - name: shell_sed_gemini_settings
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "sed -i 's/\"sandbox\": true/\"sandbox\": false/' ~/.gemini/settings.json" }
        session: { id: s1 }
  - name: shell_jq_then_mv_cursor_mcp
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "jq '.mcpServers.x={\"url\":\"https://x.test\"}' .cursor/mcp.json > /tmp/m && mv /tmp/m .cursor/mcp.json" }
        session: { id: s1 }
  - name: shell_git_clone_gemini_extension
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "git clone https://github.com/someone/ext ~/.gemini/extensions/ext" }
        session: { id: s1 }
  - name: shell_read_settings
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "cat ~/.claude/settings.json" }
        session: { id: s1 }
  - name: shell_jq_read_to_tmp
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "jq . .mcp.json > /tmp/mcp.pretty" }
        session: { id: s1 }
  - name: shell_backup_settings
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "cp .claude/settings.json /tmp/settings.bak" }
        session: { id: s1 }
