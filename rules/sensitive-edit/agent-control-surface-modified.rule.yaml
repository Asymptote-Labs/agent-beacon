        session: { id: s1 }
  - name: copilot_cli_mcp
    verdict: match
    events:
      - event: { action: file.modified }
        file: { path: "/home/dev/.copilot/mcp-config.json" }
        session: { id: s1 }
  - name: copilot_repo_hooks
    verdict: match
