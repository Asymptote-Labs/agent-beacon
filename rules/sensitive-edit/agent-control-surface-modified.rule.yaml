        command: { command: "git commit -m 'docs: the installer runs tee -a .mcp.json and sed -i s/a/b/ .cursor/mcp.json'" }
        session: { id: s1 }
  - name: cp_named_in_a_here_document
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "cat > NOTES.md <<'EOF'\nTo register the server: tee -a .mcp.json, or\ncp /tmp/m.json .cursor/mcp.json\nEOF" }
        session: { id: s1 }
  - name: backup_of_home_settings
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "cp ~/.claude/settings.json ~/settings.backup.json" }
        session: { id: s1 }
  - name: download_of_a_config_saved_elsewhere
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "curl -fsSL -o /tmp/mcp.json https://host.example/configs/.mcp.json" }
        session: { id: s1 }
  - name: home_redirection_named_in_a_here_document
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "cat > NOTES.md <<'EOF'\nTo reset the hooks: echo '{}' > ~/.claude/settings.json\nEOF" }
        session: { id: s1 }
  - name: home_redirection_named_in_a_commit_message
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "git commit -m \"docs: reset with echo '{}' > ~/.claude/settings.json\"" }
        session: { id: s1 }
  - name: plugin_synced_into_home
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "rsync -a /tmp/plugin/ \"$HOME/.claude/plugins/extra/\"" }
        session: { id: s1 }
