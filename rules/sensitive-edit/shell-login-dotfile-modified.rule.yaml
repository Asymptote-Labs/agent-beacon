id: shell-login-dotfile-modified
spec: threat-rules/v1.3  # needed for file_writes and predicates
version: 7
title: Shell rc / login dotfile modified
description: >
  The agent modified a shell startup or login file: a user's dotfile (.bashrc,
  .bash_profile, .bash_login, .profile, .zshrc, .zprofile, .zshenv, .zlogin, .kshrc,
  .login, .cshrc, .tcshrc, or fish config.fish), the system's /etc/profile,
  /etc/bash.bashrc, /etc/bashrc, /etc/zshrc, /etc/zshenv, /etc/zprofile, /etc/zlogin or
  /etc/csh.cshrc, or a file of /etc/zsh or
  of a profile.d directory. These run on every new shell or login session, outside any
  agent sandbox, so an edit here is durable persistence (e.g. an injected command,
  alias, or PATH change), and a system-wide one reaches every user of the machine.
severity: high
status: stable
posture: detect
taxonomy:
  beacon_category: sensitive-edit
  owasp_llm: LLM05
  mitre_atlas: AML.T0011

# Which file is one definition (shell_startup_file,
# rules/concepts/sensitive-files.predicates.yaml), asked of a file event's path and of every
# path a shell command writes (c.file_writes: a redirection, tee, sed -i, cp, mv), under `~`
# or a variable too.
match: >
  file_changed(e, p, shell_startup_file(p))

emit:
  reason: "Shell rc / login dotfile modified — runs on every new shell/login, durable user-level persistence"

tests:
  - name: system_profile_drop_in_written_by_a_command
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "echo 'export PATH=/opt/tools:$PATH' | sudo tee /etc/profile.d/tools.sh" }
        session: { id: s1 }
  - name: system_zshrc_appended_by_a_command
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "echo 'source /opt/x.sh' | sudo tee -a /etc/zshrc" }
        session: { id: s1 }
  - name: system_bashrc_edited
    verdict: match
    events:
      - event: { action: file.modified }
        file: { path: "/etc/bash.bashrc" }
        session: { id: s1 }
  - name: red_hat_and_macos_system_bashrc_appended_by_a_command
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "echo 'alias sudo=/tmp/s' | sudo tee -a /etc/bashrc" }
        session: { id: s1 }
  - name: file_of_the_system_zsh_directory_written_inside_a_shell
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "sudo sh -c 'echo alias ls=evil >> /etc/zsh/zshenv'" }
        session: { id: s1 }
  - name: system_zshrc_only_read
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "cat /etc/zshrc /etc/bash.bashrc | grep -n PATH" }
        session: { id: s1 }
  - name: system_profile_edited
    verdict: match
    events:
      - event: { action: file.modified }
        file: { path: "/etc/profile" }
        session: { id: s1 }
  - name: line_appended_by_a_command
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "echo 'alias ls=\"ls -la\"' >> ~/.bashrc" }
        session: { id: s1 }
  - name: line_appended_under_a_variable
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "printf 'source %s\\n' /tmp/x.sh | tee -a \"$HOME/.zshrc\" >/dev/null" }
        session: { id: s1 }
  - name: dotfile_only_sourced
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "source ~/.zshrc && grep -n PATH ~/.bashrc" }
        session: { id: s1 }
  - name: bashrc_edit
    verdict: match
    events:
      - event: { action: file.modified }
        file: { path: "/home/dev/.bashrc" }
        session: { id: s1 }
  - name: zprofile_edit
    verdict: match
    events:
      - event: { action: file.modified }
        file: { path: ".zprofile" }
        session: { id: s1 }
  - name: fish_config_edit
    verdict: match
    events:
      - event: { action: file.modified }
        file: { path: "/home/dev/.config/fish/config.fish" }
        session: { id: s1 }
  - name: ordinary_config_edit
    verdict: no_match
    events:
      - event: { action: file.modified }
        file: { path: ".eslintrc.json" }
        session: { id: s1 }
  - name: profile_read_only
    verdict: no_match
    events:
      - event: { action: file.read }
        file: { path: ".profile" }
        session: { id: s1 }
  - name: bashrc_edit_created
    verdict: match
    events:
      - event: { action: file.created }
        file: { path: "/home/dev/.bashrc" }
        session: { id: s1 }
