id: autostart-unit-file-installed
spec: threat-rules/v1.3  # needed for file_writes and predicates
version: 4
title: Autostart unit / service / login-item file installed
description: >
  The agent wrote an autostart definition that re-executes outside any sandbox at
  login, boot, or on a schedule: a systemd user/system unit
  (~/.config/systemd/user/*.service or *.timer, /etc/systemd/system/*.service),
  a launchd property list under a LaunchAgents/LaunchDaemons directory
  (*.plist), an XDG autostart entry (~/.config/autostart/*.desktop), or an
  environment.d generator (~/.config/environment.d/*.conf). Planting one of these
  is durable host persistence triggered with no further prompt. This is the
  file-write counterpart of the systemctl/launchctl command rule.
severity: high
status: stable
posture: detect
taxonomy:
  beacon_category: sensitive-edit
  owasp_llm: LLM05
  mitre_atlas: AML.T0011

# Which file is one definition (autostart_unit_file,
# rules/concepts/sensitive-files.predicates.yaml), asked of a file event's path and of every
# path a shell command writes (c.file_writes: a redirection, tee, cp, mv, install, ln).
match: >
  file_changed(e, p, autostart_unit_file(p))

emit:
  reason: "Autostart unit/service/login-item file installed (systemd unit, launchd plist, XDG autostart, or environment.d) — re-executes at login/boot/schedule outside the sandbox"

tests:
  - name: launch_agent_written_by_a_here_document
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "cat > ~/Library/LaunchAgents/com.example.sync.plist <<'EOF'\n<plist><dict><key>RunAtLoad</key><true/></dict></plist>\nEOF" }
        session: { id: s1 }
  - name: systemd_unit_installed_by_a_command
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "sudo install -m 644 sync.service /etc/systemd/system/sync.service" }
        session: { id: s1 }
  - name: unit_only_inspected
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "cat ~/.config/systemd/user/sync.service && systemctl --user status sync.service" }
        session: { id: s1 }
  - name: systemd_user_service
    verdict: match
    events:
      - event: { action: file.modified }
        file: { path: "/home/dev/.config/systemd/user/evil.service" }
        session: { id: s1 }
  - name: systemd_user_timer
    verdict: match
    events:
      - event: { action: file.modified }
        file: { path: ".config/systemd/user/beacon.timer" }
        session: { id: s1 }
  - name: launchd_agent_plist
    verdict: match
    events:
      - event: { action: file.modified }
        file: { path: "/Users/dev/Library/LaunchAgents/com.evil.run.plist" }
        session: { id: s1 }
  - name: xdg_autostart_desktop
    verdict: match
    events:
      - event: { action: file.modified }
        file: { path: "/home/dev/.config/autostart/payload.desktop" }
        session: { id: s1 }
  - name: ordinary_service_file
    verdict: no_match
    events:
      - event: { action: file.modified }
        file: { path: "deploy/k8s/web.service.yaml" }
        session: { id: s1 }
  - name: plist_read_only
    verdict: no_match
    events:
      - event: { action: file.read }
        file: { path: "/Users/dev/Library/LaunchAgents/com.app.plist" }
        session: { id: s1 }
  - name: ordinary_desktop_entry
    verdict: no_match
    events:
      - event: { action: file.modified }
        file: { path: "/usr/share/applications/firefox.desktop" }
        session: { id: s1 }
  - name: systemd_user_service_created
    verdict: match
    events:
      - event: { action: file.created }
        file: { path: "/home/dev/.config/systemd/user/evil.service" }
        session: { id: s1 }
