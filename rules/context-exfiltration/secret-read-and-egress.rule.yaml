        s.argv_raw.exists(a, a.matches("(?i)\\$\\([ \\t]*(?:cat|head|tail|base64)(?:[ \\t]+[^)]*?)?[ \\t]+[\\x27\"]?(?:[^\\s;|&<>\\x27\"`()]*/)?(?:\\.env(?:\\.[\\w.-]+)?|\\.aws/credentials|id_(?:rsa|ed25519|ecdsa|dsa)|\\.git-credentials|\\.netrc|\\.pgpass|credentials(?:\\.json|\\.toml)?|\\.npmrc|\\.pypirc|\\.docker/config\\.json|\\.config/gh/hosts\\.yml|application_default_credentials\\.json|\\.config/gcloud/(?:credentials|access_tokens)\\.db|\\.azure/(?:msal_token_cache|accesstokens)\\.json|[\\w.-]*\\.tfstate(?:\\.backup)?|\\.terraform\\.d/credentials\\.tfrc\\.json)[\\x27\"]?[ \\t]*\\)"))) ||
