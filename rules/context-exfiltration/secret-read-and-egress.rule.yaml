id: secret-read-and-egress
spec: threat-rules/v1.2  # needed for e.command.parsed_commands
version: 2
title: Credential file sent in one command
description: >
  A single command sends a credential file as an HTTP body, upload, remote-copy
  source, gist input, or through a pipe or redirect to a network sender. The
  credential must be the data sent, not just another path mentioned in the command.
  Complements secret-read-then-egress, whose correlation requires separate events.
  Both this rule and credentials-in-curl-data remain: that rule also detects
  inline credential fields, and overlapping curl/wget file uploads can fire both.
  Recognizes direct shell forms and inline Python/Node HTTP body reads, not
  arbitrary shell or program dataflow through variables or intermediate files. The
  command line is read as bash: the sender is a network client the egress rules
  share (curl, wget, httpie, xh, nc, ncat, netcat, socat, by any path, under sudo,
  timeout or torsocks, or inside bash -c), and the same text in a quoted string, a
  comment or a here-document does not fire; a command line that does not parse falls
  back to matching its text.
severity: high
status: stable
posture: detect
taxonomy:
  beacon_category: context-exfiltration
  owasp_llm: LLM06
  mitre_atlas: AML.T0024

# The sender check (s), its stdin test and the /dev/tcp check are the egress rules' shared
# definition; TestPackSharedEgressSender keeps every copy identical. A credential word is a
# known secret file name, optionally quoted, after a local path that does not start with "-".
# The index lists pair an option with the word after it (the first 32 words of a command).
# Parsed alternatives, in order:
# - A sender's body/upload option names the credential, attached (-d@f, --upload-file=f,
#   -F k=@f) or as the next word (-d @f, -T f, wget --post-file f; not --data-raw).
# - A sender that reads stdin has it redirected from the credential (< f). Redirections are
#   not parsed, so the redirect is found in the text.
# - socat opens the credential, with a network address.
# - A sender's argument expands a credential read ("$(cat f)").
# - gh gist create takes the credential as an operand (not a -d/-f value), or reads it on
#   stdin (- with < f).
# - scp/rsync sends the credential as a source operand to a remote last operand; options
#   that take a value (scp -i/-F/-P/-o/-J..., rsync -e...) consume the next word.
# - An inline Python/Node program sends the file as its HTTP body.
# - A reader (cat, head, base64, ...) of the credential feeds a later stage of its pipeline
#   that is a sender reading stdin or gh gist create -, and nothing in the command line
#   redirects stdin from elsewhere (< other); or the command line writes to /dev/tcp.
# A command line that does not parse falls back to the text alternatives below, in order:
# - curl reads the credential as its request body, upload, or form file.
# - wget reads its POST/HTTP body from the credential file.
# - The reader stdout feeds a sender that consumes stdin (a GET is insufficient).
# - A reader writes directly to a shell TCP/UDP socket.
# - A network sender reads the credential through input redirection.
# - socat opens the credential as its source, with a network destination.
# - scp/rsync sends the source credential to a remote host, not a local copy.
# - gh gist create takes the credential file as an input operand.
# - curl/wget body directly expands a credential read.
# - Python/Node inline programs ("- and '-quoted) whose HTTP body is a credential read.
