id: browser-session-read-then-egress
spec: threat-rules/v1.2  # needed for e.command.parsed_commands
version: 6
title: Browser session store read followed by network egress
description: >
  Within one session, the agent read a browser cookie/login store and then issued an
  outbound network command — the SaaS session-hijack path (steal live session
  material, then ship it off the host). The read step requires a real browser store:
  cookies.sqlite / logins.json by name, or the ambiguous basenames cookies / "login
  data" only inside a known browser profile directory (Chrome/Chromium/Brave/Edge/
  Firefox/Safari, including their real on-disk dir names) so a project file named
  "cookies" does not trip it. The egress command is read as bash: a network client
  the egress rules share (curl, wget, httpie, xh, nc, ncat, netcat, socat, by any
  path, under sudo, timeout or torsocks, or inside bash -c), a /dev/tcp redirect, a
  remote copy, a gist, a cloud storage upload or an inline script request; the same
  words inside a quoted string or a here-document are not egress. A command line
  that does not parse falls back to matching its text.
severity: high
status: stable
posture: detect
taxonomy:
  beacon_category: context-exfiltration
  owasp_llm: LLM02
  mitre_atlas: AML.T0024

correlation:
  scope: session
  window: 300s
  steps:
    - id: read_browser_store
      match: >
        e.event.action == "file.read" && (
          e.file.path.matches("(?i)(^|/)(cookies\\.sqlite|logins\\.json)$") ||
          e.file.path.matches("(?i)/(google-chrome|chromium|chrome|brave[ -]?browser|bravesoftware|microsoft[ -]?edge|edge|firefox|mozilla|safari)([ -](beta|dev|canary|unstable|sxs))?/.*(cookies|login data)$")
        )
    # The sender check (s), the /dev/tcp check and the remote-copy check are the egress
    # rules' shared definition; TestPackSharedEgressSender keeps every copy identical.
    - id: egress
      match: >
        e.event.action == "command.executed" && (
          e.command.parsed_commands.exists(s,
            (s.name.matches("(?i)(^|/)(curl|wget|http|https|httpie|xh|xhs|nc|ncat|netcat|socat)$") ||
              s.name.matches("(?i)^(timeout|nice|ionice|stdbuf|doas|torsocks|proxychains4?)$") &&
              s.argv.exists(a, a.matches("(?i)(^|/)(curl|wget|http|https|httpie|xh|xhs|nc|ncat|netcat|socat)$"))) ||
            (s.name.matches("(?i)^(scp|sftp|rsync)$") && s.argv_raw.exists(a, a.matches("^[\\x27\"]?[\\w.@-]+:"))) ||
            s.name == "gh" && s.argv.exists(a, a == "gist") && s.argv.exists(a, a == "create") ||
            s.name.matches("(?i)^(python[0-9.]*|node|deno|bun|ruby|perl|php)$") &&
              s.argv.exists(a, a in ["-c", "-e", "-r"]) &&
              s.argv.exists(a, a.matches("(?i)(requests\\.(post|put|get|patch|request)\\(|urllib\\.request|urlopen\\(|http\\.client\\.|socket\\.create_connection\\(|\\.connect\\(\\(|fetch\\(|https?\\.(request|get)\\(|net::http\\.(get|post|start)|lwp::|fsockopen\\()")) ||
            s.name == "aws" && s.argv.exists(a, a == "s3") && s.argv.exists(a, a in ["cp", "sync", "mv"]) ||
            s.name == "gsutil" && s.argv.exists(a, a in ["cp", "rsync", "mv"]) ||
            s.name == "gcloud" && s.argv.exists(a, a == "storage") && s.argv.exists(a, a in ["cp", "rsync", "mv"]) ||
            s.name == "az" && s.argv.exists(a, a == "storage") && s.argv.exists(a, a == "blob") && s.argv.exists(a, a == "upload") ||
            s.name.matches("(?i)^(pwsh|powershell)(\\.exe)?$") &&
              s.argv.exists(a, a.matches("(?i)\\b(invoke-webrequest|invoke-restmethod|iwr|irm)\\b[^\\n]*https?://"))) ||
          (e.command.command.matches("[<>][&|]?\\s*/dev/(tcp|udp)/") &&
            !e.command.parsed_commands.exists(w, !w.name.matches("(?i)^(ba|z|da|k)?sh$") &&
              w.argv_raw.exists(a, a.matches("/dev/(tcp|udp)/")))) ||
          (size(e.command.parsed_commands) == 0 && (
            e.command.command.matches("(?i)\\bcurl\\s") ||
            e.command.command.matches("(?i)\\b(curl|wget)\\b[^\\n]*https?://") ||
            e.command.command.matches("(?i)\\bwget\\s") ||
            e.command.command.matches("(?i)(^|[;&|(`'\"]|\\$\\()\\s*((sudo|doas|nohup|exec|env|command|nice|time)\\s+|timeout\\s+\\S+\\s+)*([^\\s;&|'\"]*/)?(nc|ncat|netcat|socat)\\s+\\S") ||
            e.command.command.matches("(?i)\\b(nc|ncat|netcat|socat)\\s+-") ||
            e.command.command.matches("/dev/(tcp|udp)/") ||
            e.command.command.matches("(?i)(^|[;&|(`]|\\$\\()\\s*(sudo\\s+)?(scp|sftp|rsync)\\s([^;&|\\n]*\\s)?[\\w.@-]+:") ||
            e.command.command.matches("(?i)\\b(python[0-9.]*|node|deno|bun|ruby|perl|php)\\s+(-c|-e|-r)\\s[\\s\\S]*(requests\\.(post|put|get|patch|request)\\(|urllib\\.request|urlopen\\(|http\\.client\\.|socket\\.create_connection\\(|\\.connect\\(\\(|fetch\\(|https?\\.(request|get)\\(|net::http\\.(get|post|start)|lwp::|fsockopen\\()") ||
            e.command.command.matches("(?i)\\bgh\\s+gist\\s+create\\b") ||
            e.command.command.matches("(?i)\\b(aws\\s+s3\\s+(cp|sync|mv)|gsutil\\s+(-m\\s+)?(cp|rsync|mv)|gcloud\\s+storage\\s+(cp|rsync|mv)|az\\s+storage\\s+blob\\s+upload)\\b") ||
            e.command.command.matches("(?i)\\b(invoke-webrequest|invoke-restmethod|iwr|irm)\\b[^\\n]*https?://")))
        )

emit:
  reason: "Browser session store read then network egress within one session"

