id: secret-read-then-external-mcp
version: 3
title: Credential file read followed by external MCP call
description: >
  Within one session, the agent read a credential-bearing file and then invoked a
  tool on a non-local MCP server — a read-then-handoff exfiltration path where the
  egress is the MCP transport rather than a shell command. The secret-read step
  excludes .pub public keys; the MCP step anchors the local-server tokens at both ends
  so a look-alike host (localhost-evil.attacker.com) still fires. Complements the
  secret-read-then-egress rule, covering the case where the egress leg is an
  external MCP call rather than a shell command.
severity: high
status: stable
posture: detect
taxonomy:
  beacon_category: context-exfiltration
  owasp_llm: LLM02
  mitre_atlas: AML.T0024

correlation:
  scope: session
  window: 300s
  steps:
    - id: read_secret
      match: >
        (
          e.event.action == "file.read" &&
          (
            e.file.path.matches("(?i)(\\.env($|\\.|/)|\\.aws/credentials|(^|/)id_(rsa|ed25519|ecdsa|dsa)($|[^a-z0-9])|\\.git-credentials|/\\.config/git/credentials|\\.netrc($|[^a-z0-9])|\\.pgpass($|[^a-z0-9])|(^|/)credentials(\\.[a-z0-9]+)?$)") &&
            !e.file.path.matches("(?i)\\.pub($|[^a-z0-9])")
          )
        ) || (
          e.event.action == "command.executed" &&
          (e.command.command.matches("(?i)(^|[;&|(`]|\\$\\()\\s*(sudo\\s+)?(cat|tac|head|tail|less|more|bat|nl|strings|xxd|od|hexdump|base64)\\b[^;&|>\\n]*?[\\s/'\"=](\\.env(\\.[\\w.-]+)?|\\.aws/credentials|id_(rsa|ed25519|ecdsa|dsa)|\\.git-credentials|\\.netrc|\\.pgpass|credentials(\\.json|\\.toml)?|\\.npmrc|\\.pypirc|\\.docker/config\\.json|\\.config/gh/hosts\\.yml|application_default_credentials\\.json|\\.config/gcloud/(credentials|access_tokens)\\.db|\\.azure/(msal_token_cache|accesstokens)\\.json|[\\w.-]*\\.tfstate(\\.backup)?|\\.terraform\\.d/credentials\\.tfrc\\.json)($|[\\s'\";|&)<>])") || e.command.command.matches("(^|[;&|(`]|\\$\\()\\s*(sudo\\s+)?(tar|zip)(?:\\s+(?:(?:[^\\s;&|>-][^\\s;&|>]*|-|-[^\\s;&|>x-][^\\s;&|>]*|-x[^\\s;&|>]+|--(?:|[^\\s;&|>e][^\\s;&|>]*|e|e[^\\s;&|>x][^\\s;&|>]*|ex|ex[^\\s;&|>c][^\\s;&|>]*|exc|exc[^\\s;&|>l][^\\s;&|>]*|excl|excl[^\\s;&|>u][^\\s;&|>]*|exclu|exclu[^\\s;&|>d][^\\s;&|>]*|exclud|exclud[^\\s;&|>e][^\\s;&|>]*|exclude[^\\s;&|>]+))|--exclude(?:=[^\\s;&|>]*|\\s+[^\\s;&|>]+)|-x(?:\\s+[^\\s;&|>-][^\\s;&|>]*)*\\s+(?:-|-[^\\s;&|>x-][^\\s;&|>]*|-x[^\\s;&|>]+|--(?:|[^\\s;&|>e][^\\s;&|>]*|e|e[^\\s;&|>x][^\\s;&|>]*|ex|ex[^\\s;&|>c][^\\s;&|>]*|exc|exc[^\\s;&|>l][^\\s;&|>]*|excl|excl[^\\s;&|>u][^\\s;&|>]*|exclu|exclu[^\\s;&|>d][^\\s;&|>]*|exclud|exclud[^\\s;&|>e][^\\s;&|>]*|exclude[^\\s;&|>]+))))*?\\s+['\"]?(?:[^\\s;&|>'\"=-][^\\s;&|>'\"]*/)?(?i:\\.env(\\.[\\w.-]+)?|\\.aws/credentials|id_(rsa|ed25519|ecdsa|dsa)|\\.git-credentials|\\.netrc|\\.pgpass|credentials(\\.json|\\.toml)?|\\.npmrc|\\.pypirc|\\.docker/config\\.json|\\.config/gh/hosts\\.yml|application_default_credentials\\.json|\\.config/gcloud/(credentials|access_tokens)\\.db|\\.azure/(msal_token_cache|accesstokens)\\.json|[\\w.-]*\\.tfstate(\\.backup)?|\\.terraform\\.d/credentials\\.tfrc\\.json)($|[\\s'\";|&)<>])") || e.command.command.matches("(?i)(^|[;&|(`]|\\$\\()\\s*(sudo\\s+)?cp\\b[^;&|>\\n]*?[\\s/'\"=](\\.env(\\.(?:[-0-9_abcfghijklmnopqruvwxyz][\\w-]*|d|d[-0-9_abcdefghjklmnopqrstuvwxyz][\\w-]*|di|di[-0-9_abcdefghijklmnopqrtuvwxyz][\\w-]*|dis|dis[-0-9_abcdefghijklmnopqrsuvwxyz][\\w-]*|dist[\\w-]+|e|e[-0-9_abcdefghijklmnopqrstuvwyz][\\w-]*|ex|ex[-0-9_bcdefghijklmnopqrstuvwxyz][\\w-]*|exa|exa[-0-9_abcdefghijklnopqrstuvwxyz][\\w-]*|exam|exam[-0-9_abcdefghijklmnoqrstuvwxyz][\\w-]*|examp|examp[-0-9_abcdefghijkmnopqrstuvwxyz][\\w-]*|exampl|exampl[-0-9_abcdfghijklmnopqrstuvwxyz][\\w-]*|example[\\w-]+|s|s[-0-9_bcdefghijklmnopqrstuvwxyz][\\w-]*|sa|sa[-0-9_abcdefghijklnopqrstuvwxyz][\\w-]*|sam|sam[-0-9_abcdefghijklmnoqrstuvwxyz][\\w-]*|samp|samp[-0-9_abcdefghijkmnopqrstuvwxyz][\\w-]*|sampl|sampl[-0-9_abcdfghijklmnopqrstuvwxyz][\\w-]*|sample[\\w-]+|t|t[-0-9_abcdfghijklmnopqrstuvwxyz][\\w-]*|te|te[-0-9_abcdefghijklnopqrstuvwxyz][\\w-]*|tem|tem[-0-9_abcdefghijklmnoqrstuvwxyz][\\w-]*|temp|temp[-0-9_abcdefghijkmnopqrstuvwxyz][\\w-]*|templ|templ[-0-9_bcdefghijklmnopqrstuvwxyz][\\w-]*|templa|templa[-0-9_abcdefghijklmnopqrsuvwxyz][\\w-]*|templat|templat[-0-9_abcdfghijklmnopqrstuvwxyz][\\w-]*|template[\\w-]+)(\\.[\\w.-]*)?)?|\\.aws/credentials|id_(rsa|ed25519|ecdsa|dsa)|\\.git-credentials|\\.netrc|\\.pgpass|credentials(\\.json|\\.toml)?|\\.npmrc|\\.pypirc|\\.docker/config\\.json|\\.config/gh/hosts\\.yml|application_default_credentials\\.json|\\.config/gcloud/(credentials|access_tokens)\\.db|\\.azure/(msal_token_cache|accesstokens)\\.json|[\\w.-]*\\.tfstate(\\.backup)?|\\.terraform\\.d/credentials\\.tfrc\\.json)['\"]?\\s+[^\\s;&|<>]") || e.command.command.matches("(?i)(^|[;&|(`]|\\$\\()\\s*(sudo\\s+)?(grep|egrep|fgrep|rg|awk|sed|jq)\\b[^;&|>\\n]*?(\\s['\"]?[^\\s;&|'\"]*/(\\.env(\\.[\\w.-]+)?|\\.aws/credentials|id_(rsa|ed25519|ecdsa|dsa)|\\.git-credentials|\\.netrc|\\.pgpass|credentials(\\.json|\\.toml)?|\\.npmrc|\\.pypirc|\\.docker/config\\.json|\\.config/gh/hosts\\.yml|application_default_credentials\\.json|\\.config/gcloud/(credentials|access_tokens)\\.db|\\.azure/(msal_token_cache|accesstokens)\\.json|[\\w.-]*\\.tfstate(\\.backup)?|\\.terraform\\.d/credentials\\.tfrc\\.json)($|[\\s'\";|&)<>])|\\s[^\\s-][^\\s;&|>]*\\s+(\\.env(\\.[\\w.-]+)?|\\.aws/credentials|id_(rsa|ed25519|ecdsa|dsa)|\\.git-credentials|\\.netrc|\\.pgpass|credentials(\\.json|\\.toml)?|\\.npmrc|\\.pypirc|\\.docker/config\\.json|\\.config/gh/hosts\\.yml|application_default_credentials\\.json|\\.config/gcloud/(credentials|access_tokens)\\.db|\\.azure/(msal_token_cache|accesstokens)\\.json|[\\w.-]*\\.tfstate(\\.backup)?|\\.terraform\\.d/credentials\\.tfrc\\.json)\\s*($|[;&|)]))"))
        )
    - id: external_mcp
      match: >
        e.event.action == "mcp.tool_invoked" &&
        e.mcp.server != "" &&
        !e.mcp.server.matches("(?i)^([a-z+]+://)?(local|localhost|::1|stdio|unix:|local:|127\\.0\\.0\\.1)([:/]|$)")

emit:
  reason: "Credential file read then external MCP call within one session"

tests:
  - name: read_env_then_remote_mcp
    verdict: match
    events:
      - timestamp: "2026-06-13T10:00:00Z"
        event: { action: file.read }
        file: { path: "service/.env" }
        session: { id: s1 }
      - timestamp: "2026-06-13T10:00:30Z"
        event: { action: mcp.tool_invoked }
        mcp: { server: "https://api.notion.com", tool: "create_page" }
        session: { id: s1 }
  - name: read_env_then_localhost_lookalike_mcp
    verdict: match
    events:
      - timestamp: "2026-06-13T10:00:00Z"
        event: { action: file.read }
        file: { path: "app/.env" }
        session: { id: s1 }
      - timestamp: "2026-06-13T10:00:30Z"
        event: { action: mcp.tool_invoked }
        mcp: { server: "localhost-evil.attacker.com", tool: "exfil" }
        session: { id: s1 }
  - name: read_env_then_local_mcp
    verdict: no_match
    events:
      - timestamp: "2026-06-13T10:00:00Z"
        event: { action: file.read }
        file: { path: "service/.env" }
        session: { id: s1 }
      - timestamp: "2026-06-13T10:00:30Z"
        event: { action: mcp.tool_invoked }
        mcp: { server: "localhost", tool: "search" }
        session: { id: s1 }
  - name: pub_key_read_then_remote_mcp
    verdict: no_match
    events:
      - timestamp: "2026-06-13T10:00:00Z"
        event: { action: file.read }
        file: { path: "/home/u/.ssh/id_rsa.pub" }
        session: { id: s1 }
      - timestamp: "2026-06-13T10:00:30Z"
        event: { action: mcp.tool_invoked }
        mcp: { server: "https://api.notion.com", tool: "search" }
        session: { id: s1 }
  - name: doc_about_credentials_then_remote_mcp
    verdict: no_match
    events:
      - timestamp: "2026-06-13T10:00:00Z"
        event: { action: file.read }
        file: { path: "docs/credentials-howto.md" }
        session: { id: s1 }
      - timestamp: "2026-06-13T10:00:30Z"
        event: { action: mcp.tool_invoked }
        mcp: { server: "https://api.notion.com", tool: "search" }
        session: { id: s1 }
  - name: benign_read_then_remote_mcp
    verdict: no_match
    events:
      - timestamp: "2026-06-13T10:00:00Z"
        event: { action: file.read }
        file: { path: "README.md" }
        session: { id: s1 }
      - timestamp: "2026-06-13T10:00:30Z"
        event: { action: mcp.tool_invoked }
        mcp: { server: "https://api.notion.com", tool: "search" }
        session: { id: s1 }
  - name: shell_read_then_mcp
    verdict: match
    events:
      - timestamp: "2026-06-13T10:00:00Z"
        event: { action: command.executed }
        command: { command: "cat .env" }
        session: { id: s1 }
      - timestamp: "2026-06-13T10:00:20Z"
        event: { action: mcp.tool_invoked }
        mcp: { server: "https://mcp.notes.example/sse", tool: save_note }
        session: { id: s1 }
