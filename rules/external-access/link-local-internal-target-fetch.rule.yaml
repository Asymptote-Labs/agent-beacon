id: link-local-internal-target-fetch
spec: threat-rules/v1.3  # needed for args and predicates
version: 2
title: HTTP client fetch of a link-local or internal-only address
description: >
  A command uses curl/wget to fetch an explicit link-local (169.254.0.0/16) or
  loopback-adjacent internal target by IP, including the IMDS-equivalent IPv6
  link-local address (fd00:ec2::254) and the AWS IMDS DNS alias. Agents reaching
  link-local space are characteristic of SSRF probing and metadata / internal
  service credential theft rather than normal task work. The client is found by
  what the line runs and the target (see cloud_metadata_link_local_target) must be
  one of its words, so curl under sudo, inside `bash -c` or by its path fires, and
  the URL in a commit message, a here-document or the words of another command does
  not. A line the parser cannot vouch for (see command_unread) is matched on its text.
severity: medium
status: stable
posture: detect
taxonomy:
  beacon_category: external-access
  owasp_llm: LLM06
  mitre_atlas: AML.T0024

# The target is looked for in the words as written (argv_raw): a word with brackets or a
# variable has no known value. Where the words of the client do not show what it fetches
# (see client_target_unseen: `U=http://[fd00:ec2::254]; curl $U/latest/`) and the target is
# elsewhere on the line, the text decides.
match: >
  e.event.action == "command.executed" && (
    e.command.parsed_commands.exists(c, c.name.matches("^(curl|wget)$") && (
      c.argv_raw.exists(a, cloud_metadata_link_local_target(a)) ||
      client_target_unseen(c) && cloud_metadata_link_local_target(e.command.command))) ||
    (e.command.command.matches("(?i)\\b(curl|wget)\\b") &&
      cloud_metadata_link_local_target(e.command.command) &&
      command_unread(e))
  )

emit:
  reason: "HTTP client request to a link-local / internal-only metadata target"

tests:
  - name: ipv6_imds_linklocal
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "curl -s http://[fd00:ec2::254]/latest/meta-data/" }
        session: { id: s1 }
  - name: ecs_task_role_endpoint
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "curl -s http://169.254.170.2/v2/credentials/abc" }
        session: { id: s1 }
  - name: instance_data_alias
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "wget -qO- http://instance-data/latest/meta-data/iam/" }
        session: { id: s1 }
  - name: benign_localhost_dev
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "curl -s http://127.0.0.1:8080/health" }
        session: { id: s1 }
  - name: benign_public_host
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "curl -s https://registry.example.com/v2/" }
        session: { id: s1 }
  - name: curl_under_sudo
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "sudo curl -s http://[fd00:ec2::254]/latest/meta-data/iam/info" }
        session: { id: s1 }
  - name: wget_inside_a_shell_script
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "bash -c 'wget -qO- http://instance-data.ec2.internal/latest/meta-data/iam/'" }
        session: { id: s1 }
  - name: curl_by_absolute_path
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "/usr/bin/curl -s http://169.254.170.2/v2/metadata" }
        session: { id: s1 }
  - name: ipv6_link_local_address
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "curl -s 'http://[fe80::a9fe:a9fe%25eth0]/latest/meta-data/'" }
        session: { id: s1 }
  - name: url_held_by_a_variable
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "U=http://[fd00:ec2::254]; curl -s \"$U/latest/dynamic/instance-identity/document\"" }
        session: { id: s1 }
  - name: curl_through_a_remote_shell_the_parser_does_not_read
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "ssh build@host.example 'curl -s http://[fd00:ec2::254]/latest/meta-data/'" }
        session: { id: s1 }
  - name: url_named_in_a_commit_message
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "git commit -m 'docs: curl http://[fd00:ec2::254]/latest/meta-data/ is blocked by the proxy'" }
        session: { id: s1 }
  - name: url_named_in_a_here_document
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "cat > NOTES.md <<'EOF'\nNever run wget http://instance-data/latest/meta-data/ from a build.\nEOF" }
        session: { id: s1 }
  - name: address_searched_for_beside_an_unrelated_curl
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "curl -s https://example.com/health && grep -rn 'http://169.254.170.2' deploy/" }
        session: { id: s1 }
  - name: address_without_a_url_scheme
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "curl -s --interface fe80::1%en0 https://example.com/health" }
        session: { id: s1 }

