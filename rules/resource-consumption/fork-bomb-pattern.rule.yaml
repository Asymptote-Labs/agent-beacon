id: fork-bomb-pattern
spec: threat-rules/v1.3  # needed for args and predicates
version: 5
title: Fork-bomb pattern executed in a command
description: >
  A command.executed event invokes a known fork-bomb shape — a function whose whole
  body pipes one bare command into another in the background and that is then
  called, such as the canonical `:(){ :|:& };:` under any name or spacing, the
  `while true; do ... & done` recursive spawn loop, or a fork loop in an inline
  python, perl or ruby script (python3 included). A fork bomb is a denial-of-
  service primitive that recursively spawns processes to exhaust PID and
  process-table resources; running one from an agent session is a strong
  resource-DoS or destructive-escalation signal (OWASP LLM10). The rule is
  anchored to a command boundary and matches the well-known shapes; ordinary
  long-running but bounded loops do not fire because they do not recursively
  spawn. The shell shapes are matched on the text of the line. The interpreter
  loop is found by what the line runs, an interpreter (script_interpreter) whose -e or
  -c script holds the loop, so one in a commit message or a here-document does
  not fire and `sudo python -c` or one inside `bash -c` does; its text pattern is asked
  of the text that reaches a command the parser cannot see into (unread_text).
severity: high
status: experimental
posture: detect
taxonomy:
  beacon_category: resource-consumption
  owasp_llm: LLM10
  mitre_atlas: AML.T0040

# The first three alternatives are shell syntax: a function definition whose body pipes the
# function into itself in the background, a `while true` loop that backgrounds its body, and
# a `for(;;)` loop. The parsed commands list the commands a line runs, not that one was
# defined as a function, put in the background, or repeated by a loop, so those stay text.
# The interpreter loop is a command and its script word, and is asked of the parsed commands.
# The interpreter is script_interpreter (rules/concepts/commands.predicates.yaml), so python3
# and perl5.30 count; versions before 5 named perl, python and ruby only. The script must
# fork: a call to .fork() (os.fork, Process.fork), or a bare fork and an endless loop in
# either order (perl's `fork while 1`, ruby's `while true do fork end`). Versions before
# 5 also took an endless loop with no fork in it (`while True:`, `iter(int, 1)`), which is
# no fork bomb; python3 made that common.
match: >
  e.event.action == "command.executed" && (
    e.command.command.matches("(?i)[\\w:.-]+\\s*\\(\\s*\\)\\s*\\{?\\s*[\\w:.-]+\\s*\\|\\s*[\\w:.-]+\\s*&\\s*;?\\s*\\}?[ \\t]*[;\\n]\\s*[\\w:.-]+") ||
    e.command.command.matches("(?i)\\bwhile\\s+true\\s*;?\\s*do\\b[^;&|]*&\\s*\\S") ||
    e.command.command.matches("(?i)\\bfor\\s*\\(\\s*;\\s*;\\s*\\)\\s*[;{]") ||
    e.command.parsed_commands.exists(c,
      script_interpreter(c) &&
      c.args.matches("(?mi)^-[ec]\\n.*(\\.fork\\(\\)|\\bfork\\b[^\\n]*\\bwhile\\s+(1|True)\\b|\\bwhile\\s+(1|True)\\b[^\\n]*\\bfork\\b)")) ||
    unread_text(e, t, t.matches("(?i)\\b(python[0-9.]*|nodejs|node|deno|bun|ruby|perl[0-9.]*|php)\\s+-[ec]\\s+['\"][^'\"]*(\\.fork\\(\\)|\\bfork\\b[^'\"]*\\bwhile\\s+(1|True)\\b|\\bwhile\\s+(1|True)\\b[^'\"]*\\bfork\\b)"))
  )

emit:
  reason: "Fork-bomb pattern executed (resource-DoS primitive)"

tests:
  - name: canonical_bash_fork_bomb
    verdict: match
    events:
      - timestamp: "2026-06-23T10:00:00Z"
        event: { action: command.executed }
        command: { command: ":(){ :|:& };:" }
        session: { id: s1 }
  - name: ruby_fork_in_a_loop_written_loop_first
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "ruby -e 'while true do fork end'" }
        session: { id: s1 }
  - name: while_true_fork_loop
    verdict: match
    events:
      - timestamp: "2026-06-23T10:01:00Z"
        event: { action: command.executed }
        command: { command: "while true; do nc -l 9999 & done" }
        session: { id: s1 }
  - name: for_loop_empty_init
    verdict: match
    events:
      - timestamp: "2026-06-23T10:02:00Z"
        event: { action: command.executed }
        command: { command: "for(;;){ do_thing & }" }
        session: { id: s1 }
  - name: bash_c_fork_bomb_wrapper
    verdict: match
    events:
      - timestamp: "2026-06-23T10:03:00Z"
        event: { action: command.executed }
        command: { command: "bash -c ':(){ :|:& };:'" }
        session: { id: s1 }
  - name: python_while_one_spawn
    verdict: match
    events:
      - timestamp: "2026-06-23T10:04:00Z"
        event: { action: command.executed }
        command: { command: "python -c 'import os; [os.fork() for _ in iter(int,1)]'" }
        session: { id: s1 }
  - name: spaced_bash_fork_bomb
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: ":(){ :|: & };:" }
        session: { id: s1 }
  - name: named_bomb_function
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "bomb(){ bomb|bomb& };bomb" }
        session: { id: s1 }
  - name: renamed_fork_bomb
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "f(){ f|f& };f" }
        session: { id: s1 }
  - name: spaced_renamed_fork_bomb
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "fork() { fork | fork & }; fork" }
        session: { id: s1 }
  - name: search_for_bomb_function
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "grep -rn 'bomb()' src/" }
        session: { id: s1 }
  - name: backgrounded_pipeline_function
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "watch(){ tail -f app.log | grep ERROR & }; watch" }
        session: { id: s1 }
  - name: bounded_while_loop_benign
    verdict: no_match
    events:
      - timestamp: "2026-06-23T10:05:00Z"
        event: { action: command.executed }
        command: { command: "while true; do read line; done < /dev/null" }
        session: { id: s1 }
  - name: ordinary_long_running_command
    verdict: no_match
    events:
      - timestamp: "2026-06-23T10:06:00Z"
        event: { action: command.executed }
        command: { command: "make -j8 build" }
        session: { id: s1 }
  - name: fork_bomb_mentioned_in_doc
    verdict: no_match
    events:
      - timestamp: "2026-06-23T10:07:00Z"
        event: { action: command.executed }
        command: { command: "echo 'never run a fork bomb in this repo' > notes.txt" }
        session: { id: s1 }
  - name: interpreter_loop_under_sudo
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "sudo python -c 'import os\nwhile True: os.fork()'" }
        session: { id: s1 }
  - name: interpreter_loop_inside_a_shell_script
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "bash -c \"perl -e 'fork while 1'\"" }
        session: { id: s1 }
  - name: interpreter_by_absolute_path
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "/usr/bin/ruby -e 'loop { Process.fork() }'" }
        session: { id: s1 }
  - name: interpreter_loop_through_a_wrapper_the_parser_does_not_look_through
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "ssh build@host.example \"python -c 'while True: os.fork()'\"" }
        session: { id: s1 }
  - name: interpreter_loop_named_in_a_commit_message
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "git commit -m \"docs: never run python -c 'while True: os.fork()' on a shared runner\"" }
        session: { id: s1 }
  - name: interpreter_loop_named_in_a_here_document
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "cat > NOTES.md <<'EOF'\nA fork loop looks like: python -c 'while True: os.fork()'\nEOF" }
        session: { id: s1 }
  - name: fork_call_as_a_search_pattern
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "grep -rn 'os.fork()' src/ | head -5" }
        session: { id: s1 }
  - name: interpreter_script_without_a_loop
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "python -c 'import os; print(os.cpu_count())'" }
        session: { id: s1 }
  - name: interpreter_loop_given_to_a_script
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "./run-on-host.sh 'perl -e \"fork while 1\"'" }
        session: { id: s1 }
  - name: interpreter_loop_in_a_commit_message_beside_a_script
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "git commit -m 'test: perl -e \"fork while 1\" is a fork bomb' && ./run-tests.sh" }
        session: { id: s1 }
  - name: python3_fork_loop
    # python3 is the python most systems have; versions before 5 named python only.
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "python3 -c 'import os; [os.fork() for _ in iter(int, 1)]'" }
        session: { id: s1 }
  - name: python3_endless_loop_without_a_fork
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "tail -f log.jsonl | python3 -c 'import sys\nwhile True: print(sys.stdin.readline())'" }
        session: { id: s1 }
