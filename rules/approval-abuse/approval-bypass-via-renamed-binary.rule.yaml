id: approval-bypass-via-renamed-binary
version: 3
title: Denied dangerous command re-invoked via a renamed copy of the binary
description: >
  An approval for a destructive or high-impact shell command was explicitly denied
  (event.action approval.denied), and within the same session a command.executed event
  re-issues a dangerous action through a copy or shim staged in a temp location —
  a copy of rm run as /tmp/x, a copy of dd fed if=/of=/dev/sd, mkfs, a pipe to sh,
  `chmod -R 777`, or `sudo -s`. The deny+shim pair indicates the operator blocked
  the canonical path and the agent re-issued the action through a wrapper or copy
  to evade the gate. For the rm-shaped case the shim's name is not trusted (a copy
  can be called anything), so the rule instead requires that an executable under
  /tmp/, /var/tmp/, or $(mktemp ...) sits at command position (start of the command,
  after `;`, `&&`, `||`, `|`, `(`, a backtick, `$(`, or the opening quote of a
  `sh -c`/`bash -c`/`eval` script; optionally after VAR=value assignments and
  wrapper commands such as sudo, doas, env, nohup, exec, command, nice, time,
  timeout, xargs, stdbuf, setsid, with their options) and
  that a later argument of that same simple command is an rm-style short-option
  cluster made only of rm's flags (d, f, i, I, r, R, v) containing both a recursive
  and a force flag. Temp paths passed as arguments to other tools, quoted or not
  (`cp "/tmp/build" -rf`, `tar -C /tmp/stage -rf`, `find /tmp/build -printf`), and non-rm flag words
  therefore do not correlate. Negative fixtures cover denials with no follow-up,
  follow-ups in a different session, unrelated benign commands, and those
  argument-position and tar/find/ffmpeg shapes.
severity: critical
status: experimental
posture: detect
taxonomy:
  beacon_category: approval-abuse
  owasp_llm: LLM06
  mitre_atlas: AML.T0051

correlation:
  scope: session
  window: 300s
  steps:
    - id: denied
      match: >
        e.event.action == "approval.denied" &&
        e.command.command.matches("(?i)(\\brm\\s+-[a-z]*(r[a-z]*f|f[a-z]*r)[a-z]*\\b|\\bmkfs\\b|\\bdd\\s+if=|:\\(\\)\\s*\\{\\s*:\\|:|>\\s*/dev/sd|\\b(curl|wget)\\b.*\\|\\s*(ba)?sh\\b|\\bsudo\\s+-s\\b|\\bchmod\\s+-R\\s+777\\b)")
    - id: renamed_dangerous
      match: >
        e.event.action == "command.executed" &&
        e.command.command.matches("(?i)(/tmp/|/var/tmp/|\\$\\(mktemp\\b)") &&
        e.command.command.matches("(?i)(\\s+if\\s*=|\\s+of\\s*=/dev/sd|(?:^|[;&|(`]|(?:\\b(?:ba|z|da|k)?sh(?:\\s+-[a-z]+)*\\s+-c\\s+|\\beval\\s+)[\"'])\\s*(?:[a-z_][a-z0-9_]*=[^;&|\\s]*\\s+|(?:sudo|doas|env|nohup|exec|command|nice|time|xargs|timeout|stdbuf|setsid|eval)(?:\\s+(?:-[^;&|\\s]*(?:\\s+[a-z0-9_][^;&|\\s/]*)?|[0-9][^;&|\\s]*))*\\s+)*(?:/tmp/|/var/tmp/|\\$\\(mktemp[^)]*\\))[^;&|\\s\"'`]*(?:\\s+[^;&|\\s]+)*?\\s+-[dfirv]*(?:r[dfirv]*f|f[dfirv]*r)[dfirv]*(?:[\\s\"'`)]|$)|\\bmkfs\\b|\\|\\s*(ba)?sh\\b|\\bchmod\\s+-R\\s+777\\b|\\bsudo\\s+-s\\b)")

emit:
  reason: "Denied dangerous command re-invoked via a renamed or shimmed binary in the same session"

tests:
  - name: denied_rm_then_renamed_rm
    verdict: match
    events:
      - timestamp: "2026-06-23T10:00:00Z"
        event: { action: approval.denied }
        command: { command: "rm -rf /var/data" }
        approval: { decision: "denied", required: true }
        session: { id: s1 }
      - timestamp: "2026-06-23T10:00:45Z"
        event: { action: command.executed }
        command: { command: "cp /bin/rm /tmp/myrm && /tmp/myrm -rf /var/data" }
        session: { id: s1 }
  - name: denied_dd_then_renamed_dd
    verdict: match
    events:
      - timestamp: "2026-06-23T10:00:00Z"
        event: { action: approval.denied }
        command: { command: "dd if=/dev/zero of=/dev/sda" }
        approval: { decision: "denied", required: true }
        session: { id: s1 }
      - timestamp: "2026-06-23T10:00:45Z"
        event: { action: command.executed }
        command: { command: "cp /bin/dd /var/tmp/.x && /var/tmp/.x if=/dev/zero of=/dev/sda" }
        session: { id: s1 }
  - name: denied_then_benign_command
    verdict: no_match
    events:
      - timestamp: "2026-06-23T10:00:00Z"
        event: { action: approval.denied }
        command: { command: "rm -rf /var/data" }
        approval: { decision: "denied", required: true }
        session: { id: s1 }
      - timestamp: "2026-06-23T10:00:45Z"
        event: { action: command.executed }
        command: { command: "ls -la /var/data" }
        session: { id: s1 }
  - name: denied_but_followup_in_other_session
