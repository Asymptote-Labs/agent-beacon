id: high-risk-approval-allowed-without-reason
spec: threat-rules/v1.3  # needed for args and predicates
version: 6
title: High-risk action approved with an empty approval reason
description: >
  An approval was granted (event.action approval.allowed) for a high-risk operation —
  a destructive/privilege shell command or an edit to a credential, CI/CD, or
  security-control file — while approval.reason is empty. A required gate that is
  satisfied with no recorded justification is a rubber-stamp / auto-approve signal:
  the operator either blanket-allowed the runtime or the approval was auto-issued
  without a human-supplied rationale. The rule fires on a single approval.allowed event
  and intentionally requires approval.required == true so it ignores informational
  no-gate allows. It scopes the dangerous-target test tightly to avoid flagging routine
  approved edits. A credential file is any store of files in the pack's credential
  catalog (rules/concepts/credential-stores.catalog.yaml). The approved command is
  found by what its line runs (rm also under sudo, by absolute path or inside
  `bash -c`; sudo as the wrapper of a command), so the same words in a commit
  message or a here-document do not make an approval high-risk. The text pattern is
  asked of the text that reaches a command the parser cannot see into (unread_text).
  Anything under ~/.aws counts as well as the catalog's credential files, since the config
  there can name a command that hands over credentials (credential_process).
severity: high
status: stable
posture: detect
taxonomy:
  beacon_category: approval-abuse
  owasp_llm: LLM06

# A dangerous command is the approval rules' shared definition (dangerous_command,
# rules/concepts/dangerous-commands.predicates.yaml). Here any sudo counts as well, not only
# a root shell: sudo is a word of the command that is not one of its arguments, its first
# word or a wrapper behind env, nohup and the like. `which sudo` and `echo sudo` do not run
# it.
match: >
  e.event.action == "approval.allowed" &&
  e.approval.required &&
  e.approval.reason == "" &&
  (
    dangerous_command(e) ||
    e.command.parsed_commands.exists(c,
      c.argv.exists(a, a.matches("(^|/)sudo$")) && (c.argv[0].matches("(^|/)sudo$") || !c.args.matches("(?m)^(.*/)?sudo$"))) ||
    unread_text(e, t, t.matches("(?i)\\bsudo\\b")) ||
    credential_path(e.file.path) ||
    e.file.path.matches("(?i)(\\.github/workflows/|\\.gitlab-ci\\.yml$|/auth\\.|/security\\.|(^|[/\\\\])\\.aws[/\\\\])")
  )

emit:
  reason: "High-risk action approved with no recorded approval reason"

tests:
  - name: aws_config_edit_allowed_empty_reason
    verdict: match
    events:
      - event: { action: approval.allowed }
        file: { path: "/home/u/.aws/config" }
        approval: { decision: "allow", required: true, reason: "" }
        session: { id: s1 }
  - name: aws_sso_cache_edit_allowed_empty_reason
    verdict: match
    events:
      - event: { action: approval.allowed }
        file: { path: "C:\\Users\\u\\.aws\\sso\\cache\\0a1b2c.json" }
        approval: { decision: "allow", required: true, reason: "" }
        session: { id: s1 }
  - name: aws_named_project_dir_is_not_aws
    verdict: no_match
    events:
      - event: { action: approval.allowed }
        file: { path: "/repo/my.aws/notes.md" }
        approval: { decision: "allow", required: true, reason: "" }
        session: { id: s1 }
  - name: dangerous_command_allowed_empty_reason
    verdict: match
    events:
      - event: { action: approval.allowed }
        command: { command: "sudo rm -rf /etc" }
        approval: { decision: "allow", required: true, reason: "" }
        session: { id: s1 }
  - name: rm_fr_flag_order_allowed_empty_reason
    verdict: match
    events:
      - event: { action: approval.allowed }
        command: { command: "rm -fr /var/lib/app" }
        approval: { decision: "allow", required: true, reason: "" }
        session: { id: s1 }
  - name: rm_rfv_verbose_cluster_allowed_empty_reason
    verdict: match
    events:
      - event: { action: approval.allowed }
        command: { command: "rm -rfv build/" }
        approval: { decision: "allow", required: true, reason: "" }
        session: { id: s1 }
  - name: workflow_edit_allowed_empty_reason
    verdict: match
    events:
      - event: { action: approval.allowed }
        file: { path: ".github/workflows/release.yml" }
        approval: { decision: "approve", required: true, reason: "" }
        session: { id: s1 }
  - name: dangerous_command_allowed_with_reason
    verdict: no_match
    events:
      - event: { action: approval.allowed }
        command: { command: "sudo rm -rf /etc" }
        approval: { decision: "allow", required: true, reason: "operator confirmed cleanup of stale config" }
        session: { id: s1 }
  - name: benign_command_allowed_empty_reason
    verdict: no_match
    events:
      - event: { action: approval.allowed }
        command: { command: "go test ./..." }
        approval: { decision: "allow", required: true, reason: "" }
        session: { id: s1 }
  - name: not_a_required_gate
    verdict: no_match
    events:
      - event: { action: approval.allowed }
        command: { command: "sudo rm -rf /etc" }
        approval: { decision: "allow", required: false, reason: "" }
        session: { id: s1 }
  - name: any_command_under_sudo_allowed_empty_reason
    verdict: match
    events:
      - event: { action: approval.allowed }
        command: { command: "env LANG=C sudo -n systemctl restart nginx" }
        approval: { decision: "allow", required: true, reason: "" }
        session: { id: s1 }
  - name: rm_inside_a_shell_script_allowed_empty_reason
    verdict: match
    events:
      - event: { action: approval.allowed }
        command: { command: "bash -c 'cd /srv && rm -rf releases'" }
        approval: { decision: "allow", required: true, reason: "" }
        session: { id: s1 }
  - name: rm_by_absolute_path_with_separate_flags_allowed_empty_reason
    verdict: match
    events:
      - event: { action: approval.allowed }
        command: { command: "/bin/rm -r -f /srv/releases" }
        approval: { decision: "allow", required: true, reason: "" }
        session: { id: s1 }
  - name: rm_through_a_wrapper_the_parser_does_not_look_through
    verdict: match
    events:
      - event: { action: approval.allowed }
        command: { command: "ssh ops@host.example 'rm -rf /srv/releases'" }
        approval: { decision: "allow", required: true, reason: "" }
        session: { id: s1 }
  - name: rm_named_in_a_commit_message_allowed_empty_reason
    verdict: no_match
    events:
      - event: { action: approval.allowed }
        command: { command: "git commit -m 'docs: sudo is not needed to rm -rf build'" }
        approval: { decision: "allow", required: true, reason: "" }
        session: { id: s1 }
  - name: rm_named_in_a_here_document_allowed_empty_reason
    verdict: no_match
    events:
      - event: { action: approval.allowed }
        command: { command: "cat > NOTES.md <<'EOF'\nCleanup is sudo rm -rf /srv/releases; ask first.\nEOF" }
        approval: { decision: "allow", required: true, reason: "" }
        session: { id: s1 }
  - name: sudo_looked_up_but_not_run
    verdict: no_match
    events:
      - event: { action: approval.allowed }
        command: { command: "which sudo && rm -r build/cache" }
        approval: { decision: "allow", required: true, reason: "" }
        session: { id: s1 }
  - name: sudo_given_to_a_script_the_parser_cannot_see_into
    verdict: match
    events:
      - event: { action: approval.allowed }
        command: { command: "./deploy.sh 'sudo systemctl restart app'" }
        approval: { decision: "allow", required: true, reason: "" }
        session: { id: s1 }
  - name: sudo_named_in_a_commit_message_beside_a_script
    verdict: no_match
    events:
      - event: { action: approval.allowed }
        command: { command: "git commit -m 'docs: the installer no longer needs sudo' && ./run-tests.sh" }
        approval: { decision: "allow", required: true, reason: "" }
        session: { id: s1 }

