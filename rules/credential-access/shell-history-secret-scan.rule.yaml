id: shell-history-secret-scan
spec: threat-rules/v1.3  # needed for file_reads and predicates
version: 4
title: Shell history read or scanned for credentials
description: >
  A command reads a shell history file (.bash_history, .zsh_history, .history,
  fish_history) — either dumping it whole (cat/less/tail) or grepping it for
  credential-shaped names. Shell history persists secrets passed as inline command
  arguments; an agent scraping it can recover tokens, passwords, and credential
  URLs. The read is found by what the line runs: a command that takes in a history
  file, as an operand, on its standard input or through a pipe. So a history file
  named in a commit message, a here-document or a search pattern does not fire, and
  `sudo cat` or the read inside `bash -c` does; the text pattern is asked only of the
  text that reaches a command the parser cannot see into (unread_text).
severity: high
status: stable
posture: detect
taxonomy:
  beacon_category: credential-access
  owasp_llm: LLM06
  mitre_atlas: AML.T0024

# file_reads lists what a command takes in, and follows it down a pipeline, for the commands
# the parser knows to read their operands. sort, uniq, cut and the like are not among them,
# so the second alternative keeps `sort ~/.bash_history | uniq -c | head`: a history file as
# a whole word of a command, and one of the readers the text named later in its pipeline.
match: >
  e.event.action == "command.executed" && (
    e.command.parsed_commands.exists(c,
      c.file_reads.exists(f, f.path.matches("(?i)(\\.bash_history|\\.zsh_history|fish_history|(^|/|\\s)\\.history\\b)")) ||
      c.argv_raw.exists(a, a.matches("(?i)(^|/)(\\.bash_history|\\.zsh_history|fish_history|\\.history)[\"']?$")) &&
        c.later_stages.exists(i,
          e.command.parsed_commands[i].name.matches("^(cat|less|more|tail|head|grep|egrep|rg|strings|cp|xxd|od)$"))) ||
    unread_text(e, t, t.matches("(?i)(\\.bash_history|\\.zsh_history|fish_history|(^|/|\\s)\\.history\\b)") &&
      t.matches("(?i)\\b(cat|less|more|tail|head|grep|egrep|rg|strings|cp|xxd|od)\\b"))
  )

emit:
  reason: "Shell history file read or scanned (inline secrets persist in history)"

tests:
  - name: cat_bash_history
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "cat ~/.bash_history" }
        session: { id: s1 }
  - name: grep_zsh_history_for_token
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "grep -i token ~/.zsh_history" }
        session: { id: s1 }
  - name: tail_fish_history
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "tail -n 500 ~/.local/share/fish/fish_history" }
        session: { id: s1 }
  - name: list_directory_only
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "ls -la ~" }
        session: { id: s1 }
  - name: history_builtin_no_read_tool
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "history 20" }
        session: { id: s1 }
  - name: unrelated_cat
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "cat README.md" }
        session: { id: s1 }
  - name: history_read_under_sudo
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "sudo cat /root/.bash_history" }
        session: { id: s1 }
  - name: history_read_inside_a_shell_script
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "bash -c 'grep -i passw ~/.zsh_history'" }
        session: { id: s1 }
  - name: reader_by_absolute_path
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "/usr/bin/tail -n 50 /home/dev/.bash_history" }
        session: { id: s1 }
  - name: history_on_standard_input
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "strings < \"$HOME/.zsh_history\"" }
        session: { id: s1 }
  - name: history_sorted_then_read_from_the_pipe
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "sort ~/.bash_history | uniq -c | sort -rn | head -20" }
        session: { id: s1 }
  - name: history_read_through_a_wrapper_the_parser_does_not_look_through
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "ssh build@host.example 'cat ~/.bash_history'" }
        session: { id: s1 }
  - name: history_read_through_xargs
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "find /home -name .zsh_history | xargs cat" }
        session: { id: s1 }
  - name: history_read_named_in_a_commit_message
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "git commit -m 'docs: never cat ~/.bash_history in a shared session'" }
        session: { id: s1 }
  - name: history_read_named_in_a_here_document
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "cat > NOTES.md <<'EOF'\nInline flags persist: grep -i token ~/.zsh_history finds them\nEOF" }
        session: { id: s1 }
  - name: history_file_name_as_a_search_pattern
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "grep -rn '\\.bash_history' rules/ | head -5" }
        session: { id: s1 }
  - name: history_file_listed_and_another_file_read
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "ls -la ~/.zsh_history && cat README.md" }
        session: { id: s1 }
  - name: history_read_handed_to_a_project_script
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "./deploy.sh 'cat ~/.bash_history'" }
        session: { id: s1 }
  - name: history_read_named_in_a_commit_message_beside_a_project_script
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "git commit -m 'docs: never cat ~/.bash_history in a shared session' && ./run-tests.sh" }
        session: { id: s1 }

