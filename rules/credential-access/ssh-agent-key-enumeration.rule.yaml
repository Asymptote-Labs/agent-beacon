id: ssh-agent-key-enumeration
spec: threat-rules/v1.3  # needed for predicates and args
version: 3
title: SSH agent key enumeration
description: >
  A command lists the private keys loaded in the running ssh-agent (`ssh-add -l`
  / `ssh-add -L`) or sets SSH_AUTH_SOCK to probe an agent socket. The agent holds
  decrypted private keys in memory; enumerating them is a reconnaissance step
  toward using them for lateral movement. Listing is the SSH agent store of the
  pack's credential catalog (rules/concepts/credential-stores.catalog.yaml),
  matched on the command line read as bash.
severity: medium
status: stable
posture: detect
taxonomy:
  beacon_category: credential-access
  owasp_llm: LLM06
  mitre_atlas: AML.T0024

match: >
  e.event.action == "command.executed" && e.command.parsed_commands.exists(c,
    credential_command(c, "likely", "ssh") ||
    c.name == "ssh-add" && "SSH_AUTH_SOCK" in c.env)

emit:
  reason: "SSH agent private-key list enumerated (ssh-add -l/-L)"

tests:
  - name: windows_ssh_add_exe_list
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "ssh-add.exe -l" }
        session: { id: s1 }
  - name: ssh_add_list
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "ssh-add -l" }
        session: { id: s1 }
  - name: ssh_add_list_pubkeys
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "ssh-add -L" }
        session: { id: s1 }
  - name: ssh_auth_sock_probe
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "SSH_AUTH_SOCK=/tmp/agent.sock ssh-add -l" }
        session: { id: s1 }
  - name: ssh_add_list_with_hash_option
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "ssh-add -E md5 -l" }
        session: { id: s1 }
  - name: ssh_add_add_key_with_hyphen_not_list
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "ssh-add ~/.ssh/deploy-lab" }
        session: { id: s1 }
  - name: ssh_add_key_then_ls_on_next_line
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "ssh-add ~/.ssh/id_ed25519\nls -la ~/.ssh" }
        session: { id: s1 }
  - name: ssh_add_add_key_not_list
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "ssh-add ~/.ssh/id_ed25519" }
        session: { id: s1 }
  - name: ssh_connect_not_agent
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "ssh user@host" }
        session: { id: s1 }

