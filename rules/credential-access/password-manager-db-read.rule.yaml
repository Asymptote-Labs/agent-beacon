id: password-manager-db-read
spec: threat-rules/v2.0  # needed for predicates and file_reads
version: 3
title: Agent read a password-manager vault or DB
description: >
  The agent read a password-manager vault: a KeePass .kdbx file, the GNU pass
  ~/.password-store/ tree, a 1Password database directory, a LastPass vault
  file, or a Bitwarden vault directory. These files contain the user's full
  set of credentials and an agent reading one is a near-certain
  credential-exfiltration signal. The files are the password manager stores
  of the pack's credential catalog
  (rules/concepts/credential-stores.catalog.yaml), each anchored on a path
  component specific to its manager (not on the .db extension generally) so
  unrelated application databases (sqlite, leveldb) do not fire. Reads to a
  key file for a vault are also covered. The read is a file read or a shell
  command that takes the file in (cat, cp, base64, an upload); where the parser
  cannot see into a command, the text that reaches it counts when it names such
  a file and runs a program that reads files (credential_store_read).
severity: high
status: experimental
posture: detect
taxonomy:
  beacon_category: credential-access
  owasp_llm: LLM02
  mitre_atlas: AML.T0024

match: >
  credential_store_read(e, p, credential_path(p, "likely", "password-manager"), t,
    credential_mention(t, "likely", "password-manager"))

emit:
  reason: "Agent read a password-manager vault or DB (KeePass / pass / 1Password / LastPass / Bitwarden)"

tests:
  - name: read_kdbx
    verdict: match
    events:
      - event: { action: file.read }
        file: { path: "/home/u/Documents/vault.kdbx" }
        session: { id: s1 }
  - name: read_pass_store
    verdict: match
    events:
      - event: { action: file.read }
        file: { path: "/home/u/.password-store/work/github.gpg" }
        session: { id: s1 }
  - name: read_1password_dir
    verdict: match
    events:
      - event: { action: file.read }
        file: { path: "/home/u/.1password/agent.sock" }
        session: { id: s1 }
  - name: read_bitwarden_config_sqlite
    verdict: match
    events:
      - event: { action: file.read }
        file: { path: "/home/u/.config/Bitwarden/data.json" }
        session: { id: s1 }
  - name: read_lastpass_dir
    verdict: match
    events:
      - event: { action: file.read }
        file: { path: "/home/u/.lastpass/vault.pswd" }
        session: { id: s1 }
  - name: read_unrelated_sqlite
    verdict: no_match
    events:
      - event: { action: file.read }
        file: { path: "/repo/app/data/cache.sqlite" }
        session: { id: s1 }
  - name: read_unrelated_db
    verdict: no_match
    events:
      - event: { action: file.read }
        file: { path: "/opt/app/users.db" }
        session: { id: s1 }
  - name: read_password_file_mention
    verdict: no_match
    events:
      - event: { action: file.read }
        file: { path: "/repo/docs/passwords.md" }
        session: { id: s1 }
  - name: kdbx_copied_by_a_command
    verdict: match
    events:
      - timestamp: "2026-06-23T10:20:00Z"
        event: { action: command.executed }
        command: { command: "cp ~/Documents/Passwords.kdbx /tmp/p.kdbx" }
        session: { id: s1 }
  - name: kdbx_named_by_a_command_that_does_not_read_it
    verdict: no_match
    events:
      - timestamp: "2026-06-23T10:21:00Z"
        event: { action: command.executed }
        command: { command: "ls -la ~/Documents/Passwords.kdbx" }
        session: { id: s1 }
  - name: a_read_handed_to_a_script
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "./run.sh 'cp ~/Documents/vault.kdbx /tmp/v'" }
        session: { id: s1 }
  - name: a_read_named_in_a_commit_message_beside_a_script
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "git commit -m 'never cp ~/Documents/vault.kdbx /tmp/v' && ./run-tests.sh" }
        session: { id: s1 }
