id: gpg-keyring-access
spec: threat-rules/v1.3  # needed for predicates, file_reads and args
version: 3
title: Agent read a GPG private key or exported a secret key
description: >
  The agent either read GnuPG private key material (a file under
  private-keys-v1.d/, secring.gpg, a revocation certificate under
  .gnupg/openpgp-revocs.d/, a .key file in .gnupg/), with a file tool or a
  shell command that takes the file in, OR invoked gpg or gpg2 with
  --export-secret-key(s), --export-secret-subkey(s), --gen-key, or
  --card-status --with-keygrip. Private GPG keys sign commits and decrypt
  sensitive mail; an agent touching a private keyring is a high-value exfil
  signal. The files and the export are the GnuPG stores of the pack's
  credential catalog (rules/concepts/credential-stores.catalog.yaml). The
  public keyring (pubring.gpg, *.asc public keys) and the trust database
  (trustdb.gpg) hold no secret and do not match: reading public keys is a
  routine signature-verification operation. The command is read as bash, so
  the words in a quoted string or after echo are not an invocation.
severity: high
status: experimental
posture: detect
taxonomy:
  beacon_category: credential-access
  owasp_llm: LLM02
  mitre_atlas: AML.T0024

match: >
  (e.event.action == "file.read" && credential_path(e.file.path, "likely", "gpg")) ||
  (e.event.action == "command.executed" && (
    e.command.parsed_commands.exists(c,
      c.file_reads.exists(f, credential_path(f.path, "likely", "gpg")) ||
      credential_command(c, "likely", "gpg") ||
      c.name.matches("(?i)^gpg2?$") && (
        c.args.matches("(?im)^--gen-key$") ||
        c.args.matches("(?im)^--card-status$") && c.args.matches("(?im)^--with-keygrip$"))) ||
    credential_command_redacted(e.command.command, "likely", "gpg")))

emit:
  reason: "Agent accessed a GPG private key (file read or secret-export invocation)"

tests:
  - name: windows_gpg_exe_export_secret_keys
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "gpg.exe --export-secret-keys ABC" }
        session: { id: s1 }
  - name: read_private_keys_dir
    verdict: match
    events:
      - event: { action: file.read }
        file: { path: "/home/u/.gnupg/private-keys-v1.d/ABC123.key" }
        session: { id: s1 }
  - name: read_secring_gpg
    verdict: match
    events:
      - event: { action: file.read }
        file: { path: "/home/u/.gnupg/secring.gpg" }
        session: { id: s1 }
  - name: read_trustdb_holds_no_secret
    verdict: no_match
    events:
      - event: { action: file.read }
        file: { path: "/home/u/.gnupg/trustdb.gpg" }
        session: { id: s1 }
  - name: gpg_export_secret_keys
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "gpg --export-secret-keys --armor 0xDEADBEEF" }
        session: { id: s1 }
  - name: gpg_export_secret_subkeys
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "gpg --export-secret-subkeys 0xCAFEBABE > /tmp/keys.asc" }
        session: { id: s1 }
  - name: gpg_export_secret_key_singular
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "gpg --armor --export-secret-key ABCDEF12 > key.asc" }
        session: { id: s1 }
  - name: gpg2_export_secret_keys
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "gpg2 --export-secret-keys --armor > all.asc" }
        session: { id: s1 }
  - name: gpg_export_secret_abbreviated
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "gpg --armor --export-secret-k ABCDEF12" }
        session: { id: s1 }
  - name: gpg_export_secret_sub_abbreviated
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "gpg --export-secret-sub ABCDEF12! > sub.asc" }
        session: { id: s1 }
  - name: gpg_export_public_key
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "gpg --armor --export ABCDEF12 > pub.asc" }
        session: { id: s1 }
  - name: read_public_keyring
    verdict: no_match
    events:
      - event: { action: file.read }
        file: { path: "/home/u/.gnupg/pubring.kbx" }
        session: { id: s1 }
  - name: gpg_list_keys
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "gpg --list-keys" }
        session: { id: s1 }
  - name: gpg_verify_signature
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "gpg --verify release.tar.gz.asc" }
        session: { id: s1 }
  - name: private_key_file_read_by_a_command
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "tar czf /tmp/k.tgz ~/.gnupg/private-keys-v1.d/" }
        session: { id: s1 }
  - name: export_secret_keys_named_in_a_string
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "echo 'run gpg --export-secret-keys to back up'" }
        session: { id: s1 }
  - name: export_whose_name_redaction_took
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "SIGNING_KEY=$(gpg --armor --export-secret-keys 0xDEADBEEF) ./release.sh" }
        session: { id: s1 }
