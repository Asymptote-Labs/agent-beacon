id: env-secret-enumeration
spec: threat-rules/v1.3  # needed for predicates
version: 3
title: Environment dumped and grepped for secrets
description: >
  A command lists the process environment (env / printenv / `set`) and pipes it
  into a grep/filter for credential-shaped names (TOKEN, SECRET, KEY, PASSWORD,
  API_KEY, ACCESS_KEY). This is the classic agent secret-enumeration shape:
  harvesting live credential env vars rather than reading a file. The pipeline is
  found by what the line runs: a command that lists the environment, and a filter
  later in the same pipeline that has the credential name among its words. So env,
  grep and TOKEN in a commit message, a here-document or three unrelated commands do
  not fire, and `sudo env | grep` or the pipeline inside `bash -c` does; the text pattern
  is asked of the text that reaches a command the parser cannot see into (unread_text).
severity: high
status: stable
posture: detect
taxonomy:
  beacon_category: credential-access
  owasp_llm: LLM06
  mitre_atlas: AML.T0024

# The lister is the same three commands env-dump-piped-to-network names: bare `env` is a
# wrapper with nothing to run, so it has no name and is its first or last word (`env`,
# `sudo env`); `set` lists variables only when it has no words (`set -e` lists nothing). The
# filter's words are read as written (argv_raw), so a pattern with a glob character or a
# variable still counts. The filter is the outer loop and its two questions stand side by
# side, so the engine's cost bound counts commands times words, not commands squared times
# words.
match: >
  e.event.action == "command.executed" && (
    e.command.parsed_commands.exists(f,
      f.stage > 0 && f.name in ["grep", "egrep", "fgrep", "rg", "ag", "awk", "sed"] &&
      f.argv_raw.exists(a, a.matches("(?i)(TOKEN|SECRET|PASSWORD|API[_-]?KEY|ACCESS[_-]?KEY)")) &&
      e.command.parsed_commands.exists(d, d.pipeline == f.pipeline && d.stage < f.stage && (
        d.name == "printenv" ||
        d.name == "" && size(d.argv) > 0 &&
          (d.argv[0].matches("(?i)(^|/)env$") || d.argv[size(d.argv) - 1].matches("(?i)(^|/)env$")) ||
        d.name == "set" && size(d.argv) == 1))) ||
    unread_text(e, t, t.matches("(?i)\\b(env|printenv|set)\\b") &&
      t.matches("\\|") &&
      t.matches("(?i)\\b(grep|egrep|fgrep|rg|ag|awk|sed)\\b") &&
      t.matches("(?i)(TOKEN|SECRET|PASSWORD|API[_-]?KEY|ACCESS[_-]?KEY)"))
  )

emit:
  reason: "Process environment enumerated and filtered for credential-named variables"

tests:
  - name: env_grep_secret
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "env | grep -i secret" }
        session: { id: s1 }
  - name: printenv_grep_token
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "printenv | grep TOKEN" }
        session: { id: s1 }
  - name: env_egrep_key_password
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "env | egrep 'API_KEY|PASSWORD'" }
        session: { id: s1 }
  - name: plain_env_no_filter
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "env" }
        session: { id: s1 }
  - name: env_grep_non_secret
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "env | grep PATH" }
        session: { id: s1 }
  - name: unrelated_grep
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "grep -r TODO src/" }
        session: { id: s1 }
  - name: env_under_sudo
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "sudo -E env | grep -i secret" }
        session: { id: s1 }
  - name: env_inside_a_shell_script
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "bash -c 'env | grep -i token'" }
        session: { id: s1 }
  - name: env_by_absolute_path
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "/usr/bin/env | /usr/bin/grep API_KEY" }
        session: { id: s1 }
  - name: set_listing_piped_into_sed
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "(set -o posix; set) | sed -n '/PASSWORD/p'" }
        session: { id: s1 }
  - name: env_filtered_two_stages_later
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "env | sort | grep -E 'SECRET|TOKEN' | cut -d= -f1" }
        session: { id: s1 }
  - name: env_through_a_wrapper_the_parser_does_not_look_through
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "ssh build@host.example 'env | grep -i token'" }
        session: { id: s1 }
  - name: env_grep_named_in_a_commit_message
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "git commit -m 'docs: do not run env | grep TOKEN on the build host'" }
        session: { id: s1 }
  - name: env_grep_named_in_a_here_document
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "cat > NOTES.md <<'EOF'\nTo see which keys are set: env | grep -i secret\nEOF" }
        session: { id: s1 }
  - name: set_option_then_an_unrelated_grep
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "set -e; git log --oneline | grep -i token" }
        session: { id: s1 }
  - name: env_file_is_not_the_environment
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "cat .env.example | grep API_KEY" }
        session: { id: s1 }
  - name: secret_word_outside_the_filter
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "printenv | grep PATH; echo 'TOKEN check done'" }
        session: { id: s1 }
  - name: bare_env_with_the_secret_word_outside_the_filter
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "env | grep PATH; echo 'TOKEN check done'" }
        session: { id: s1 }
  - name: bare_env_filtered_for_other_names
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "env | awk -F= '/DATABASE|PG/{print $1}'; git log --oneline | grep -i secret" }
        session: { id: s1 }
  - name: pipeline_given_to_an_interpreter
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "python3 -c \"import os; os.system('printenv | grep TOKEN')\"" }
        session: { id: s1 }
  - name: pipeline_named_in_a_commit_message_beside_a_script
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "git commit -m 'docs: env | grep TOKEN shows what leaks' && ./run-tests.sh" }
        session: { id: s1 }

