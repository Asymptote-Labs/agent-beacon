id: browser-session-store-read
spec: threat-rules/v2.0  # needed for predicates and file_reads
version: 5
title: Agent read a browser session/cookie store
description: >
  The agent read a browser cookie jar or saved-login store (cookies.sqlite /
  logins.json by name, or the ambiguous basenames Cookies / "Login Data" only inside a
  known browser profile directory — Chrome/Chromium/Brave/Edge/Firefox/Safari, including
  Beta, Dev and Canary channels). These
  carry live session material that can hijack a SaaS session past password + MFA. The
  browser-dir requirement keeps a non-browser file named "cookies" from firing. The files
  are the browser stores of the pack's credential catalog
  (rules/concepts/credential-stores.catalog.yaml), which the read step of the
  browser-session-read-then-egress correlation also uses (browser_store_read). The read is
  a file read or a shell command that takes the file in (cp, cat, base64, an upload);
  where the parser cannot see into a command, the text that reaches it counts when it
  names a browser store and runs a program that reads files.
severity: high
status: stable
posture: detect
taxonomy:
  beacon_category: credential-access
  owasp_llm: LLM02
  mitre_atlas: AML.T0024

match: browser_store_read(e)

emit:
  reason: "Agent read a browser session/cookie store (session-hijack material)"

tests:
  - name: read_firefox_cookies
    verdict: match
    events:
      - event: { action: file.read }
        file: { path: "/home/u/.mozilla/firefox/abc.default/cookies.sqlite" }
        session: { id: s1 }
  - name: read_chrome_login_data
    verdict: match
    events:
      - event: { action: file.read }
        file: { path: "/home/u/.config/google-chrome/Default/Login Data" }
        session: { id: s1 }
  - name: read_chrome_bare_cookies
    verdict: match
    events:
      - event: { action: file.read }
        file: { path: "/home/u/.config/google-chrome/Default/Cookies" }
        session: { id: s1 }
  - name: read_brave_cookies
    verdict: match
    events:
      - event: { action: file.read }
        file: { path: "/home/u/.config/BraveSoftware/Brave-Browser/Default/Cookies" }
        session: { id: s1 }
  - name: read_edge_macos_cookies
    verdict: match
    events:
      - event: { action: file.read }
        file: { path: "/Users/u/Library/Application Support/Microsoft Edge/Default/Cookies" }
        session: { id: s1 }
  - name: read_edge_canary_macos_cookies
    verdict: match
    events:
      - event: { action: file.read }
        file: { path: "/Users/u/Library/Application Support/Microsoft Edge Canary/Default/Cookies" }
        session: { id: s1 }
  - name: read_edge_beta_linux_login_data
    verdict: match
    events:
      - event: { action: file.read }
        file: { path: "/home/u/.config/microsoft-edge-beta/Default/Login Data" }
        session: { id: s1 }
  - name: read_chrome_dev_linux_cookies
    verdict: match
    events:
      - event: { action: file.read }
        file: { path: "/home/u/.config/google-chrome-unstable/Default/Cookies" }
        session: { id: s1 }
  - name: read_chrome_canary_windows_cookies
    verdict: match
    events:
      - event: { action: file.read }
        file: { path: "C:/Users/u/AppData/Local/Google/Chrome SxS/User Data/Default/Network/Cookies" }
        session: { id: s1 }
  - name: chrome_dev_extension_source_not_a_store
    verdict: no_match
    events:
      - event: { action: file.read }
        file: { path: "extensions/chrome-devtools/fixtures/cookies" }
        session: { id: s1 }
  - name: source_file_named_cookies
    verdict: no_match
    events:
      - event: { action: file.read }
        file: { path: "src/cookies.test.ts" }
        session: { id: s1 }
  - name: non_browser_cookies_file
    verdict: no_match
    events:
      - event: { action: file.read }
        file: { path: "recipes/cookies" }
        session: { id: s1 }
  - name: cookies_copied_by_a_command
    verdict: match
    events:
      - timestamp: "2026-06-23T10:20:00Z"
        event: { action: command.executed }
        command: { command: "cp \"$HOME/Library/Application Support/Google/Chrome/Default/Cookies\" /tmp/c.db" }
        session: { id: s1 }
  - name: cookies_named_by_a_command_that_does_not_read_it
    verdict: no_match
    events:
      - timestamp: "2026-06-23T10:21:00Z"
        event: { action: command.executed }
        command: { command: "ls -la ~/.mozilla/firefox/abc123.default-release/cookies.sqlite" }
        session: { id: s1 }
  - name: cookies_copied_by_a_script_handed_the_command
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "./run.sh 'cp ~/.mozilla/firefox/abc.default/cookies.sqlite /tmp/c.db'" }
        session: { id: s1 }
  - name: cookies_named_in_a_commit_message_beside_a_script
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "git commit -m 'never cp ~/.mozilla/firefox/abc.default/cookies.sqlite' && ./run-tests.sh" }
        session: { id: s1 }
