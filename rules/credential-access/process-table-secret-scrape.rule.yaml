id: process-table-secret-scrape
spec: threat-rules/v1.3  # needed for args, file_reads and predicates
version: 4
title: Process table scraped for command-line secrets
description: >
  A command enumerates the full process table (ps aux / ps -ef, including wide or
  custom-format variants such as ps auxww and ps -eo args) or reads
  /proc/*/cmdline and filters it for credential-shaped flags or names (--password,
  --token, --api-key, SECRET, PASSWORD). Secrets passed as CLI args are visible to
  every same-uid process; scraping the process table harvests them without touching
  disk. The scrape is found by what the line runs: a command whose words hold the
  credential name and that either comes after such a ps in the same pipeline or
  takes in a /proc/*/cmdline file, directly or through the pipe. So ps, a pipe and
  a credential name in a commit message, a here-document or unrelated commands do
  not fire, and `sudo ps` or the pipeline inside `bash -c` does; the text pattern is
  asked of the text that reaches a command the parser cannot see into (unread_text). A
  ps that a carrier runs elsewhere (`ssh host ps aux | grep -i password`, `kubectl exec
  pod -- ps aux | grep token`) counts when the carrier's command was read and the carrier
  feeds the filter: the carried command is numbered in a pipeline of its own.
severity: high
status: stable
posture: detect
taxonomy:
  beacon_category: credential-access
  owasp_llm: LLM06
  mitre_atlas: AML.T0024

# The filter's words are read as written (argv_raw): `grep -- --passwor[d]` and
# `grep '[p]assword'`, the usual way to keep grep's own line out of a ps listing, have a
# glob character, and the first is a word whose value the parse leaves unknown. A name with
# its first or last letter in brackets is therefore a credential name too.
match: >
  e.event.action == "command.executed" && (
    e.command.parsed_commands.exists(f,
      f.argv_raw.exists(a, a.matches("(?i)(--?(password|token|secret|api[_-]?key)|PASSWORD|SECRET|TOKEN|API[_-]?KEY|\\[p\\]assword|passwor\\[d\\]|\\[s\\]ecret|secre\\[t\\]|\\[t\\]oken|toke\\[n\\]|\\[a\\]pi[_-]?key|api[_-]?ke\\[y\\])")) && (
        f.file_reads.exists(r, r.path.matches("(?i)/proc/[^/]+/cmdline")) ||
        e.command.parsed_commands.exists(p, p.pipeline == f.pipeline && p.stage < f.stage &&
          p.name == "ps" && p.args.matches("(?mi)^(-?aux|-ef|-e|ax)[a-z]*\\b")) ||
        e.command.parsed_commands.exists(k, k.pipeline == f.pipeline && k.stage < f.stage && k.runs_read &&
          k.name in ["ssh", "kubectl", "docker", "podman"]) &&
        e.command.parsed_commands.exists(p, p.nested &&
          p.name == "ps" && p.args.matches("(?mi)^(-?aux|-ef|-e|ax)[a-z]*\\b")))) ||
    unread_text(e, t, t.matches("\\|") &&
      (
        t.matches("(?i)\\bps\\s+(-?aux|-ef|-e|ax)[a-z]*\\b") ||
        t.matches("(?i)/proc/[^/]+/cmdline")
      ) &&
      t.matches("(?i)(--?(password|token|secret|api[_-]?key)|PASSWORD|SECRET|TOKEN|API[_-]?KEY)"))
  )

emit:
  reason: "Process table or /proc cmdline scraped for command-line secrets"

tests:
  - name: ps_auxww_wide_output
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "ps auxww | grep -i token" }
        session: { id: s1 }
  - name: ps_run_over_ssh_and_filtered_here
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "ssh host ps aux | grep -i password" }
        session: { id: s1 }
  - name: ps_run_in_a_pod_and_filtered_here
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "kubectl exec web-0 -- ps aux | grep -i token" }
        session: { id: s1 }
  - name: ps_eo_args
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "ps -eo pid,args | grep -i -- --password" }
        session: { id: s1 }
  - name: ps_single_pid_lookup
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "ps -p 4242 -o etime | grep TOKEN_REFRESH" }
        session: { id: s1 }
  - name: ps_aux_grep_password
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "ps aux | grep -i password" }
        session: { id: s1 }
  - name: ps_ef_grep_token
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "ps -ef | grep -- --token" }
        session: { id: s1 }
  - name: proc_cmdline_scrape
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "cat /proc/1234/cmdline | tr '\\0' ' ' | grep -i secret" }
        session: { id: s1 }
  - name: ps_aux_normal
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "ps aux | grep nginx" }
        session: { id: s1 }
  - name: ps_no_pipe
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "ps aux" }
        session: { id: s1 }
  - name: ps_under_sudo
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "sudo ps aux | grep -i password" }
        session: { id: s1 }
  - name: ps_inside_a_shell_script
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "bash -c 'ps -ef | grep -- --token'" }
        session: { id: s1 }
  - name: ps_by_absolute_path
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "/bin/ps auxww | /usr/bin/grep -i secret" }
        session: { id: s1 }
  - name: ps_filtered_two_stages_later
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "ps -eo pid,args | grep -v grep | awk '/--api-key/ {print $1}'" }
        session: { id: s1 }
  - name: ps_grep_with_a_bracketed_letter
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "ps aux | grep -- --passwor[d]" }
        session: { id: s1 }
  - name: proc_cmdline_given_to_the_filter_itself
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "grep -a -i secret /proc/*/cmdline | tr '\\0' ' '" }
        session: { id: s1 }
  - name: ps_through_a_wrapper_the_parser_does_not_look_through
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "ssh build@host.example 'ps aux | grep -i token'" }
        session: { id: s1 }
  - name: ps_grep_named_in_a_commit_message
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "git commit -m 'docs: ps aux | grep -i password shows the flags of other processes'" }
        session: { id: s1 }
  - name: ps_grep_named_in_a_here_document
    # The flag is not the last word before the delimiter: redaction takes the word after a
    # secret-named flag for its value, and a replaced delimiter leaves a line that does not
    # parse, which is then matched on its text.
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "cat > NOTES.md <<'EOF'\nFlags are visible to every process: ps -ef | grep -- --token lists them\nEOF" }
        session: { id: s1 }
  - name: secret_word_in_another_pipeline
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "ps aux | grep nginx | head -5; git log --oneline | grep -i token" }
        session: { id: s1 }
  - name: ps_grep_given_to_an_interpreter
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "python3 -c \"import os; os.system('ps aux | grep -i password')\"" }
        session: { id: s1 }
  - name: ps_grep_named_in_a_commit_message_beside_a_script
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "git commit -m 'docs: ps aux | grep -i password shows the flags of other processes' && ./run-tests.sh" }
        session: { id: s1 }

