# Which commands are a coding agent, said once for the rules about one agent starting,
# configuring or handing work to another.
#
# Four rules ask it: agent-permission-bypass-spawn, permission-scope-expansion-via-env,
# handoff-to-second-agent-with-credentials and agent-extension-installed-by-command. Three of
# them listed seven agents and the fourth nine, with five names on one side only; a new agent
# CLI is added here, to agent_cli and to its text twin agent_cli_mention alike.
library: agents
version: 2
spec: threat-rules/v1.3
description: A command that runs a coding agent's CLI.

definitions:
  - name: agent_cli
    params: [c]
    description: >
      A parsed command runs a coding agent's command-line program: claude, codex,
      cursor-agent, aider, goose, opencode, gemini, qwen, kiro-cli, amp or copilot, by its
      name or its package name (claude-code, gemini-cli, qwen-code, opencode-ai), directly or
      through npx, bunx or pnpm dlx with an optional -y and an optional package scope. The
      name is the command after sudo, env, timeout and the like, by any path. An agent's name
      as a word of another command (a commit message, a path) is not one.
    body: >
      c.name.matches("(?i)^(claude(-code)?|codex|cursor-agent|aider|goose|opencode(-ai)?|gemini(-cli)?|qwen(-code)?|kiro-cli|amp|copilot)$") ||
      (c.name.matches("(?i)^pnpm$") ?
        c.args.matches("(?i)\\Adlx\\n(-y\\n)?([^\\n]*/)?(claude(-code)?|codex|cursor-agent|aider|goose|opencode(-ai)?|gemini(-cli)?|qwen(-code)?|kiro-cli|amp|copilot)(\\n|\\z)") :
        c.name.matches("(?i)^(npx|bunx)$") &&
        c.args.matches("(?i)\\A(-y\\n)?([^\\n]*/)?(claude(-code)?|codex|cursor-agent|aider|goose|opencode(-ai)?|gemini(-cli)?|qwen(-code)?|kiro-cli|amp|copilot)(\\n|\\z)"))
    tests:
      - name: an_agent_by_name
        match: e.command.parsed_commands.exists(c, agent_cli(c))
        verdict: match
        events:
          - event: { action: command.executed }
            command: { command: "claude -p 'summarize the diff'" }
      - name: an_agent_under_sudo_and_env_by_path
        match: e.command.parsed_commands.exists(c, agent_cli(c))
        verdict: match
        events:
          - event: { action: command.executed }
            command: { command: "sudo env TERM=dumb /usr/local/bin/codex exec 'run the tests'" }
      - name: an_agent_through_npx_by_its_package
        match: e.command.parsed_commands.exists(c, agent_cli(c))
        verdict: match
        events:
          - event: { action: command.executed }
            command: { command: "npx -y @anthropic-ai/claude-code --version" }
      - name: an_agent_inside_a_shell_script
        match: e.command.parsed_commands.exists(c, agent_cli(c))
        verdict: match
        events:
          - event: { action: command.executed }
            command: { command: "bash -c 'cd repo && gemini -p \"review this\"'" }
      - name: an_agent_named_in_a_commit_message
        match: e.command.parsed_commands.exists(c, agent_cli(c))
        verdict: no_match
        events:
          - event: { action: command.executed }
            command: { command: "git commit -m 'docs: how to run claude and codex side by side'" }
      - name: a_directory_named_for_an_agent
        match: e.command.parsed_commands.exists(c, agent_cli(c))
        verdict: no_match
        events:
          - event: { action: command.executed }
            command: { command: "ls -la ~/.claude && cat ~/.codex/config.toml" }
      - name: another_package_run_through_npx
        match: e.command.parsed_commands.exists(c, agent_cli(c))
        verdict: no_match
        events:
          - event: { action: command.executed }
            command: { command: "npx -y prettier --check ." }

  - name: agent_cli_mention
    params: [text]
    description: >
      The text runs one of the coding agents agent_cli knows, by the same names: a name at a
      command's position (the start, after ; & | ( ` or $(, after sudo, env, npx, bunx, pnpm
      dlx, timeout and its duration, nohup or exec, or after an assignment), by any path or
      package scope (not a URL's), and the name ends the word. It is for the text of a command
      line the parser cannot see into (unread_text), so a name added to agent_cli is added
      here too. A name inside a word (~/.claude, codex.md, codex-tui.log), after a quote
      ("Codex Desktop", a string in a script), in prose, in a URL or HTML's &amp; is not one.
    body: >
      text.matches("(?i)(^|[;&|(`]|\\$\\(|\\b(sudo|env|npx|bunx|dlx|nohup|exec|timeout\\s+\\S+)\\s+|[A-Za-z_][A-Za-z0-9_]*\\s*=\\S*\\s+)\\s*((npx|bunx|pnpm\\s+dlx)\\s+(-y\\s+)?)?([^\\s;&|'\":]*/)?(claude(-code)?|codex|cursor-agent|aider|goose|opencode(-ai)?|gemini(-cli)?|qwen(-code)?|kiro-cli|amp|copilot)(\\s|$|[|&)'\"`])")
    tests:
      - name: an_agent_handed_to_a_script
        match: agent_cli_mention(e.command.command)
        verdict: match
        events:
          - event: { action: command.executed }
            command: { command: "./spawn.sh 'cd repo && claude --dangerously-skip-permissions -p fix'" }
      - name: an_agent_through_npx_by_its_package
        match: agent_cli_mention(e.command.command)
        verdict: match
        events:
          - event: { action: command.executed }
            command: { command: "./run.sh 'cd repo && npx -y @google/gemini-cli --yolo'" }
      - name: an_agent_after_an_assignment_and_a_timeout
        match: agent_cli_mention(e.command.command)
        verdict: match
        events:
          - event: { action: command.executed }
            command: { command: "./run.sh 'CODEX_HOME=/tmp/c timeout 600 /usr/local/bin/aider --yes'" }
      - name: amp_with_words
        match: agent_cli_mention(e.command.command)
        verdict: match
        events:
          - event: { action: command.executed }
            command: { command: "./run.sh 'cd repo; amp --dangerously-allow-all'" }
      - name: a_directory_named_for_an_agent
        match: agent_cli_mention(e.command.command)
        verdict: no_match
        events:
          - event: { action: command.executed }
            command: { command: "./run.sh 'ls -la ~/.claude && cat codex.md'" }
      - name: an_html_entity
        match: agent_cli_mention(e.command.command)
        verdict: no_match
        events:
          - event: { action: command.executed }
            command: { command: "./post.sh 'a &amp; b'" }
      - name: a_quoted_path_or_file_named_for_an_agent
        match: agent_cli_mention(e.command.command)
        verdict: no_match
        events:
          - event: { action: command.executed }
            command: { command: "python3 - <<'EOF'\nfor p in ['codex-tui.log', \"$H/.config/opencode\"]: print(p)\nEOF" }
