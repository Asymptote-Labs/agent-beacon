# What installing a scheduled job looks like, said once for the rules about it.
#
# Two rules ask: crontab-modification (any change to a crontab, removal included) and
# persistence-install-command (a job or service installed to run later). A job is installed
# by the crontab command or by writing one of cron's own files, so there is a predicate for
# each: crontab_installs for a parsed command, cron_file for a path, asked of a file event
# and of every path a command writes (c.file_writes).
library: scheduling
version: 1
spec: threat-rules/v1.3
description: Installing a cron job, by the crontab command or by writing one of cron's files.

definitions:
  - name: crontab_installs
    params: [c]
    description: >
      A parsed command is crontab editing or installing a crontab: -e, a file operand, `-`,
      or no operand at all, which reads the new crontab from standard input, each optionally
      after -u and a user. `crontab -l`, which lists, and `crontab -r`, which removes, are
      not installs.
    body: >
      c.name == "crontab" && (
        c.args.matches("(?m)^-[is]*e") ||
        c.args.matches("\\A(-u(\\n.*|.+)(\\n|\\z))?(-|[^-\\n].*)?\\z"))
    tests:
      - name: a_crontab_piped_in
        match: e.command.parsed_commands.exists(c, crontab_installs(c))
        verdict: match
        events:
          - event: { action: command.executed }
            command: { command: "(crontab -l; echo '*/5 * * * * /tmp/x.sh') | crontab -" }
      - name: a_crontab_file_for_another_user
        match: e.command.parsed_commands.exists(c, crontab_installs(c))
        verdict: match
        events:
          - event: { action: command.executed }
            command: { command: "sudo crontab -u deploy /tmp/jobs.cron" }
      - name: a_crontab_listed
        match: e.command.parsed_commands.exists(c, crontab_installs(c))
        verdict: no_match
        events:
          - event: { action: command.executed }
            command: { command: "crontab -l | grep backup" }
      - name: a_crontab_removed
        match: e.command.parsed_commands.exists(c, crontab_installs(c))
        verdict: no_match
        events:
          - event: { action: command.executed }
            command: { command: "crontab -r" }

  - name: cron_file
    params: [path]
    description: >
      The path is a file cron reads its jobs from: /etc/crontab, a drop-in under /etc/cron.d,
      a script under /etc/cron.hourly, cron.daily, cron.weekly or cron.monthly, or a user's
      spool file under /var/spool/cron (or /var/spool/cron/crontabs).
    body: >
      path.matches("(?i)(^|/)etc/(crontab|cron\\.d/[^/]+|cron\\.(hourly|daily|weekly|monthly)/[^/]+)$|(^|/)var/spool/cron/(crontabs/)?[^/]+$")
    tests:
      - name: a_drop_in_written_through_sudo_tee
        match: e.command.parsed_commands.exists(c, c.file_writes.exists(f, cron_file(f.path)))
        verdict: match
        events:
          - event: { action: command.executed }
            command: { command: "echo '*/5 * * * * root /tmp/x.sh' | sudo tee /etc/cron.d/sync" }
      - name: a_daily_script_copied_into_place
        match: e.command.parsed_commands.exists(c, c.file_writes.exists(f, cron_file(f.path)))
        verdict: match
        events:
          - event: { action: command.executed }
            command: { command: "sudo install -m 755 sync.sh /etc/cron.daily/sync" }
      - name: a_spool_file_on_debian
        match: cron_file(e.file.path)
        verdict: match
        events:
          - event: { action: file.modified }
            file: { path: "/var/spool/cron/crontabs/root" }
      - name: the_system_crontab_only_read
        match: e.command.parsed_commands.exists(c, c.file_writes.exists(f, cron_file(f.path)))
        verdict: no_match
        events:
          - event: { action: command.executed }
            command: { command: "cat /etc/crontab; ls /etc/cron.d" }
      - name: a_directory_of_cron
        match: cron_file(e.file.path)
        verdict: no_match
        events:
          - event: { action: file.created }
            file: { path: "/etc/cron.d" }
