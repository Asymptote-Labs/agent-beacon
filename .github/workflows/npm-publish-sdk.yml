name: Publish TypeScript SDK

on:
  workflow_dispatch:
  push:
    tags:
      - sdk-js-v*

concurrency:
  group: npm-publish-sdk-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # The protection that holds against a rewritten workflow: the npm-publish environment allows
    # deployments only from sdk-js-v* tags, and npm's trusted publisher for @asymptote/sdk requires
    # this environment. A branch that drops this line gets no token npm accepts; one that keeps it
    # is refused by GitHub before the job starts.
    environment: npm-publish
    steps:
      - name: Require an SDK release tag
        # Catches an accidental dispatch from a branch, before any branch code is installed with
        # id-token: write. It is not the security boundary: workflow_dispatch runs the workflow
        # file from the dispatched ref, which can omit this step. The environment above is.
        if: github.ref_type != 'tag' || !startsWith(github.ref_name, 'sdk-js-v')
        run: |
          echo "npm publish runs only from an sdk-js-v* tag (got ${GITHUB_REF})" >&2
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Verify npm supports trusted publishing
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm_version="$(npm --version)"
          echo "npm ${npm_version}"
          IFS=. read -r npm_major npm_minor _ <<<"${npm_version}"
          if [ "${npm_major}" -lt 11 ] || { [ "${npm_major}" -eq 11 ] && [ "${npm_minor}" -lt 5 ]; }; then
            echo "npm ${npm_version} does not support trusted publishing"
            exit 1
          fi
      - name: Install SDK dependencies
        working-directory: packages/asymptote-sdk-js
        run: npm ci
      - name: Verify tag matches SDK version
        working-directory: packages/asymptote-sdk-js
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#sdk-js-v}"
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg_version" ]; then
            echo "Tag version ($tag) does not match package.json version ($pkg_version)"
            exit 1
          fi
      - name: Test SDK
        working-directory: packages/asymptote-sdk-js
        run: npm test
      - name: Type-check SDK
        working-directory: packages/asymptote-sdk-js
        run: npm run check
      - name: Build SDK
        working-directory: packages/asymptote-sdk-js
        run: npm run build
      - name: Smoke install SDK package
        working-directory: packages/asymptote-sdk-js
        run: npm run pack:smoke
      - name: Publish SDK to npm
        working-directory: packages/asymptote-sdk-js
        run: npm publish
