name: Smoke images

# Publishes the container images the Linux smoke tests run in (packaging/linux/smoke/*.Dockerfile)
# to GHCR, so CI pulls them instead of running apt-get or dnf against the distribution mirrors on
# every pull request. Each image is tagged with a digest of its Dockerfile (see smoke/image.sh):
#
#   - on a push to main that changes a Dockerfile, the new recipe is published under its new tag;
#   - weekly, every image is rebuilt from a freshly pulled base under its existing tag, so the
#     smoke tests keep running on a patched base without a pull request to bump anything.
#
# An image is published only once it boots, and every publish also carries a dated tag to roll back
# to (see smoke/image.sh). Until the first publish of a recipe, the smoke scripts build it
# themselves, as on a developer machine, so a pull request that changes a Dockerfile still tests it.
#
# Cost: the packages are public and so is this repository, so GHCR storage and transfer and these
# Actions minutes are free. The prune job keeps each package to its newest few versions anyway, so
# that a change of visibility could not leave a year of weekly images to bill for.
on:
  push:
    branches:
      - main
    paths:
      - packaging/linux/smoke/**
      - .github/workflows/smoke-images.yml
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  IMAGES: systemd package-deb package-rpm

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [systemd, package-deb, package-rpm]
    steps:
      - uses: actions/checkout@v7
      - name: Log in to GHCR
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build, boot-check and push ${{ matrix.image }}
        run: |
          BEACON_SMOKE_REGISTRY="ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')" \
            sh packaging/linux/smoke/image.sh --publish "${{ matrix.image }}"

  # Keeps the newest versions of each package and deletes the rest: the current image and three
  # weekly ones to roll back to. The newest version is always the one CI pulls, because a version is
  # only ever pushed after it boots. Runs after a failed publish too, since what it keeps does not
  # depend on what was just pushed.
  prune:
    needs: publish
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      packages: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      KEEP: 4
    steps:
      - name: Delete all but the newest ${{ env.KEEP }} versions
        run: |
          set -eu
          owner="$GITHUB_REPOSITORY_OWNER"
          for name in $IMAGES; do
            pkg="beacon-smoke-$name"
            if ! versions="$(gh api --paginate "orgs/$owner/packages/container/$pkg/versions" \
                --jq '.[] | "\(.created_at) \(.id)"')"; then
              echo "::warning::$pkg: cannot list versions; skipped"
              continue
            fi
            echo "$versions" | sort -r | tail -n +"$((KEEP + 1))" | while read -r created id; do
              [ -n "$id" ] || continue
              echo "$pkg: deleting version $id ($created)"
              gh api -X DELETE "orgs/$owner/packages/container/$pkg/versions/$id"
            done
          done

  # A failed run outside a pull request has no reviewer watching, and GitHub mails a failed scheduled
  # run only to whoever last edited the cron line. One open issue tracks it instead: opened or
  # commented on when a run fails, closed by the next run that succeeds.
  report:
    needs: [publish, prune]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TITLE: "Smoke images: publish failing"
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      FAILED: ${{ needs.publish.result != 'success' || needs.prune.result != 'success' }}
    steps:
      - name: Open, update or close the tracking issue
        run: |
          set -eu
          open="$(gh issue list --state open --search "in:title \"$TITLE\"" --json number,title \
            --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")"
          if [ "$FAILED" = true ]; then
            body="The smoke image workflow failed: $RUN_URL

          CI keeps pulling the last published images, so pull requests are not affected until a Dockerfile changes, but the images are not getting base updates. A distribution mirror outage is the usual cause; re-run the workflow once it is over."
            if [ -n "$open" ]; then
              gh issue comment "$open" --body "Failed again: $RUN_URL"
            else
              gh issue create --title "$TITLE" --body "$body"
            fi
          elif [ -n "$open" ]; then
            gh issue close "$open" --comment "Published successfully: $RUN_URL"
          fi
