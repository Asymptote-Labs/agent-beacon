name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  typescript-sdk:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: packages/asymptote-sdk-js/package-lock.json
      - name: Install SDK dependencies
        working-directory: packages/asymptote-sdk-js
        run: npm ci
      - name: Test SDK
        working-directory: packages/asymptote-sdk-js
        run: npm test
      - name: Type-check SDK
        working-directory: packages/asymptote-sdk-js
        run: npm run check
      - name: Build SDK
        working-directory: packages/asymptote-sdk-js
        run: npm run build
      - name: Validate SDK package contents
        working-directory: packages/asymptote-sdk-js
        run: npm run pack:dry-run
      - name: Smoke install SDK package
        working-directory: packages/asymptote-sdk-js
        run: npm run pack:smoke

  go-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/beacon/go.mod
      - name: Check OpenCode plugin
        working-directory: plugins/opencode-beacon
        run: bun run check && bun test
      - name: Build embedded hooks binary
        working-directory: cli/beacon
        # hooks.bin is gitignored (build-time artifact). The CLI embeds it via
        # //go:embed, so build the real binary for this runner before testing —
        # a placeholder is not enough (InstallFactory requires a real binary).
        run: make build-hooks-current
      - name: Test CLI
        working-directory: cli/beacon
        run: go test ./...
      - name: Test CLI race-sensitive packages
        working-directory: cli/beacon
        run: go test -race ./internal/endpoint/...
      - name: Test hooks
        working-directory: cli/beacon-hooks
        run: go test ./...
      - name: Test collector exporter
        working-directory: collector-builder/exporter/beaconjsonexporter
        run: go test ./...
      - name: Test observe SDK + threat-rules conformance
        working-directory: pkg/asymptoteobserve
        run: go test ./...
      - name: Public CLI command tree smoke test
        working-directory: cli/beacon
        run: |
          make build
          ./beacon --help > /tmp/beacon-help.txt
          ./beacon endpoint --help > /tmp/beacon-endpoint-help.txt
          ./beacon endpoint hooks --help > /tmp/beacon-hooks-help.txt
          ./beacon endpoint onboarding --help > /tmp/beacon-onboarding-help.txt
          ./beacon endpoint integrations claude-cowork --help > /tmp/beacon-cowork-help.txt
          ./beacon endpoint wazuh --help > /tmp/beacon-wazuh-help.txt
          ./beacon endpoint rapid7 --help > /tmp/beacon-rapid7-help.txt
          ./beacon scan --help > /tmp/beacon-scan-help.txt
          ./beacon rules --help > /tmp/beacon-rules-help.txt
          ./beacon rules lint --help > /tmp/beacon-rules-lint-help.txt
          for forbidden in init update claude cursor dep-scan config whoami; do
            if grep -E "^[[:space:]]+$forbidden([[:space:]]|$)" /tmp/beacon-help.txt; then
              echo "forbidden command exposed: $forbidden"
              exit 1
            fi
          done

  beacon-sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: beacon-sandbox/go.mod
      # These tests are hermetic: no Modal account, no Anthropic key, no sandbox, and no
      # paid resources. (Go module downloads still happen, as in every other job here.)
      # They gate because they are what makes a green verification run mean
      # something -- the adversarial cases assert a damaged log still fails, so
      # if they rot, the sandbox can pass without having checked anything.
      # The end-to-end sandbox run itself costs real money and is not run in CI.
      - name: Test beacon-sandbox
        working-directory: beacon-sandbox
        run: |
          go build ./...
          go vet ./...
          go test ./...

  cross-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: amd64
            make_target: build-darwin-amd64
          - goos: darwin
            goarch: arm64
            make_target: build-darwin-arm64
          - goos: linux
            goarch: amd64
            make_target: build-linux-amd64
          - goos: linux
            goarch: arm64
            make_target: build-linux-arm64
          - goos: windows
            goarch: amd64
            make_target: build-windows-amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/beacon/go.mod
      - name: Build Beacon for ${{ matrix.goos }}/${{ matrix.goarch }}
        working-directory: cli/beacon
        run: make ${{ matrix.make_target }}

  linux-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/beacon/go.mod
      # The embedded hooks binary must match the platform under test: the CLI validates its
      # architecture at runtime, so a macOS placeholder fails hook installation on Linux.
      - name: Build platform-matched hooks binary
        working-directory: cli/beacon
        run: make build-hooks-current
      - name: Test beacon CLI on Linux
        working-directory: cli/beacon
        run: go test ./...
      - name: Test endpoint packages with the race detector
        working-directory: cli/beacon
        run: go test -race ./internal/endpoint/...
      - name: Test hook adapter on Linux
        working-directory: cli/beacon-hooks
        run: go test ./...
      - name: Test collector exporter on Linux
        working-directory: collector-builder/exporter/beaconjsonexporter
        run: go test ./...
      - name: Test observe SDK and threat rules on Linux
        working-directory: pkg/asymptoteobserve
        run: go test ./...

  # Runs the unit suites on a real Windows runner. The cross-build matrix proves the code compiles
  # for windows/amd64; this proves the per-OS implementations behave -- file locking through
  # LockFileEx, file identity through GetFileInformationByHandle, and process liveness through
  # OpenProcess, none of which a cross-compile exercises at all.
  windows-test:
    runs-on: windows-2025
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/beacon/go.mod
      # The embedded hooks binary must match the platform under test: the CLI validates its
      # architecture at runtime, so a placeholder fails hook installation on Windows.
      - name: Build platform-matched hooks binary
        working-directory: cli/beacon-hooks
        run: |
          go build -ldflags "-s -w" -o beacon-hooks.exe .
          Copy-Item beacon-hooks.exe ..\beacon\internal\embedded\hooks.bin -Force
      - name: Test beacon CLI on Windows
        working-directory: cli/beacon
        run: go test ./...
      - name: Test endpoint packages with the race detector
        working-directory: cli/beacon
        run: go test -race ./internal/endpoint/...
      - name: Test hook adapter on Windows
        working-directory: cli/beacon-hooks
        run: go test ./...
      - name: Test collector exporter on Windows
        working-directory: collector-builder/exporter/beaconjsonexporter
        run: go test ./...
      - name: Test observe SDK and threat rules on Windows
        working-directory: pkg/asymptoteobserve
        run: go test ./...
      # Runs the generated-PowerShell parse test, which skips on a machine without pwsh.
      - name: Test the sandbox harness on Windows
        working-directory: beacon-sandbox
        run: go test ./...

  # Exercises the real systemd install path: unit generation, systemctl enable/active,
  # Restart=always actually restarting, and uninstall leaving nothing behind. Needs systemd as
  # PID 1, which only a privileged container provides -- the GitHub runner's own systemd is not
  # ours to install units into.
  linux-systemd-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/beacon/go.mod
      - name: Build Linux beacon binary
        working-directory: cli/beacon
        run: make build-linux-amd64
      - name: Build collector for Linux
        run: |
          go install go.opentelemetry.io/collector/cmd/builder@v0.121.0
          cd collector-builder
          # builder mkdirs its output path without -p, so the parent has to exist. A fresh checkout
          # has no dist/ at all, which is why this only failed in CI.
          mkdir -p dist
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 "$(go env GOPATH)/bin/builder" --config builder.yaml
          mkdir -p dist/beacon-otelcol/linux_amd64
          cp dist/beacon-otelcol/beacon-otelcol dist/beacon-otelcol/linux_amd64/beacon-otelcol
      - name: systemd endpoint smoke test
        env:
          BEACON_SMOKE_ARCH: amd64
        run: sh packaging/linux/smoke-systemd.sh

  # Installs the built .deb in a container where systemd is PID 1 and asserts that installing the
  # package alone yields a running system-mode endpoint. smoke-systemd covers the service backend;
  # this covers the package postinstall doing it for the user, which is what they actually do.
  linux-package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/beacon/go.mod
      - name: Build collector for Linux
        run: |
          go install go.opentelemetry.io/collector/cmd/builder@v0.121.0
          cd collector-builder
          # builder mkdirs its output path without -p, so the parent has to exist.
          mkdir -p dist
          for arch in amd64 arm64; do
            GOOS=linux GOARCH=$arch CGO_ENABLED=0 "$(go env GOPATH)/bin/builder" --config builder.yaml
            mkdir -p dist/beacon-otelcol/linux_$arch
            cp dist/beacon-otelcol/beacon-otelcol dist/beacon-otelcol/linux_$arch/beacon-otelcol
          done
          # The goreleaser before-hook stages all four targets, so darwin must exist too.
          for arch in amd64 arm64; do
            mkdir -p dist/beacon-otelcol/darwin_$arch
            cp dist/beacon-otelcol/linux_$arch/beacon-otelcol dist/beacon-otelcol/darwin_$arch/beacon-otelcol
          done
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          install-only: true
      - name: Build packages
        working-directory: cli/beacon
        run: goreleaser release --snapshot --clean --skip=publish,homebrew,announce --parallelism 1
      - name: Install the .deb and verify the endpoint
        env:
          BEACON_SMOKE_ARCH: amd64
        run: sh packaging/linux/smoke-package.sh

  package-smoke:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/beacon/go.mod
      - name: Validate packaging scripts
        run: |
          test -x packaging/macos/install-endpoint.sh
          test -x packaging/macos/uninstall-endpoint.sh
          test -x packaging/macos/smoke-endpoint.sh
          test -f collector-builder/builder.yaml
          sh packaging/macos/test-endpoint-scripts.sh
      - name: Build macOS package skeleton
        run: |
          (cd cli/beacon && make build)
          mkdir -p /tmp/beacon-collector
          printf '#!/bin/sh\nexit 0\n' > /tmp/beacon-collector/beacon-otelcol
          chmod +x /tmp/beacon-collector/beacon-otelcol
          OUT_DIR=/tmp/beacon-pkg BEACON_COLLECTOR=/tmp/beacon-collector/beacon-otelcol packaging/macos/build-pkg.sh
          pkgutil --payload-files /tmp/beacon-pkg/*.pkg | awk '$0 == "./opt/beacon/bin/beacon" { found = 1 } END { exit !found }'
          pkgutil --payload-files /tmp/beacon-pkg/*.pkg | awk '$0 == "./opt/beacon/bin/beacon-otelcol" { found = 1 } END { exit !found }'
      - name: Endpoint install smoke test
        run: sh packaging/macos/smoke-endpoint.sh

