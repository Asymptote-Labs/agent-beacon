name: Release

# Full hands-off release on a pushed v* tag:
#   1. goreleaser  — builds tarballs, publishes the GitHub release + changelog,
#                    updates the Homebrew tap, and attests the .deb files it built. Signs the
#                    .deb/.rpm and checksums.txt when the Linux signing key secret exists.
#   2. package     — (after goreleaser) builds, signs, notarizes, and staples the
#                    macOS .pkg for both arches and attaches them plus the
#                    package update manifest to the same release.
#   3. windows-package — (after goreleaser) builds the Windows MSI from the archive and the pinned Vector
#                    goreleaser just published, installs it to prove it works, and
#                    attaches it. Unsigned for now, so it needs no secrets.
#   4. finalize    — (after goreleaser, package and windows-package) adds the .pkg, .msi and
#                    install.sh to checksums.txt and records a GitHub build-provenance
#                    attestation for every file checksums.txt lists. Re-signs the extended
#                    checksums.txt when the Linux signing key secret exists.
#   5. apt-repository — (after goreleaser) adds the released .deb files, each checked against
#                    goreleaser's attestation, to the signed apt repository in object storage. Skipped
#                    until its APT_* secrets and variables are configured.
#
# Triggered only by pushed version tags, so outside contributors (whose fork PRs
# never receive secrets) cannot run it. All release secrets live in the protected
# `release` environment, restricted to v* tags.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      # Only for "Attest the Linux packages goreleaser built", below.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: cli/beacon/go.mod

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "v2.13.3"
          install-only: true

      - name: Install OpenTelemetry Collector Builder
        run: go install go.opentelemetry.io/collector/cmd/builder@v0.121.0

      - name: Build collector distributions
        run: bash collector-builder/build-release-collectors.sh

      - name: Validate native collector binary
        shell: bash
        run: |
          set -euo pipefail
          collector=collector-builder/dist/beacon-otelcol/linux_amd64/beacon-otelcol
          test -x "$collector"
          "$collector" components | awk '
            /name: beaconjson/ { beaconjson = 1 }
            /name: falcon_hec/ { falcon_hec = 1 }
            END { exit !(beaconjson && falcon_hec) }
          '

      # The .deb, .rpm, and Linux archives carry Vector. The goreleaser before-hook fails the
      # release if this did not stage both arches.
      - name: Download Vector for the Linux packages
        run: sh packaging/linux/fetch-vector.sh

      # nfpm signs the .deb and .rpm when BEACON_LINUX_SIGNING_KEY_FILE names a key, and GoReleaser's
      # signs entry signs checksums.txt with the key imported here, so checksums.txt.sig and the public
      # key are attached while GoReleaser's release is still a draft: a pinned install.sh or self-updater
      # never sees this release as latest without them. Unsigned, as before, until the
      # BEACON_LINUX_SIGNING_KEY secret exists.
      - name: Stage the Linux release signing key
        env:
          BEACON_LINUX_SIGNING_KEY: ${{ secrets.BEACON_LINUX_SIGNING_KEY }}
        run: |
          set -euo pipefail
          pinned="$(xargs < cli/beacon/internal/endpoint/selfupdate/release-key.fingerprint | tr ' a-f' ',A-F')"
          if [ -z "$BEACON_LINUX_SIGNING_KEY" ]; then
            if [ -n "$pinned" ]; then
              echo "::error title=Linux signing key missing::release-key.fingerprint is pinned but BEACON_LINUX_SIGNING_KEY is not configured."
              exit 1
            fi
            echo "::notice title=Linux signing skipped::BEACON_LINUX_SIGNING_KEY is not configured, so the .deb, .rpm and checksums.txt are unsigned."
            echo "BEACON_GORELEASER_SKIP=--skip=sign" >> "$GITHUB_ENV"
            exit 0
          fi
          key="$RUNNER_TEMP/beacon-linux-signing.asc"
          (umask 077 && printf '%s\n' "$BEACON_LINUX_SIGNING_KEY" > "$key")
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 0700 "$GNUPGHOME"
          gpg --batch --import "$key"
          fpr="$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "fpr" { print toupper($10); exit }')"
          if [ -n "$pinned" ] && ! printf '%s\n' "$pinned" | tr , '\n' | grep -qxF "$fpr"; then
            echo "::error title=Signing key not pinned::BEACON_LINUX_SIGNING_KEY is ${fpr}, which release-key.fingerprint (${pinned}) does not list."
            exit 1
          fi
          # Attached by the release's extra_files only when BEACON_LINUX_SIGNING_KEY_FILE is set.
          mkdir -p cli/beacon/release-key
          gpg --batch --export "$fpr" > cli/beacon/release-key/beacon-release-key.gpg
          gpg --batch --armor --export "$fpr" > cli/beacon/release-key/beacon-release-key.asc
          {
            echo "BEACON_LINUX_SIGNING_KEY_FILE=$key"
            echo "BEACON_LINUX_SIGNING_KEY_FPR=$fpr"
            echo "GNUPGHOME=$GNUPGHOME"
          } >> "$GITHUB_ENV"

      - name: Check GoReleaser config
        working-directory: cli/beacon
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: goreleaser check

      # GoReleaser takes the nearest tag of any kind as the previous release, so an
      # ext-v* or sdk-js-v* tag between two CLI releases cuts the changelog short:
      # v1.3.47's started at sdk-js-v0.2.0 and left out everything before it. Only
      # v* tags count here, and both ends are passed to the publish step.
      - name: Find the previous CLI release
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          previous="$(git describe --tags --abbrev=0 --match 'v[0-9]*' "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          echo "Changelog covers ${previous:-the start of history}..${GITHUB_REF_NAME}"

      # Run from cli/beacon because the release pre-hook writes target-specific
      # beacon-hooks binaries to a shared embedded path; --parallelism 1 avoids
      # racing on it.
      - name: Publish release (tarballs, GitHub release, Homebrew tap)
        working-directory: cli/beacon
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          NFPM_PASSPHRASE: ${{ secrets.BEACON_LINUX_SIGNING_KEY_PASSPHRASE }}
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
          GORELEASER_PREVIOUS_TAG: ${{ steps.tags.outputs.previous }}
        run: goreleaser release --clean --parallelism 1 ${BEACON_GORELEASER_SKIP:-}

      # The apt repository signs only packages this attests: goreleaser's own output, hashed here
      # from dist/ in the release-environment job that built it, never from the release. Its
      # predicate type is this repository's own, which finalize never writes. finalize re-hashes
      # the release's assets, which anyone who can edit a release can swap together with
      # checksums.txt, and its job can be re-run without approval; so an attestation from it
      # proves only what the release held when it ran. The apt job asks for this predicate type.
      #
      # Non-fatal: the release is already published by now, and a failure here (a Sigstore or
      # attestation API error) must not skip the .pkg, MSI and finalize, which need this job to
      # succeed. Without the attestation the apt job refuses this tag's packages and fails alone.
      - name: Attest the Linux packages goreleaser built
        continue-on-error: true
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: cli/beacon/dist/*.deb
          predicate-type: https://github.com/Asymptote-Labs/agent-beacon/attestations/goreleaser-deb/v1
          predicate: '{"builder":"goreleaser","job":"goreleaser"}'

  package:
    needs: goreleaser
    runs-on: macos-latest
    environment: release
    env:
      REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      NOTARYTOOL_PROFILE: beacon-notary-ci
      BEACON_APP_SIGN_IDENTITY: ${{ vars.DEVELOPER_ID_APP_IDENTITY }}
      PKG_SIGN_IDENTITY: ${{ vars.DEVELOPER_ID_INSTALLER_IDENTITY }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      # Signed endpoint packages target Apple Silicon. Vector 0.51+ no longer
      # publishes x86_64-apple-darwin tarballs, so keep the package path on the
      # current arm64 distribution instead of pinning all Macs to old Vector.
      BEACON_PKG_ARCHES: "arm64"
      VECTOR_VERSION: "0.56.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: cli/beacon/go.mod

      - name: Compute version
        id: ver
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Install OpenTelemetry Collector Builder
        run: go install go.opentelemetry.io/collector/cmd/builder@v0.121.0

      - name: Build collector distributions
        run: bash collector-builder/build-release-collectors.sh

      - name: Download Vector binaries (per arch)
        run: |
          set -euo pipefail
          mkdir -p dist/vector
          # Checked against checksums pinned in the repository, not a file from the download host.
          cp "packaging/vector/vector-${VECTOR_VERSION}-SHA256SUMS" .
          for ARCH in $BEACON_PKG_ARCHES; do
            case "$ARCH" in
              arm64) VECTOR_ARCH="arm64" ;;
              amd64) VECTOR_ARCH="x86_64" ;;
              *) echo "unsupported Vector arch: $ARCH" >&2; exit 1 ;;
            esac
            archive="vector-${VECTOR_VERSION}-${VECTOR_ARCH}-apple-darwin.tar.gz"
            curl -fsSLO "https://packages.timber.io/vector/${VECTOR_VERSION}/${archive}"
            checksum_line="$(awk -v archive="$archive" '$2 == archive { print }' "vector-${VECTOR_VERSION}-SHA256SUMS")"
            if [ -z "$checksum_line" ]; then
              echo "checksum not found for $archive" >&2
              exit 1
            fi
            printf '%s\n' "$checksum_line" | shasum -a 256 -c -
            mkdir -p "dist/vector/${ARCH}"
            extract_dir="$(mktemp -d)"
            tar -xzf "$archive" -C "$extract_dir"
            vector_bin="$(find "$extract_dir" -path "*/bin/vector" -type f | head -n 1)"
            if [ -z "$vector_bin" ]; then
              echo "vector binary not found in $archive" >&2
              find "$extract_dir" -maxdepth 4 -type f >&2
              exit 1
            fi
            cp "$vector_bin" "dist/vector/${ARCH}/vector"
            chmod 755 "dist/vector/${ARCH}/vector"
            rm -rf "$extract_dir"
            "dist/vector/${ARCH}/vector" --version
          done

      - name: Build beacon binaries (per arch, with embedded hooks)
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          BEACON_LD="github.com/asymptote-labs/agent-beacon/cli/beacon/internal/version"
          HOOKS_LD="github.com/asymptote-labs/agent-beacon/cli/beacon-hooks/internal/version"
          mkdir -p dist/pkgbins
          for ARCH in $BEACON_PKG_ARCHES; do
            # Embed the arch-matched hooks binary, then build beacon for that arch.
            (cd cli/beacon-hooks && GOOS=darwin GOARCH="$ARCH" \
              go build -ldflags "-s -w -X ${HOOKS_LD}.Version=${VERSION}" \
              -o ../beacon/internal/embedded/hooks.bin .)
            (cd cli/beacon && GOOS=darwin GOARCH="$ARCH" CGO_ENABLED=0 \
              go build -a -ldflags "-s -w -X ${BEACON_LD}.Version=${VERSION} -X ${BEACON_LD}.GitCommit=$(git rev-parse --short HEAD) -X ${BEACON_LD}.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              -o "../../dist/pkgbins/beacon-${ARCH}" .)
          done

      - name: Set up signing keychain
        env:
          DEVELOPER_ID_APP_CERT_P12: ${{ secrets.DEVELOPER_ID_APP_CERT_P12 }}
          DEVELOPER_ID_APP_CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_APP_CERT_PASSWORD }}
          DEVELOPER_ID_INSTALLER_CERT_P12: ${{ secrets.DEVELOPER_ID_INSTALLER_CERT_P12 }}
          DEVELOPER_ID_INSTALLER_CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_INSTALLER_CERT_PASSWORD }}
          NOTARY_API_KEY_P8: ${{ secrets.NOTARY_API_KEY_P8 }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER: ${{ secrets.NOTARY_API_ISSUER }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/beacon-signing.keychain-db"
          KEYCHAIN_PW="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          # Make the new keychain searchable while keeping the login keychain.
          security list-keychains -d user -s "$KEYCHAIN" "$(security default-keychain -d user | tr -d ' "')"

          echo "$DEVELOPER_ID_APP_CERT_P12" | base64 --decode > "$RUNNER_TEMP/app.p12"
          echo "$DEVELOPER_ID_INSTALLER_CERT_P12" | base64 --decode > "$RUNNER_TEMP/installer.p12"
          security import "$RUNNER_TEMP/app.p12" -k "$KEYCHAIN" -P "$DEVELOPER_ID_APP_CERT_PASSWORD" -T /usr/bin/codesign
          security import "$RUNNER_TEMP/installer.p12" -k "$KEYCHAIN" -P "$DEVELOPER_ID_INSTALLER_CERT_PASSWORD" -T /usr/bin/pkgbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PW" "$KEYCHAIN"

          # Store notarization credentials as the profile build-pkg.sh expects.
          echo "$NOTARY_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          xcrun notarytool store-credentials "$NOTARYTOOL_PROFILE" \
            --key "$RUNNER_TEMP/notary.p8" \
            --key-id "$NOTARY_API_KEY_ID" \
            --issuer "$NOTARY_API_ISSUER" \
            --keychain "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/app.p12" "$RUNNER_TEMP/installer.p12" "$RUNNER_TEMP/notary.p8"
          echo "BEACON_SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          # Carry the keychain password so later steps can keep it unlocked.
          echo "::add-mask::$KEYCHAIN_PW"
          echo "BEACON_SIGNING_KEYCHAIN_PW=$KEYCHAIN_PW" >> "$GITHUB_ENV"

      - name: Build, sign, notarize, and staple packages (per arch)
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          security unlock-keychain -p "$BEACON_SIGNING_KEYCHAIN_PW" "$BEACON_SIGNING_KEYCHAIN"
          for ARCH in $BEACON_PKG_ARCHES; do
            BEACON_VERSION="$VERSION" \
            BEACON_PKG_ARCH="$ARCH" \
            BEACON_BIN="$PWD/dist/pkgbins/beacon-${ARCH}" \
            BEACON_COLLECTOR="$PWD/collector-builder/dist/beacon-otelcol/darwin_${ARCH}/beacon-otelcol" \
            BEACON_VECTOR_BIN="$PWD/dist/vector/${ARCH}/vector" \
            OUT_DIR="$PWD/dist/macos" \
              sh packaging/macos/build-signed-notarized-pkg.sh
          done
          ls -la dist/macos
          # build-pkg.sh leaves Vector out when BEACON_VECTOR_BIN is unset, which is right for a
          # local skeleton build and wrong for a release. awk rather than grep -q, which exits on
          # the first match and fails the pipeline under pipefail.
          for pkg in dist/macos/*.pkg; do
            pkgutil --payload-files "$pkg" | awk '$0 == "./opt/beacon/bin/vector" { found = 1 } END { exit !found }' || {
              echo "$pkg has no /opt/beacon/bin/vector" >&2; exit 1; }
          done

      - name: Generate update manifest
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          # Needed to download the Linux packages the goreleaser job published, so their
          # checksums are computed from the released bytes.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The Linux packages were published by the goreleaser job this one depends on, so
          # download them and checksum the bytes that were actually released rather than
          # trusting a value computed somewhere else.
          mkdir -p dist/linux
          # Both formats, both arches. A single artifact per architecture is not enough: .deb and
          # .rpm hosts share an architecture, and handing an RPM host a .deb makes `endpoint update
          # --apply` fail at the install step after downloading and verifying.
          for arch in amd64 arm64; do
            for fmt in deb rpm; do
              f="beacon_${VERSION}_linux_${arch}.${fmt}"
              if gh release download "$TAG" --repo "$REPO" --pattern "$f" --dir dist/linux; then
                echo "downloaded $f"
              else
                echo "::warning::$f not found on the release; omitting it from update-manifest.json"
              fi
            done
          done

          set -- "$VERSION" "$TAG" "$REPO" "$APPLE_TEAM_ID" \
            "darwin_arm64=$(ls dist/macos/*-${VERSION}-arm64.pkg)"
          for arch in amd64 arm64; do
            for fmt in deb rpm; do
              pkg="dist/linux/beacon_${VERSION}_linux_${arch}.${fmt}"
              # Written as an if, not `[ -f x ] && set -- ...`: under `set -e` a failing AND-list at
              # the end of a loop body exits the step, which would turn the missing-artifact warning
              # above into a hard failure of the whole release.
              if [ -f "$pkg" ]; then
                set -- "$@" "linux_${arch}_${fmt}=$pkg"
              fi
            done
          done
          sh packaging/release/gen-update-manifest.sh "$@" > dist/macos/update-manifest.json
          cat dist/macos/update-manifest.json

      - name: Attach packages + manifest to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # goreleaser (the needs: dependency) has already created the release.
          # create-if-missing is a safety net for a re-run before goreleaser.
          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$REPO" --title "$TAG" \
              --notes "Release $TAG" --verify-tag
          fi
          gh release upload "$TAG" \
            dist/macos/*.pkg \
            dist/macos/*.pkg.sha256 \
            dist/macos/update-manifest.json \
            --repo "$REPO" --clobber

      - name: Clean up signing keychain
        if: always()
        run: |
          security delete-keychain "$BEACON_SIGNING_KEYCHAIN" 2>/dev/null || true

  # The MSI, built from the archive the release just published.
  #
  # Downloading that archive rather than rebuilding the binaries is the point. Go builds are close to
  # reproducible but not guaranteed identical across build hosts, and an installer whose beacon.exe
  # differs from the beacon.exe in the zip beside it is a provenance problem that nobody would notice
  # until they compared hashes. This way the two are the same bytes by construction, which is the
  # guarantee build-msi.ps1 already claims.
  #
  # It also means this job needs no Go toolchain and no collector build: everything it packages has
  # already been built, tested and published by the job it depends on.
  #
  # No `environment: release`, deliberately. That environment exists to gate signing secrets, and this
  # job has none to gate -- the MSI is unsigned for now. Putting it behind the same approval would add
  # friction to a release without protecting anything.
  windows-package:
    needs: goreleaser
    runs-on: windows-2025
    # Bounded because a wedged msiexec is a plausible failure mode rather than a hypothetical one --
    # the CI job that installs this same package documents it and bounds itself for the reason. This
    # job does less than that one (no Go toolchain, no collector build), so it needs less headroom;
    # what matters is that a hung installer fails the release the same morning instead of holding a
    # runner for the six-hour GitHub default.
    timeout-minutes: 20
    env:
      REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch the published Windows archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist\windows | Out-Null
          & gh release download $env:TAG --repo $env:REPO --pattern 'beacon_*_windows_amd64.zip' --dir dist\windows
          if ($LASTEXITCODE -ne 0) { throw "could not download the Windows archive for $env:TAG" }

          $zip = Get-ChildItem dist\windows -Filter 'beacon_*_windows_amd64.zip' | Select-Object -First 1
          if (-not $zip) { throw "the release contains no Windows archive; goreleaser did not build one" }
          Write-Output "packaging from $($zip.Name)"
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath dist\windows\extracted -Force

          # Asserted rather than assumed: a missing collector would produce an MSI that installs a CLI
          # which then reports no collector found, which is a worse outcome than failing here.
          foreach ($name in @('beacon.exe', 'beacon-hooks.exe', 'beacon-otelcol.exe')) {
            $path = Join-Path 'dist\windows\extracted' $name
            if (-not (Test-Path -LiteralPath $path)) {
              Get-ChildItem dist\windows\extracted | Out-String | Write-Output
              throw "$name is not in the published archive"
            }
          }

      # Not in the archive: the Windows zip stays the CLI and collector, and only the MSI carries
      # Vector. Checked against packaging/vector/, never against a checksum from the download host.
      - name: Fetch Vector
        run: |
          $ErrorActionPreference = 'Stop'
          $vector = pwsh -NoProfile -File packaging\windows\fetch-vector.ps1 -OutDir dist\windows\vector | Select-Object -Last 1
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $vector)) { throw "fetch-vector.ps1 staged no vector.exe" }

      - name: Build the MSI
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:TAG.TrimStart('v')
          pwsh -NoProfile -File packaging\windows\build-msi.ps1 `
            -Version $version `
            -BeaconExe dist\windows\extracted\beacon.exe `
            -HooksExe dist\windows\extracted\beacon-hooks.exe `
            -CollectorExe dist\windows\extracted\beacon-otelcol.exe `
            -VectorExe dist\windows\vector\vector.exe `
            -OutFile "dist\windows\BeaconEndpointAgent-$version-x64.msi"
          if ($LASTEXITCODE -ne 0) { throw "building the MSI failed" }

      - name: Install it, so a broken package cannot be published
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = (Get-ChildItem dist\windows -Filter '*.msi' | Select-Object -First 1).FullName
          $log = "$env:GITHUB_WORKSPACE\release-install.log"
          # /norestart, as in CI: without it a silent msiexec that finds a file in use reboots the
          # runner instead of failing the step.
          $p = Start-Process msiexec.exe -Wait -PassThru -ArgumentList @('/i', $msi, '/qn', '/norestart', '/l*v', $log)
          if ($p.ExitCode -ne 0) {
            Get-Content -LiteralPath $log -Tail 120 | Write-Output
            throw "the release MSI failed to install (exit $($p.ExitCode))"
          }

          # The same claim the CI gate makes, made once more against the artifact that is about to be
          # published rather than against one built from the same source. A package that installs a
          # CLI but registers no service is the failure worth catching before a tag goes out.
          $state = (& sc.exe query BeaconCollector 2>&1 | Out-String)
          $global:LASTEXITCODE = 0
          Write-Output $state
          if ($state -notmatch 'RUNNING') { throw "the release MSI did not leave a running collector" }

          $vectorVersion = (& (Join-Path $env:ProgramFiles 'Beacon\bin\vector.exe') --version) -join ' '
          if ($LASTEXITCODE -ne 0 -or $vectorVersion -notmatch '^vector 0\.56\.0\b') { throw "the release MSI's vector.exe reported '$vectorVersion'" }

          # The version a user will see, checked against the tag being released.
          $beacon = Join-Path $env:ProgramFiles 'Beacon\bin\beacon.exe'
          $reported = (& $beacon version | Out-String).Trim()
          Write-Output "beacon version: $reported"
          $expected = $env:TAG.TrimStart('v')
          if ($reported -notmatch [regex]::Escape($expected)) {
            throw "the packaged binary reports '$reported', which does not contain the released version $expected"
          }

          $p = Start-Process msiexec.exe -Wait -PassThru -ArgumentList @('/x', $msi, '/qn', '/norestart')
          if ($p.ExitCode -ne 0) { throw "the release MSI failed to uninstall (exit $($p.ExitCode))" }
          exit 0

      - name: Attach the MSI to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          & gh release upload $env:TAG (Get-ChildItem dist\windows -Filter '*.msi').FullName (Get-ChildItem dist\windows -Filter '*.msi.sha256').FullName --repo $env:REPO --clobber
          if ($LASTEXITCODE -ne 0) { throw "uploading the MSI failed" }

  # The signed apt repository (`deb https://<APT_REPO_URL> stable main`), so Debian and Ubuntu hosts
  # can `apt install beacon` and get upgrades with `apt upgrade`.
  #
  # The .deb files are 85-90 MB each, past what a git-backed GitHub Pages repository can hold for
  # long, so the repository lives in an S3-compatible bucket (R2, S3, or GCS through its interop
  # API) served over HTTPS at APT_REPO_URL. The pool keeps every version; only the index is read
  # back. packaging/linux/apt/build-apt-repo.sh checks the published index against the committed
  # public key before re-signing it, so an edited index is never re-signed, and refuses to replace
  # a version that is already published. An older index this key once signed does pass that check;
  # the backfill below re-adds any recent release such a rollback dropped.
  #
  # The packages are the bytes goreleaser published, checked against the attestation the goreleaser
  # job made of what it built, not a rebuild.
  #
  # Skipped with a notice until every APT_* secret and variable exists, and for prerelease tags,
  # which do not belong in `stable`. Serialized so two tags cannot race on the index. GitHub
  # cancels a pending job when a third joins the group, so serializing alone can drop a release;
  # each run therefore also adds recent releases the index is missing (see "Fetch the released
  # .deb files"), and a release whose run was cancelled is published by the next one.
  apt-repository:
    # After goreleaser, whose attestation of the packages it built every package is checked against
    # before it is signed into the index. Not after finalize: its attestations hash the release's
    # replaceable assets, so the apt repository does not rely on them.
    needs: goreleaser
    if: ${{ !cancelled() && needs.goreleaser.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: read
    environment: release
    timeout-minutes: 30
    concurrency:
      group: apt-repository
      cancel-in-progress: false
    env:
      REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.APT_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.APT_S3_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ vars.APT_S3_REGION || 'us-east-1' }}
      # R2 and GCS interop do not accept the CRC checksums newer AWS CLIs send by default.
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      APT_S3_BUCKET: ${{ vars.APT_S3_BUCKET }}
      APT_S3_ENDPOINT: ${{ vars.APT_S3_ENDPOINT }}
      APT_REPO_URL: ${{ vars.APT_REPO_URL }}
      KEYRING_ASC: packaging/linux/apt/beacon-archive-keyring.asc
      # Written only by the goreleaser job's attestation of what it built (see that step).
      APT_DEB_PREDICATE: https://github.com/Asymptote-Labs/agent-beacon/attestations/goreleaser-deb/v1
      # How many recent stable releases each run checks for and adds when the index lacks them.
      APT_BACKFILL_RELEASES: 10
    steps:
      - name: Decide whether to publish
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          missing=""
          for name in APT_GPG_PRIVATE_KEY AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY APT_S3_BUCKET APT_REPO_URL; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::notice title=apt repository skipped::not configured (missing:$missing). The release is unaffected."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$TAG" in
            *-*)
              echo "::notice title=apt repository skipped::$TAG is a prerelease; only releases go to the stable suite."
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          case "$APT_REPO_URL" in
            https://*) ;;
            *) echo "APT_REPO_URL must be https://" >&2; exit 1 ;;
          esac
          # Set only when present: the AWS CLI treats an empty AWS_ENDPOINT_URL as an endpoint.
          if [ -n "$APT_S3_ENDPOINT" ]; then
            echo "AWS_ENDPOINT_URL=$APT_S3_ENDPOINT" >> "$GITHUB_ENV"
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "publish=true" >> "$GITHUB_OUTPUT"

      # Full history and tags: every package is trusted only when its tag's commit is an ancestor
      # of this run's commit (see "Fetch the released .deb files").
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.publish == 'true'
        with:
          fetch-depth: 0

      - name: Install apt repository tools
        if: steps.gate.outputs.publish == 'true'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq apt-utils dpkg-dev gnupg
          aws --version

      # The keyring users install is built from the committed public key file, never exported from
      # the secret, and build-apt-repo.sh fails unless every key in the secret is in that file and
      # signed. Rotating the key is therefore a reviewed commit, not only a secret edit, in two steps:
      #   1. Commit the new public key beside the old one in beacon-archive-keyring.asc and put both
      #      secret keys in APT_GPG_PRIVATE_KEY. Every release then signs the index with both, so
      #      hosts that trust only the old key keep updating, and the published keyring carries
      #      both keys for hosts to fetch again.
      #   2. Once hosts have the new keyring, remove the old key from the file and the secret.
      #      A host that never fetched it fails `apt update` from then on: hosts install the
      #      keyring once and the package does not ship it, so step 1 must last long enough.
      # The published index is checked against every key in the file, and a signature from a key
      # no longer in it is ignored, so each step accepts the index the previous one signed.
      - name: Import the signing keys
        if: steps.gate.outputs.publish == 'true'
        id: key
        run: |
          set -euo pipefail
          [ -f "$KEYRING_ASC" ] || { echo "$KEYRING_ASC is not committed; commit the public key before configuring APT_GPG_PRIVATE_KEY" >&2; exit 1; }
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 0700 "$GNUPGHOME"
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          printf '%s\n' "$APT_GPG_PRIVATE_KEY" | gpg --batch --quiet --import
          # Sign with every key the secret holds, not the keys in the committed file: during step 2
          # of a rotation the file may still be catching up, and a key in the file without its
          # secret cannot sign.
          secret="$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "sec" { want = 1; next } want && $1 == "fpr" { print $10; want = 0 }')"
          [ -n "$secret" ] || { echo "APT_GPG_PRIVATE_KEY holds no secret key" >&2; exit 1; }
          committed="$(gpg --batch --with-colons --show-keys "$KEYRING_ASC" | awk -F: '$1 == "pub" { want = 1; next } want && $1 == "fpr" { print $10; want = 0 }')"
          [ -n "$committed" ] || { echo "no key in $KEYRING_ASC" >&2; exit 1; }
          for fpr in $secret; do
            printf '%s\n' "$committed" | grep -qxF "$fpr" \
              || { echo "the key $fpr in APT_GPG_PRIVATE_KEY is not in $KEYRING_ASC; commit its public key first" >&2; exit 1; }
          done
          gpg --batch --quiet --import "$KEYRING_ASC"
          # shellcheck disable=SC2086 # one fingerprint per word
          gpg --batch --export $committed > "$RUNNER_TEMP/beacon-archive-keyring.gpg"
          echo "fingerprints=$(printf '%s\n' "$secret" | paste -sd' ')" >> "$GITHUB_OUTPUT"
          echo "signing with: $(printf '%s\n' "$secret" | paste -sd' '); trusted keys: $(printf '%s\n' "$committed" | paste -sd' ')"

      # Only the signed index is read back. A missing InRelease is the first publish (or a first
      # publish that stopped before writing it, which this resumes); any other error fails the job
      # rather than starting the repository over. Checking InRelease itself rather than listing
      # the prefix keeps the answer independent of pagination.
      #
      # Each Packages file is read through the by-hash path that InRelease names, never the plain
      # path: by-hash copies are written before InRelease and never replaced, so a publish that
      # stopped partway (plain Packages already new, InRelease still old) leaves them consistent.
      # build-apt-repo.sh checks the signature and these hashes.
      - name: Fetch the published index
        if: steps.gate.outputs.publish == 'true'
        id: existing
        run: |
          set -euo pipefail
          if ! aws s3api head-object --bucket "$APT_S3_BUCKET" --key dists/stable/InRelease >/dev/null 2>"$RUNNER_TEMP/head.err"; then
            if grep -q '(404)' "$RUNNER_TEMP/head.err"; then
              echo "::notice::the bucket has no published InRelease; this is the first publish"
              echo "dir=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            cat "$RUNNER_TEMP/head.err" >&2
            echo "could not check dists/stable/InRelease" >&2
            exit 1
          fi
          dir="$RUNNER_TEMP/apt-existing"
          aws s3 cp --no-progress "s3://$APT_S3_BUCKET/dists/stable/InRelease" "$dir/InRelease"
          for arch in amd64 arm64; do
            rel="main/binary-$arch/Packages"
            want="$(awk -v rel="$rel" '/^[^ ]/ { in_sha = ($0 == "SHA256:"); next } in_sha && $3 == rel { print $1 }' "$dir/InRelease")"
            # An architecture added after the first publish has no index yet.
            [ -n "$want" ] || continue
            case "$want" in *[!0-9a-f]*) echo "malformed SHA256 for $rel in InRelease" >&2; exit 1 ;; esac
            aws s3 cp --no-progress "s3://$APT_S3_BUCKET/dists/stable/main/binary-$arch/by-hash/SHA256/$want" "$dir/$rel"
          done
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      # This tag's packages, plus those of any of the last APT_BACKFILL_RELEASES stable releases up
      # to this one that the index lacks. A concurrency group keeps one job running and one
      # pending, and cancels the pending one when a third tag arrives, so a release tagged close to
      # two others can lose its run; the next run adds it. The same repairs a first publish that
      # stopped partway and an index rolled back in the bucket, within the window.
      - name: Fetch the released .deb files
        if: steps.gate.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.gate.outputs.version }}
          EXISTING: ${{ steps.existing.outputs.dir }}
        run: |
          set -euo pipefail
          published() {
            [ -n "$EXISTING" ] && [ -f "$EXISTING/main/binary-$2/Packages" ] || return 1
            awk -v v="$1" '
              BEGIN { RS = "" }
              {
                p = ver = ""
                n = split($0, line, "\n")
                for (i = 1; i <= n; i++) {
                  if (line[i] ~ /^Package: /) p = substr(line[i], 10)
                  else if (line[i] ~ /^Version: /) ver = substr(line[i], 10)
                }
                if (p == "beacon" && ver == v) found = 1
              }
              END { exit !found }' "$EXISTING/main/binary-$2/Packages"
          }
          # fetch TAG MODE ARCH... -- downloads TAG's .debs for ARCH into dist/apt-debs/TAG. Each must
          # carry the attestation the goreleaser job made of the bytes it built
          # ($APT_DEB_PREDICATE), from this repository's release workflow at refs/tags/TAG: not
          # checksums.txt, which anyone who can edit a release can replace together with the .deb,
          # and not finalize's provenance, which re-hashes those same replaceable assets (see the
          # goreleaser job's attest step). Its control fields must also name beacon,
          # TAG's version and ARCH, since build-apt-repo.sh indexes a package by what it says
          # about itself. This tag's packages (MODE required) must pass; a backfilled release whose
          # package has no such attestation (one from before this check, or a replaced asset) is
          # left out with a warning. A package that is attested but misnamed fails the job.
          #
          # The workflow path and ref alone are not enough: anyone who can push a v* tag can run
          # their own release.yml at that tag (one that attests from a job outside the release
          # environment, or attests anything) and so mint a matching attestation. So TAG's commit must be an ancestor of this run's commit,
          # the history this release was built from, and the attestation must name that commit as
          # both its source and its signer workflow's commit. A tag on a side commit, or one moved
          # since its package was attested, is not trusted. This run's own commit is the trust
          # root, as it already is for everything else this job signs.
          fetch() {
            tag="$1" mode="$2" version="${1#v}" dir="dist/apt-debs/$1"
            shift 2
            if ! commit="$(git rev-parse --verify --quiet "refs/tags/$tag^{commit}")" \
              || ! git merge-base --is-ancestor "$commit" "$GITHUB_SHA"; then
              if [ "$mode" = required ]; then
                echo "$tag does not resolve to a commit in the history of $GITHUB_SHA" >&2
                exit 1
              fi
              echo "::warning title=apt repository::$tag is not in the history of this release ($GITHUB_SHA); its packages are not published"
              return 0
            fi
            mkdir -p "$dir"
            for arch in "$@"; do
              name="beacon_${version}_linux_${arch}.deb"
              deb="$dir/$name"
              gh release download "$tag" --repo "$REPO" --dir "$dir" --pattern "$name"
              if ! gh attestation verify "$deb" --repo "$REPO" \
                --signer-workflow "$REPO/.github/workflows/release.yml" --source-ref "refs/tags/$tag" \
                --source-digest "$commit" --signer-digest "$commit" --predicate-type "$APT_DEB_PREDICATE" \
                --deny-self-hosted-runners > "$RUNNER_TEMP/attestation.log" 2>&1; then
                cat "$RUNNER_TEMP/attestation.log" >&2
                if [ "$mode" = required ]; then
                  echo "$name has no attestation from the goreleaser job of $REPO's release workflow at $tag ($commit)" >&2
                  exit 1
                fi
                echo "::warning title=apt repository::$name has no attestation from the goreleaser job of the release workflow at $tag ($commit); it is not published"
                rm -f "$deb"
                continue
              fi
              for field in "Package=beacon" "Version=$version" "Architecture=$arch"; do
                got="$(dpkg-deb -f "$deb" "${field%%=*}")"
                [ "$got" = "${field#*=}" ] \
                  || { echo "$name from $tag declares ${field%%=*} '$got', expected '${field#*=}'" >&2; exit 1; }
              done
            done
            rmdir "$dir" 2>/dev/null || true
          }
          # This tag's packages are always fetched, so a rerun checks them against the index again.
          fetch "$TAG" required amd64 arm64
          tags="$(gh release list --repo "$REPO" --exclude-drafts --exclude-pre-releases --limit 200 \
            --json tagName --jq '.[].tagName' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true)"
          # Releases up to this one only: a newer tag's assets may still be uploading.
          window="$(printf '%s\n%s\n' "$tags" "$TAG" | grep -v '^$' | sort -uV \
            | awk -v cur="$TAG" '{ print } $0 == cur { exit }' | tail -n "$APT_BACKFILL_RELEASES")"
          for tag in $window; do
            [ "$tag" = "$TAG" ] && continue
            assets="$(gh release view "$tag" --repo "$REPO" --json assets --jq '.assets[].name')"
            missing=""
            for arch in amd64 arm64; do
              # Only what the release has: one without a .deb for an architecture is not retried.
              printf '%s\n' "$assets" | grep -qxF "beacon_${tag#v}_linux_${arch}.deb" || continue
              published "${tag#v}" "$arch" || missing="$missing $arch"
            done
            [ -n "$missing" ] || continue
            echo "::notice::$tag is missing from the apt repository for$missing; adding it"
            # shellcheck disable=SC2086 # one architecture per word
            fetch "$tag" optional $missing
          done

      - name: Build and sign the repository update
        if: steps.gate.outputs.publish == 'true'
        env:
          FINGERPRINTS: ${{ steps.key.outputs.fingerprints }}
          EXISTING: ${{ steps.existing.outputs.dir }}
        run: |
          set -euo pipefail
          set -- --out dist/apt-repo --keyring "$RUNNER_TEMP/beacon-archive-keyring.gpg"
          for fpr in $FINGERPRINTS; do
            set -- "$@" --signing-key "$fpr"
          done
          if [ -n "$EXISTING" ]; then
            set -- "$@" --existing "$EXISTING"
          fi
          sh packaging/linux/apt/build-apt-repo.sh "$@" dist/apt-debs/*/beacon_*.deb
          cp "$KEYRING_ASC" dist/apt-repo/beacon-archive-keyring.asc
          cp "$RUNNER_TEMP/beacon-archive-keyring.gpg" dist/apt-repo/beacon-archive-keyring.gpg

      # Checks what this run stages, not this tag's version: the staged pool holds only packages the
      # index lacked, which on a rerun or after a partial publish need not include this tag's own,
      # and may include backfilled releases. The check against the public URL below covers $VERSION.
      - name: Check the update with apt before publishing
        if: steps.gate.outputs.publish == 'true'
        run: |
          set -euo pipefail
          url="file:$PWD/dist/apt-repo"
          keyring="$RUNNER_TEMP/beacon-archive-keyring.gpg"
          sh packaging/linux/apt/verify-apt-repo.sh "$url" "$keyring" -
          find dist/apt-repo/pool -name '*.deb' 2>/dev/null | sort > "$RUNNER_TEMP/staged"
          if [ ! -s "$RUNNER_TEMP/staged" ]; then
            echo "::notice::every package is already in the apt repository; only the index is republished"
            exit 0
          fi
          while read -r deb; do
            APT_VERIFY_ARCHES="$(dpkg-deb -f "$deb" Architecture)" \
              sh packaging/linux/apt/verify-apt-repo.sh "$url" "$keyring" "$(dpkg-deb -f "$deb" Version)" < /dev/null
          done < "$RUNNER_TEMP/staged"

      # Order matters: packages, then index files, then the signed Release files with InRelease
      # last, so no client is pointed at a file that is not there yet. Packages are immutable and
      # cached for a year; everything under dists/ and the keyring is revalidated on every request.
      - name: Publish to the bucket
        if: steps.gate.outputs.publish == 'true'
        working-directory: dist/apt-repo
        run: |
          set -euo pipefail
          bucket="s3://$APT_S3_BUCKET"
          if [ -d pool ]; then
            aws s3 cp --no-progress --recursive pool "$bucket/pool" \
              --content-type application/vnd.debian.binary-package \
              --cache-control 'public, max-age=31536000, immutable'
          fi
          aws s3 cp --no-progress --recursive dists/stable/main "$bucket/dists/stable/main" \
            --cache-control 'no-cache'
          for f in beacon-archive-keyring.asc beacon-archive-keyring.gpg; do
            aws s3 cp --no-progress "$f" "$bucket/$f" --cache-control 'no-cache'
          done
          for f in Release.gpg Release InRelease; do
            aws s3 cp --no-progress "dists/stable/$f" "$bucket/dists/stable/$f" \
              --content-type text/plain --cache-control 'no-cache'
          done

      - name: Check the published repository with apt
        if: steps.gate.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.gate.outputs.version }}
        run: |
          set -euo pipefail
          sh packaging/linux/apt/verify-apt-repo.sh "${APT_REPO_URL%/}" \
            "$RUNNER_TEMP/beacon-archive-keyring.gpg" "$VERSION"

  # One checksums.txt for everything a user installs, and signed provenance for all of it.
  #
  # goreleaser writes checksums.txt before the .pkg and .msi exist, so they are appended here from the
  # bytes on the release. The attestation is a Sigstore-signed statement, made with this workflow's
  # OIDC identity, that this repository's release workflow built each file at this tag; anyone can
  # check a download with `gh attestation verify <file> --repo Asymptote-Labs/agent-beacon`. Unlike
  # checksums.txt, it cannot be replaced by someone who can only edit the release. It does hash the
  # release's assets as they are when this job runs, though, so it vouches for what the release
  # held then; the apt repository relies on the goreleaser job's attestation of its own output.
  #
  # Runs when goreleaser succeeded even if a packaging job failed, so the archives and Linux packages
  # are still covered; a missing .pkg or .msi is simply not appended.
  finalize:
    needs: [goreleaser, package, windows-package]
    if: ${{ !cancelled() && needs.goreleaser.result == 'success' }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Add the .pkg, .msi and install.sh to checksums.txt
        run: |
          set -euo pipefail
          mkdir -p dist/release && cd dist/release
          gh release download "$TAG" --repo "$REPO" --pattern checksums.txt
          # install.sh is what `curl -fsSL https://beacon.sh/install.sh | bash` runs (beacon.sh
          # redirects to this release's copy), so it is attested like the packages it installs.
          for pattern in 'BeaconEndpointAgent-*.pkg' 'BeaconEndpointAgent-*.msi' 'install.sh'; do
            gh release download "$TAG" --repo "$REPO" --pattern "$pattern" || echo "::warning::no $pattern on the release"
          done
          for f in BeaconEndpointAgent-*.pkg BeaconEndpointAgent-*.msi install.sh; do
            [ -f "$f" ] || continue
            # A rerun must not list a file twice: install.sh refuses a name with two checksums.
            awk -v name="$f" '$2 == name { found = 1 } END { exit found }' checksums.txt || continue
            sha256sum "$f" >> checksums.txt
          done
          sha256sum --check checksums.txt --ignore-missing

      # GoReleaser already signed the checksums.txt it published. The step above extends it, so it is
      # signed again here before anything is uploaded; a failure before the upload leaves GoReleaser's
      # matching pair in place. GitHub replaces release assets one at a time, so the two uploads below
      # leave a few seconds in which a client can pair files from different uploads (install.sh and
      # the self-updater fetch both again once before refusing), and a failure between them would
      # leave a mismatched pair on a public release. So the step reads back what is published and
      # re-uploads until the pair on the release is exactly what was signed and gpgv accepts it,
      # failing loudly if it never is. Inert, like the package signing, until the
      # BEACON_LINUX_SIGNING_KEY secret exists.
      - name: Sign and upload checksums.txt
        working-directory: dist/release
        env:
          BEACON_LINUX_SIGNING_KEY: ${{ secrets.BEACON_LINUX_SIGNING_KEY }}
          BEACON_LINUX_SIGNING_KEY_PASSPHRASE: ${{ secrets.BEACON_LINUX_SIGNING_KEY_PASSPHRASE }}
        run: |
          set -euo pipefail
          # The pin is what the goreleaser before-hook stamped into this release's install.sh.
          pinned=""
          if [ -f install.sh ]; then
            pinned="$(sed -n 's/^release_key_fingerprints=//p' install.sh | tr -d '\r' | tr a-f A-F)"
          elif [ -n "$BEACON_LINUX_SIGNING_KEY" ]; then
            echo "::error title=install.sh missing::cannot read the pinned release key without the release's install.sh."
            exit 1
          fi
          if [ -z "$BEACON_LINUX_SIGNING_KEY" ]; then
            if [ -n "$pinned" ]; then
              echo "::error title=Linux signing key missing::this release pins ${pinned} but BEACON_LINUX_SIGNING_KEY is not configured."
              exit 1
            fi
            echo "::notice title=Linux signing skipped::BEACON_LINUX_SIGNING_KEY is not configured, so checksums.txt is unsigned."
            gh release upload "$TAG" checksums.txt --repo "$REPO" --clobber
            exit 0
          fi
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 0700 "$GNUPGHOME"
          printf '%s\n' "$BEACON_LINUX_SIGNING_KEY" | gpg --batch --import
          fpr="$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "fpr" { print $10; exit }')"
          if [ -n "$pinned" ] && ! printf '%s\n' "$pinned" | tr , '\n' | grep -qxF "$(printf '%s' "$fpr" | tr a-f A-F)"; then
            echo "::error title=Signing key not pinned::BEACON_LINUX_SIGNING_KEY is ${fpr}, which release-key.fingerprint (${pinned}) does not list."
            exit 1
          fi
          printf '%s' "$BEACON_LINUX_SIGNING_KEY_PASSPHRASE" | gpg --batch --pinentry-mode loopback --passphrase-fd 0 \
            --local-user "$fpr" --output checksums.txt.sig --detach-sign checksums.txt
          # Check against the public key GoReleaser attached, the one installers download.
          gh release download "$TAG" --repo "$REPO" --pattern beacon-release-key.gpg --clobber
          gpgv --keyring "$PWD/beacon-release-key.gpg" checksums.txt.sig checksums.txt
          published="$RUNNER_TEMP/published"
          for attempt in 1 2 3; do
            # checksums.txt first: its old signature then fails for at most the one upload, and a
            # signature is never published ahead of the file it covers.
            gh release upload "$TAG" checksums.txt --repo "$REPO" --clobber &&
              gh release upload "$TAG" checksums.txt.sig --repo "$REPO" --clobber ||
              echo "::warning::upload attempt ${attempt} failed"
            rm -rf "$published" && mkdir -p "$published"
            if gh release download "$TAG" --repo "$REPO" --dir "$published" \
                --pattern checksums.txt --pattern checksums.txt.sig &&
              cmp -s checksums.txt "$published/checksums.txt" &&
              cmp -s checksums.txt.sig "$published/checksums.txt.sig" &&
              gpgv --keyring "$PWD/beacon-release-key.gpg" "$published/checksums.txt.sig" "$published/checksums.txt"; then
              exit 0
            fi
            echo "::warning::the published checksums.txt and checksums.txt.sig do not match what was signed (attempt ${attempt})"
            sleep $((attempt * 5))
          done
          echo "::error title=checksums.txt and its signature do not match::${TAG} is left with a checksums.txt and checksums.txt.sig that pinned installers refuse. Rerun this job."
          exit 1

      - name: Download every file checksums.txt lists
        working-directory: dist/release
        run: |
          set -euo pipefail
          awk '{ print $2 }' checksums.txt | while read -r name; do
            [ -f "$name" ] || gh release download "$TAG" --repo "$REPO" --pattern "$name"
          done
          sha256sum --check --strict checksums.txt

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/release/checksums.txt
