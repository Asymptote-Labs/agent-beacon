name: Claude Code Review

# Claude reviews each ready-for-review PR for bugs and posts inline comments plus a summary.
# Setup: add the ANTHROPIC_API_KEY secret (repo or org). CLAUDE_CODE_OAUTH_TOKEN works
# instead via the claude_code_oauth_token input.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Skip drafts, fork PRs, and Dependabot (none of them get this repo's secrets).
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Workflow token: comments come from github-actions[bot] and no GitHub App is needed.
          # To post as claude[bot], install the Claude GitHub App, drop this, and add id-token: write.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # The action refuses bot actors by default; let pushes from the Claude app be reviewed.
          allowed_bots: "claude[bot]"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request for bugs. The PR branch is already checked out in the
            current working directory. This repo is mostly Go (cli/, collector-builder/, pkg/)
            with TypeScript (packages/, plugins/, browser-extension/). Read CLAUDE.md and
            AGENTS.md first and check the change against the invariants they state, for example
            that hooks never touch the network and that embedded or mirrored copies stay identical.

            Focus only on:
            - Correctness bugs: wrong logic, off-by-one errors, nil dereferences, wrong units or types.
            - Regressions: behavior this change breaks for existing users, configs, data, or tests.
            - Edge cases: empty or missing input, concurrency and races, partial failure, OS differences.
            - Missing or swallowed error handling, and leaked files, processes, or goroutines.

            Do not comment on style, formatting, naming, or other nits, and do not summarize what
            the PR does. Report only issues you are confident are real, and say how each one is
            triggered.

            Read the change with `gh pr diff ${{ github.event.pull_request.number }}` and
            `gh pr view ${{ github.event.pull_request.number }} --json title,body,author,baseRefName,headRefName,files`.
            Plain `gh pr view` fails here: this job can't read check statuses.
            Post each issue as an inline comment on the relevant line with
            `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`).
            Then post one short summary with `gh pr comment`: the issues found, or one line saying
            no bugs were found.
            Only post GitHub comments - don't submit review text as messages.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
