id: recursive-root-delete
spec: threat-rules/v1.3  # needed for the commands a carrier or a pipe hands a shell
version: 6
title: Recursive delete targeting a sensitive root path
description: >
  A recursive or forced `rm` with an operand that is a filesystem root, home, or a
  bare wildcard — a destructive command an autonomous agent should not run
  unprompted. The command line is read as bash, so a path under home (`~/project`)
  or the same text inside a quoted string or a here-document does not fire, and the
  rm that `ssh host`, `docker exec`, `eval`, `find -exec` or a script echoed into a
  shell runs does; where the parser cannot see into a command (a line that does not
  parse or was cut, a script handed the rm as its argument), the text that reaches
  that command is matched instead (unread_text).
severity: critical
status: stable
posture: detect
taxonomy:
  beacon_category: risky-command
  owasp_llm: LLM08

# rm is any word of a command (sudo, timeout and xargs wrappers still count). The operands
# are read as written (argv_raw), since ~, $HOME and /* are words whose value the parse
# leaves unknown. The text half asks the same of an operand in the text: a root, home or bare
# wildcard, and not a path under one (`~/.cache`).
match: >
  e.event.action == "command.executed" && (
    e.command.parsed_commands.exists(c,
      c.argv.exists(a, a.matches("(?i)(^|/)rm$")) &&
      c.argv.exists(a, a.matches("^-[a-zA-Z]*[rRfF][a-zA-Z]*$") || a in ["--recursive", "--force"]) &&
      c.argv_raw.exists(a, a == "*" ||
        a.matches("^([\"']?(~|\\$HOME|\\$\\{HOME\\})[\"']?/*|[\"']?/+[\"']?)\\*?$"))) ||
    unread_text(e, t, t.matches("(?i)\\brm(\\s+-{1,2}[a-z-]+)*\\s+-[a-z]*[rf][a-z]*[^;&|\\n]*?\\s(/+|\"/+\"|'/+'|(~|\\$HOME|\\$\\{HOME\\})/*|\"(\\$HOME|\\$\\{HOME\\})\"/*|\"(\\$HOME|\\$\\{HOME\\})/*\"|\\*)\\*?(\\s|$|[;&|)])"))
  )

emit:
  reason: "Recursive rm targeting a root, home, or wildcard path"

tests:
  - name: rm_rf_root_run_by_an_inline_script
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "python3 -c \"import os; os.system('rm -rf /')\"" }
        session: { id: s1 }
  - name: rm_rf_root_as_words_of_an_inline_script
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "python3 - <<'EOF'\nimport subprocess\nsubprocess.run(['rm', '-rf', '/'], check=True)\nEOF" }
        session: { id: s1 }
  - name: rm_rf_root_printed_by_an_inline_script
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "python3 -c \"print('never run rm -rf /')\"" }
        session: { id: s1 }
  - name: rm_rf_root_on_another_host
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "ssh root@host.example 'rm -rf /'" }
        session: { id: s1 }
  - name: rm_rf_root_in_a_container
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "docker exec -u root web rm -rf /" }
        session: { id: s1 }
  - name: rm_rf_root_echoed_into_a_shell
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "echo 'rm -rf /' | sudo sh" }
        session: { id: s1 }
  - name: rm_rf_root_given_to_eval
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "eval 'rm -rf /'" }
        session: { id: s1 }
  - name: rm_rf_root_behind_a_runner
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "caffeinate -i rm -rf ~" }
        session: { id: s1 }
  - name: rm_rf_root_echoed_and_not_run
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "echo 'rm -rf /' | tee notes.txt" }
        session: { id: s1 }
  - name: rm_rf_root
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "rm -rf /" }
        session: { id: s1 }
  - name: rm_rf_root_uppercase_binary
    # The structured match's own binary-name regex was case-sensitive, so this parsed to a
    # non-empty parsed_commands list with argv[0]="RM" and was never caught by either branch: the
    # structured one required a literal lowercase "rm", and the text fallback (which does have
    # (?i)) only ran when parsed_commands was empty.
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "RM -rf /" }
        session: { id: s1 }
  - name: rm_rf_home
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "rm -fr ~/ " }
        session: { id: s1 }
  - name: rm_rf_root_glob
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "rm -rf /*" }
        session: { id: s1 }
  - name: rm_rf_no_preserve_root
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "rm -rf --no-preserve-root /" }
        session: { id: s1 }
  - name: rm_separate_flags_root
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "sudo rm -r -f /" }
        session: { id: s1 }
  - name: rm_rf_root_subdir_glob
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "rm -rf /var/log/*" }
        session: { id: s1 }
  - name: rm_rf_local_build
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "rm -rf ./build/cache" }
        session: { id: s1 }
  - name: rm_rf_quoted_home
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "rm -rf \"$HOME\"" }
        session: { id: s1 }
  - name: rm_rf_root_not_first_operand
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "rm -rf ./build /" }
        session: { id: s1 }
  - name: rm_long_options_root
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "rm --recursive --force /" }
        session: { id: s1 }
  - name: unparseable_capture_falls_back_to_text
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "rm -rf / )" }
        session: { id: s1 }
  - name: rm_rf_root_given_to_a_project_script
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "./cleanup.sh --then rm -rf /" }
        session: { id: s1 }
  - name: capture_cut_inside_a_loop
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "cd /srv && for d in a b; do rm -rf / " }
        session: { id: s1 }
  - name: rm_rf_under_home_given_to_a_project_script
    # The text half took `~/` followed by anything for home until version 6, as the parsed
    # half never did.
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "./cleanup.sh --then rm -rf ~/.cache/pip" }
        session: { id: s1 }
  - name: rm_rf_root_after_other_operands_given_to_a_project_script
    verdict: match
    events:
      - event: { action: command.executed }
        command: { command: "./cleanup.sh --then rm -rf --no-preserve-root ./build /" }
        session: { id: s1 }
  - name: rm_rf_root_in_a_comment
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "# rm -rf / would wipe the host" }
        session: { id: s1 }
  - name: rm_rf_root_in_a_commit_message_beside_a_project_script
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "git commit -m 'never rm -rf / here' && ./run-tests.sh" }
        session: { id: s1 }
  - name: rm_rf_under_home
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "rm -rf ~/project/build" }
        session: { id: s1 }
  - name: rm_rf_under_home_variable
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "rm -rf $HOME/.cache/pip" }
        session: { id: s1 }
  - name: pattern_in_quoted_string
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "echo \"never run rm -rf / on a host\"" }
        session: { id: s1 }
  - name: pattern_in_heredoc_body
    verdict: no_match
    events:
      - event: { action: command.executed }
        command: { command: "cat > NOTES.md <<'EOF'\nrm -rf /\nEOF" }
        session: { id: s1 }
