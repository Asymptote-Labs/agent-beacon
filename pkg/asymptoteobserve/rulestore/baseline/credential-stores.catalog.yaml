# The credential stores threat rules share. One definition, reviewed here, instead of a list
# copied into each rule: the expressions rules and queries use are generated from this file, and
# credential-stores.md beside it is its generated reference.
#
# A store is files (match, exclude) or commands that hand a credential over (commands), with
# examples that prove it: paths for files, command lines for commands. Loading the catalog checks
# every example and counterexample, so a change that breaks one does not load.
#
# Path patterns (pkg/asymptoteobserve/concepts): a pattern names a file by the last components
# of its path, in any directory. Letters match without regard to case. `*` is any run of
# characters within a component, `{a,b,}` one of the alternatives, a component `**` any number of
# directories, and a trailing `/**` everything under a directory.
#
# Commands: `name` is the command after sudo and the like, `words` are words that follow each
# other somewhere after it, and `flags` are options of which one must be there. One letter is a
# short option, alone or in a cluster, in its own case (w is -w and -aw, not -W); anything else
# is a whole option word, which may carry =value. Each is a pattern component, so `gpg{,2}` and
# `--export-secret-k*` work as they do in a path.
#
# tier: definite for a file that exists to hold a credential or a command that prints one,
# likely for what often holds one and often does not. Detection uses both; anything that blocks
# should use definite.
#
# predicates: the names a rule calls this catalog by. credential_path(e.file.path) is true for a
# path that is a store of files, credential_command(c) for a parsed command that reads a store
# of commands, and credential_mention(e.command.command) for a text that names a store of files
# (a command line that does not parse, a prompt handed to another program).
# credential_command_redacted(e.command.command) is true for a command line as a log holds it
# when redaction took the name of a command that reads a store of commands: what is left of
# TOKEN=$(gh auth token) is "TOKEN=[REDACTED] auth token)". Each takes a tier and then kinds
# after its subject: credential_path(f.path, "definite"),
# credential_command(c, "likely", "keychain").
catalog: credential-stores
version: 1
spec: threat-rules/v1.3
description: >
  Where credentials are kept and how they are got out: the files that hold them, by path, and
  the commands that hand them over. It is what a threat rule means when it says an agent read a
  credential.

predicates:
  path: credential_path
  command: credential_command
  mention: credential_mention
  redacted: credential_command_redacted

kinds:
  - {id: cloud, title: Cloud provider credentials}
  - {id: ssh, title: SSH keys and agents}
  - {id: dotenv, title: Environment files}
  - {id: source-control, title: Source control credentials}
  - {id: registry, title: Package and container registry credentials}
  - {id: network, title: Network and database client credentials}
  - {id: infrastructure, title: Infrastructure state and provisioning credentials}
  - {id: generic, title: Files named for what they hold}
  - {id: kubernetes, title: Kubernetes credentials}
  - {id: gpg, title: GnuPG keyrings}
  - {id: password-manager, title: Password manager stores}
  - {id: browser, title: Browser session stores}
  - {id: keychain, title: Operating system keychains and secret services}
  - {id: cli-token, title: Tokens a signed-in CLI prints}

stores:
  # --- cloud ---
  - id: aws-shared-credentials
    title: AWS shared credentials file
    kind: cloud
    tier: definite
    match: [".aws/credentials"]
    examples: ["/home/u/.aws/credentials", "~/.aws/credentials", "C:\\Users\\u\\.aws\\credentials"]
    counterexamples: ["/home/u/.aws/config", "/repo/docs/aws/credentials.md", "/home/u/my.aws/credentials.bak"]

  - id: gcloud-application-default-credentials
    title: Google Cloud application default credentials
    kind: cloud
    tier: definite
    match: ["application_default_credentials.json"]
    examples: ["/home/u/.config/gcloud/application_default_credentials.json"]
    counterexamples: ["/home/u/.config/gcloud/configurations/config_default"]

  - id: gcloud-credential-db
    title: Google Cloud SDK credential and access token databases
    kind: cloud
    tier: definite
    match: [".config/gcloud/{credentials,access_tokens}.db"]
    examples: ["/home/u/.config/gcloud/credentials.db", "$HOME/.config/gcloud/access_tokens.db"]
    counterexamples: ["/home/u/.config/gcloud/logs/2026.11.11/log.db", "/srv/app/credentials.db"]

  - id: azure-cli-token-cache
    title: Azure CLI token caches
    kind: cloud
    tier: definite
    match: [".azure/{msal_token_cache,accesstokens}.json"]
    examples: ["/home/u/.azure/msal_token_cache.json", "/home/u/.azure/accessTokens.json"]
    counterexamples: ["/home/u/.azure/azureProfile.json"]

  # --- ssh ---
  - id: ssh-private-key
    title: SSH private key, by the name ssh-keygen gives it
    kind: ssh
    tier: definite
    match:
      - "id_{rsa,ed25519,ecdsa,dsa,ecdsa_sk,ed25519_sk}"
    examples: ["/home/u/.ssh/id_rsa", "~/.ssh/id_ed25519", "/backup/keys/id_ecdsa", "/home/u/.ssh/id_ed25519_sk"]
    counterexamples:
      - "/home/u/.ssh/id_rsa.pub"
      - "/home/u/.ssh/known_hosts"
      - "/home/u/.ssh/config"
      - "/home/u/.ssh/authorized_keys"
      - "/repo/src/id_rsa_test.go"

  - id: ssh-key-file
    title: SSH private key under another name, in the SSH directory
    kind: ssh
    tier: definite
    match:
      - ".ssh/id_*"
    exclude: ["*.pub"]
    examples: ["/home/u/.ssh/id_github_deploy", "~/.ssh/id_work"]
    counterexamples:
      - "/home/u/.ssh/id_github_deploy.pub"
      - "/home/u/.ssh/id_rsa.pub"
      - "/repo/keys/id_github_deploy"

  - id: ssh-agent-keys
    title: Keys loaded in the SSH agent, listed
    kind: ssh
    tier: likely
    commands:
      - {name: ssh-add, flags: [l, L]}
    examples: ["ssh-add -l", "ssh-add -L", "SSH_AUTH_SOCK=/tmp/agent.sock ssh-add -l", "ssh-add -E md5 -l"]
    counterexamples:
      - "ssh-add ~/.ssh/deploy-lab"
      - "ssh-add --apple-load-keychain"
      - "ssh-add ~/.ssh/id_ed25519\nls -la ~/.ssh"
      - "ssh user@host"

  # --- dotenv ---
  - id: dotenv
    title: Environment file
    kind: dotenv
    tier: definite
    match: [".env"]
    examples: ["/repo/.env", ".env", "apps/web/.env"]
    counterexamples: ["/repo/.envrc", "/repo/src/env.ts", "/repo/docs/dotenv.md", "/repo/.environment"]

  - id: dotenv-variant
    title: Environment file for one environment or machine
    kind: dotenv
    tier: likely
    match: [".env.*"]
    exclude:
      - ".env.{example,sample,template,dist}"
      - ".env.*.{example,sample,template,dist}"
    examples: ["/repo/.env.production", "/repo/.env.local", "/repo/.env.development.local"]
    counterexamples: ["/repo/.env.example", "/repo/.env.sample", "/repo/.env.local.example", "/repo/.env.production.template"]

  # --- source control ---
  - id: git-credential-store
    title: Git credential store
    kind: source-control
    tier: definite
    match: [".git-credentials", ".config/git/credentials"]
    examples: ["/home/u/.git-credentials", "/home/u/.config/git/credentials"]
    counterexamples: ["/home/u/.gitconfig", "/home/u/.config/git/config", "/repo/.gitignore"]

  - id: github-cli-hosts
    title: GitHub CLI host configuration, which holds its token unless a keyring does
    kind: source-control
    tier: likely
    match: [".config/gh/hosts.yml"]
    examples: ["/home/u/.config/gh/hosts.yml"]
    counterexamples: ["/home/u/.config/gh/config.yml", "/etc/ansible/hosts.yml"]

  # --- registry ---
  - id: npmrc
    title: npm configuration, which holds registry tokens when it holds any
    kind: registry
    tier: likely
    match: [".npmrc"]
    examples: ["/home/u/.npmrc", "/repo/.npmrc"]
    counterexamples: ["/repo/package.json", "/repo/.nvmrc"]

  - id: pypirc
    title: PyPI upload credentials
    kind: registry
    tier: definite
    match: [".pypirc"]
    examples: ["/home/u/.pypirc"]
    counterexamples: ["/repo/pyproject.toml", "/home/u/.config/pip/pip.conf"]

  - id: docker-config
    title: Docker client configuration, which holds registry logins unless a credential helper does
    kind: registry
    tier: likely
    match: [".docker/config.json"]
    examples: ["/home/u/.docker/config.json"]
    counterexamples: ["/repo/config.json", "/home/u/.docker/daemon.json", "/repo/docker/config.json"]

  # --- network and database clients ---
  - id: netrc
    title: netrc machine logins
    kind: network
    tier: definite
    match: [".netrc"]
    examples: ["/home/u/.netrc", "~/.netrc"]
    counterexamples: ["/home/u/.curlrc", "/repo/docs/netrc.md"]

  - id: pgpass
    title: PostgreSQL password file
    kind: network
    tier: definite
    match: [".pgpass"]
    examples: ["/home/u/.pgpass"]
    counterexamples: ["/home/u/.psqlrc", "/repo/pgpass.example.txt"]

  # --- infrastructure ---
  - id: terraform-state
    title: Terraform state, which records resource secrets in clear text
    kind: infrastructure
    tier: likely
    match: ["*.tfstate", "*.tfstate.backup"]
    examples: ["/repo/terraform.tfstate", "/repo/infra/prod.tfstate.backup"]
    counterexamples: ["/repo/main.tf", "/repo/.terraform.lock.hcl", "/repo/docs/tfstate.md"]

  - id: terraform-cli-credentials
    title: Terraform CLI credentials
    kind: infrastructure
    tier: definite
    match: [".terraform.d/credentials.tfrc.json"]
    examples: ["/home/u/.terraform.d/credentials.tfrc.json"]
    counterexamples: ["/home/u/.terraform.d/checkpoint_cache", "/home/u/.terraformrc"]

  # --- generic ---
  - id: credentials-file
    title: A file named credentials
    kind: generic
    tier: likely
    match: ["credentials", "credentials.{json,toml}"]
    examples: ["/srv/app/credentials", "/srv/app/credentials.json", "/home/u/.cargo/credentials.toml"]
    counterexamples: ["/repo/docs/credentials.md", "/repo/src/credentials.ts", "/repo/src/credentials/index.ts", "/repo/test_credentials.json"]

  - id: secrets-file
    title: A data file named secrets
    kind: generic
    tier: likely
    match: ["secrets.{yaml,yml,json}"]
    examples: ["/repo/config/secrets.yaml", "/repo/secrets.yml", "/srv/app/secrets.json"]
    counterexamples: ["/repo/src/secrets.ts", "/repo/docs/secrets.md", "/repo/secrets/README.md", "/repo/secrets.yaml.example"]

  # --- kubernetes ---
  - id: kubeconfig
    title: Kubernetes client configuration, which holds cluster credentials or names where they are
    kind: kubernetes
    tier: likely
    match:
      - ".kube/config"
      - ".kube/config-*"
      - "kubeconfig"
      - "kubeconfig.{yaml,yml}"
      - ".kube/*kubeconfig*"
    examples:
      - "/home/u/.kube/config"
      - "/home/u/.kube/config-prod"
      - "/repo/kubeconfig"
      - "/repo/deploy/kubeconfig.yaml"
      - "/home/u/.kube/prod-kubeconfig.yml"
    counterexamples: ["/home/u/.kube/cache/discovery/api.json", "/repo/config", "/repo/docs/kubeconfig.md"]

  - id: kubernetes-token-file
    title: A file named for a Kubernetes or cluster token
    kind: kubernetes
    tier: likely
    match:
      - "{sa,kube,kubernetes,k8s,cluster,admin,user,deploy,bootstrap}{-,_,}token{,.csv}"
      - "service{-,_,}account{-,_,}token{,.csv}"
      - ".kube/**/*token*"
    examples:
      - "/etc/kubernetes/admin-token"
      - "/srv/sa_token.csv"
      - "/srv/k8stoken"
      - "/srv/service-account-token"
      - "/home/u/.kube/cache/oidc-login/id-token.json"
    counterexamples: ["/repo/src/token.go", "/repo/tokens.json", "/repo/docs/admin-token.md"]

  - id: kubernetes-service-account-token
    title: Mounted Kubernetes service account token
    kind: kubernetes
    tier: definite
    match: ["var/run/secrets/kubernetes.io/serviceaccount/token"]
    examples: ["/var/run/secrets/kubernetes.io/serviceaccount/token"]
    counterexamples:
      - "/var/run/secrets/kubernetes.io/serviceaccount/namespace"
      - "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"

  # --- gpg ---
  - id: gpg-private-keys
    title: GnuPG private keys
    kind: gpg
    tier: definite
    match: [".gnupg/private-keys-v1.d/**", "secring.gpg"]
    examples: ["/home/u/.gnupg/private-keys-v1.d/0A1B2C3D.key", "/home/u/.gnupg/secring.gpg"]
    counterexamples: ["/home/u/.gnupg/pubring.kbx", "/home/u/.gnupg/trustdb.gpg", "/home/u/.gnupg/gpg.conf"]

  - id: gpg-key-material
    title: GnuPG revocation certificates and exported key files
    kind: gpg
    tier: likely
    match: [".gnupg/openpgp-revocs.d/**", ".gnupg/*.key"]
    examples: ["/home/u/.gnupg/openpgp-revocs.d/0A1B2C3D.rev", "/home/u/.gnupg/backup.key"]
    counterexamples: ["/home/u/.gnupg/pubring.kbx~", "/repo/keys/public.key"]

  - id: gpg-secret-key-export
    title: GnuPG secret keys exported
    kind: gpg
    tier: definite
    commands:
      - {name: "gpg{,2}", flags: ["--export-secret-k*", "--export-secret-sub*"]}
    examples:
      - "gpg --export-secret-keys --armor 0xDEADBEEF"
      - "gpg --export-secret-subkeys 0xCAFEBABE > /tmp/keys.asc"
      - "gpg2 --export-secret-keys --armor > all.asc"
      - "gpg --armor --export-secret-k ABCDEF12"
      - "sudo gpg --export-secret-sub ABCDEF12! > sub.asc"
    counterexamples:
      - "gpg --armor --export ABCDEF12 > pub.asc"
      - "gpg --list-secret-keys"
      - "gpg --verify release.tar.gz.asc"
      - "echo gpg --export-secret-keys"

  # --- password managers ---
  - id: keepass-database
    title: KeePass database
    kind: password-manager
    tier: definite
    match: ["*.kdbx"]
    examples: ["/home/u/Documents/Passwords.kdbx"]
    counterexamples: ["/home/u/Documents/Passwords.txt", "/repo/docs/kdbx.md"]

  - id: pass-store
    title: pass password store
    kind: password-manager
    tier: definite
    match: [".password-store/**"]
    examples: ["/home/u/.password-store/work/github.gpg", "/home/u/.password-store/.gpg-id"]
    counterexamples: ["/home/u/password-store.md"]

  - id: password-manager-data
    title: 1Password, Bitwarden and LastPass local data
    kind: password-manager
    tier: likely
    match:
      - "{.1password,1Password}/**"
      - ".config/Bitwarden/**"
      - "{.lastpass,LastPass}/**"
      - ".bitwarden/**"
      - ".config/Bitwarden*.sqlite"
      - ".config/Bitwarden*.sqlite.*"
    examples:
      - "/home/u/.1password/agent.sock"
      - "/home/u/.config/1Password/settings/settings.json"
      - "/home/u/.config/Bitwarden/data.json"
      - "/home/u/.lastpass/session_privatekey"
      - "/home/u/.bitwarden/data.json"
      - "/home/u/.config/Bitwarden CLI.sqlite"
      - "/home/u/.config/Bitwarden.sqlite.3"
    counterexamples: ["/repo/docs/1password.md", "/repo/src/bitwarden/client.ts"]

  # --- browsers ---
  - id: firefox-session-store
    title: Firefox cookies and saved logins
    kind: browser
    tier: definite
    match: ["cookies.sqlite", "logins.json"]
    examples:
      - "/home/u/.mozilla/firefox/abc123.default-release/cookies.sqlite"
      - "/home/u/.mozilla/firefox/abc123.default-release/logins.json"
    counterexamples: ["/home/u/.mozilla/firefox/abc123.default-release/places.sqlite", "/repo/docs/cookies.md"]

  - id: browser-profile-session-store
    title: Cookies and saved logins in a browser profile
    kind: browser
    tier: definite
    match:
      - "{google-chrome,chromium,chrome,brave-browser,brave browser,bravebrowser,bravesoftware,microsoft-edge,microsoft edge,microsoftedge,edge,firefox,mozilla,safari}{,-beta, beta,-dev, dev,-canary, canary,-unstable, unstable,-sxs, sxs}/**/{*cookies,*login data}"
    examples:
      - "/home/u/.config/google-chrome/Default/Cookies"
      - "/Users/u/Library/Application Support/Google/Chrome/Default/Login Data"
      - "/home/u/.config/BraveSoftware/Brave-Browser/Default/Cookies"
      - "/Users/u/Library/Application Support/Microsoft Edge Beta/Default/Extension Cookies"
      - "C:\\Users\\u\\AppData\\Local\\Google\\Chrome SxS\\User Data\\Default\\Network\\Cookies"
    counterexamples:
      - "/home/u/.config/google-chrome/Default/Preferences"
      - "/repo/chrome-extension/manifest.json"
      - "/repo/src/cookies"

  # --- keychains ---
  - id: macos-keychain
    title: macOS keychain passwords, printed
    kind: keychain
    tier: definite
    commands:
      - {name: security, words: ["find-{generic,internet}-password"], flags: [w, g]}
      - {name: security, words: [dump-keychain], flags: [d]}
    examples:
      - "security find-generic-password -s 'GitHub' -w"
      - "security find-internet-password -s github.com -g"
      - "security dump-keychain -d ~/Library/Keychains/login.keychain-db"
      - "TOKEN=$(security find-generic-password -a me -s npm -w) && echo ok"
    counterexamples:
      - "security find-generic-password -s 'GitHub'"
      - "security find-generic-password -s build -G ci-label"
      - "security find-generic-password -s build -aG me"
      - "security find-identity -v -p codesigning"
      - "security dump-keychain"
      - "man security | grep -- -w"

  - id: linux-secret-service
    title: Secret Service and KWallet secrets, looked up
    kind: keychain
    tier: definite
    commands:
      - {name: secret-tool, words: ["{lookup,search}"]}
      - {name: kwallet-query, flags: [r, --read-password]}
    examples:
      - "secret-tool lookup service github"
      - "secret-tool search --all service github"
      - "kwallet-query -r github kdewallet"
      - "kwallet-query --read-password github kdewallet"
    counterexamples:
      - "secret-tool store --label=x service x"
      - "kwallet-query -l kdewallet"

  - id: windows-credential-manager
    title: Windows Credential Manager and SecretManagement secrets, printed
    kind: keychain
    tier: definite
    commands:
      - {name: "vaultcmd{,.exe}", words: ["/listcreds*"]}
      - {name: get-storedcredential}
      - {name: get-secret, flags: ["-asplaintext"]}
    examples:
      - "vaultcmd /listcreds:\"Windows Credentials\" /all"
      - "Get-StoredCredential -Target github"
      - "Get-Secret -Name GitHubToken -AsPlainText"
    counterexamples:
      - "cmdkey /list"
      - "Get-Secret -Name GitHubToken"
      - "vaultcmd /list"

  # --- tokens a signed-in CLI prints ---
  - id: gcloud-token
    title: Google Cloud access or identity token
    kind: cli-token
    tier: definite
    commands:
      - {name: gcloud, words: [auth, "print-{access,identity}-token"]}
      - {name: gcloud, words: [auth, application-default, "print-{access,identity}-token"]}
    examples:
      - "gcloud auth print-access-token"
      - "gcloud auth print-identity-token --audiences=https://x.example"
      - "gcloud auth application-default print-access-token"
      - "gcloud --project p auth print-access-token"
      - "curl -H \"Authorization: Bearer $(gcloud auth print-access-token)\" https://storage.googleapis.com/storage/v1/b"
    counterexamples:
      - "gcloud auth list"
      - "gcloud auth login"
      - "grep -rn 'print-access-token' docs/"
      - "echo 'gcloud auth print-access-token'"

  - id: github-cli-token
    title: GitHub CLI token
    kind: cli-token
    tier: definite
    commands:
      - {name: gh, words: [auth, token]}
    examples:
      - "gh auth token"
      - "gh auth token | docker login ghcr.io -u me --password-stdin"
      - "GH_TOKEN=$(gh auth token) ./scripts/release.sh"
      - "curl -H \"Authorization: token $(gh auth token)\" https://api.github.com/user"
    counterexamples:
      - "gh auth status"
      - "gh issue create --title \"auth token\""
      - "gh token auth"

  - id: aws-credential-export
    title: AWS credentials exported by the CLI
    kind: cli-token
    tier: definite
    commands:
      - {name: aws, words: [configure, export-credentials]}
    examples: ["aws configure export-credentials --format env", "aws --profile prod configure export-credentials"]
    counterexamples: ["aws sts get-caller-identity", "aws configure list"]

  - id: azure-cli-token
    title: Azure access token
    kind: cli-token
    tier: definite
    commands:
      - {name: az, words: [account, get-access-token]}
    examples: ["az account get-access-token --resource https://management.azure.com"]
    counterexamples: ["az account show", "az account list"]

  - id: vault-token
    title: Vault token
    kind: cli-token
    tier: definite
    commands:
      - {name: vault, words: [print, token]}
    examples: ["vault print token"]
    counterexamples: ["vault token lookup", "vault status"]

  - id: heroku-token
    title: Heroku API token
    kind: cli-token
    tier: definite
    commands:
      - {name: heroku, words: ["auth:token"]}
    examples: ["heroku auth:token"]
    counterexamples: ["heroku auth:whoami"]

  - id: doctl-token
    title: DigitalOcean API token
    kind: cli-token
    tier: definite
    commands:
      - {name: doctl, words: [auth, token]}
    examples: ["doctl auth token"]
    counterexamples: ["doctl auth list"]

  - id: kubectl-token
    title: Kubernetes service account token, minted
    kind: cli-token
    tier: definite
    commands:
      - {name: kubectl, words: [create, token]}
    examples: ["kubectl create token default -n kube-system", "kubectl -n kube-system create token default"]
    counterexamples: ["kubectl create secret generic token --from-literal=a=b", "kubectl get secrets"]
