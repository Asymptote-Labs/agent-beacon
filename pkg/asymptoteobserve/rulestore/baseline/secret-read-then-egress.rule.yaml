id: secret-read-then-egress
spec: threat-rules/v1.2  # needed for e.command.parsed_commands (and correlation.order, v1.1)
version: 5
title: Secret-file read and network egress in one session
description: >
  Within one session, the agent reads a credential-bearing file and issues an
  outbound network command within a short window of it, in either order. Read then
  egress is the classic read-then-exfiltrate shape; egress then read is the same
  pair when an injected instruction says "run this, then read .env", and the
  unlinked single-event findings alone would not tie the two together. The rule
  fires once per session even when both orders occur. The egress command is read as
  bash: a network client the egress rules share (curl, wget, httpie, xh, nc, ncat,
  netcat, socat, by any path, under sudo, timeout or torsocks, or inside bash -c), a
  /dev/tcp redirect, a remote copy, a gist, a cloud storage upload or an inline
  script request; the same words inside a quoted string or a here-document are not
  egress. A command line that does not parse falls back to matching its text.
severity: high
status: stable
posture: detect
taxonomy:
  beacon_category: context-exfiltration
  owasp_llm: LLM06
  mitre_atlas: AML.T0024

correlation:
  scope: session
  window: 120s
  order: any
  steps:
    - id: read_secret
      match: >
        (
          e.event.action == "file.read" &&
          e.file.path.matches("(\\.env|credentials|id_rsa|\\.aws/|\\.ssh/|secrets?)") &&
